<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>典藏司 · 樟木箱底 · 第十幕</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" href="favicon.ico">
<link rel="icon" href="favicon.ico">
<link rel="icon" href="favicon.ico">
<style>
  /* ══ 色板：与第一–九幕逐字相同 —— 9 个 token + 既有平涂旧木 #b9a88c，不新增颜色 ══ */
  :root{
    --paper:#f3ecdf; --paper2:#eae1d0; --card:#faf6ec;
    --ink:#2a2622; --ink2:#5c554b; --faint:#8d8577;
    --zhu:#a63a2a; --line:#d3c8b4; --line2:#c0b49d;
    --l1:2.2px; --l2:1.4px; --l3:0.9px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Songti SC","STSong",Georgia,"Noto Serif SC",serif;
    display:flex; align-items:center; justify-content:center; padding:8px;
  }
  /* 舞台宽度取三处上界的最小值：视窗宽、1200、以及「视窗高 − 台账 64 − 上下留白 24」换算来的宽。
     只按宽度算（旧写法 min(97vw,1200px)）的话，窗口一矮舞台上下就被切（附录 A.2 / 坑 23）。*/
  #app{width:min(100%,1200px,calc((100vh - 88px) * 1.66667));min-height:0;display:flex;flex-direction:column}
  #stage{display:block;width:100%;height:auto;aspect-ratio:1200/720;background:var(--paper);overflow:hidden}
  #hud{flex:0 0 64px;height:64px;display:flex;align-items:center;gap:14px;
       background:var(--paper);border-top:1px solid var(--line2);padding:0 6px}
  #slots{display:flex;gap:4px}
  .slot{width:56px;height:56px;border:1px solid transparent;position:relative;cursor:default}
  .slot .under{position:absolute;left:8px;right:8px;bottom:6px;height:1px;background:var(--line2)}
  .slot svg{display:block;width:52px;height:52px;margin:1px;transition:transform 120ms ease}
  .slot.has{cursor:pointer}
  .slot.sel{border-color:var(--zhu)}
  .slot.sel svg{transform:translateY(-2px)}
  #caption{margin-left:auto;margin-right:8px;max-width:58%;
           font-family:"Kaiti SC","STKaiti","KaiTi",serif;
           font-size:13px;line-height:1.6;color:var(--ink2);text-align:right;
           opacity:0;transition:opacity 500ms ease}
  #caption.on{opacity:1}
  #caption.zhu{color:var(--zhu)}

  /* ══ 线宽三级（与前几幕同值；vector-effect 保证跨视图/跨缩放不漂移）══ */
  .l1{stroke:var(--ink);stroke-width:var(--l1);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l2{stroke:var(--ink2);stroke-width:var(--l2);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l3{stroke:var(--faint);stroke-width:var(--l3);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .miter{stroke-linejoin:miter}
  .f-wood{fill:#b9a88c}
  .f-card{fill:var(--card)}
  .f-zhu{fill:var(--zhu)}
  .tx{fill:var(--ink);font-family:"Songti SC","STSong",Georgia,serif}
  .tx-k{fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .tx-z{fill:var(--zhu);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .shadow{fill:var(--ink);opacity:.08;stroke:none;pointer-events:none}

  /* ══ 视图切换（本幕 2 个视图：庫房全景 + 箱底近景；台账与过渡页是覆盖层）══ */
  .view{opacity:0;pointer-events:none;transition:opacity 500ms ease}
  .view.active{opacity:1;pointer-events:auto}

  /* ══ 命中（修正 · 附录 A.4）════════════════════════════════════════════
     `.hs .hit` 写的是显式 `pointer-events:all`，那是**显式值**，压过祖先继承来的
     none；而 `opacity:0` 的元素**照常参与命中测试**。于是收起的台账、关着的幕间、
     没进去的近景里那些看不见的热区，仍在文档顺序更后的位置接得住鼠标 ——
     点这一件，被那一件截胡。这里把整棵子树钉死；**任何一条 .hit 的写法都没改**。*/
  .view:not(.active), .view:not(.active) *,
  #ledger:not(.on),   #ledger:not(.on) *,
  #bridge:not(.on),   #bridge:not(.on) *,
  .paper:not(.show),  .paper:not(.show) *{pointer-events:none!important}
  /* 上層（台账／幕间）压着时，底下场景整棵钉死 */
  #world.modal .view, #world.modal .view *{pointer-events:none!important}
  /* 纸层本身不吃点击，纸展开了才吃（判序里纸排在台账之前，见 click）*/
  #paper-layer{pointer-events:none}
  #paper-layer .paper.show{pointer-events:auto}

  /* ══ 热点：默认 / 可点 / 已取 三态光标 ══ */
  .hs{cursor:default}
  .hs .hit{fill:transparent;stroke:none;pointer-events:all}
  .hs.on .hit{cursor:pointer}
  .hs.on:hover .art path,.hs.on:hover .art rect,.hs.on:hover .art circle,
  .hs.on:hover .art ellipse,.hs.on:hover .art line,.hs.on:hover .art polygon{stroke:var(--zhu);stroke-width:3}
  .hs.armed .art path,.hs.armed .art rect,.hs.armed .art circle,
  .hs.armed .art ellipse,.hs.armed .art line,.hs.armed .art polygon{stroke:var(--zhu);stroke-width:3}
  .hs.on:hover .art text,.hs.armed .art text{fill:var(--zhu)}
  .hs.gone, .hs.gone *{pointer-events:none}
  .hs.gone .art{opacity:0}
  /* 已歸槽的那一槽：留在箱底、朱点现出，仍可点（点它只得到一句方位话）*/
  .hs.filled .art{transition:opacity 320ms ease}
  .hs.breathe .art *{stroke:var(--zhu)!important;animation:breathe 1.2s ease-in-out 2}
  @keyframes breathe{0%,100%{stroke-opacity:1}50%{stroke-opacity:.4}}

  /* ══ 视角规格（§十二）：屏幕坐标 = 正面坐标 + 深度·(0,−0.5)，k = 0.5 ══
     本幕深度预算：庫房地面随画面裁切 / 樟木箱箱蓋頂面進深 18（帶高 9）/
     箱體那道橫帶進深 0（竖直面）/ 案面 24（帶高 12）/ 箱底近景裡箱蓋掀起的那一面 0（竖直面）/
     箱底（水平面）進深 24（帶高 12）/ 箱前沿 0（竖直面）/
     十道槽（凹面，皆 0）、簏、無名封皮、銅鎖、印 皆 0（竖直面）。
     **全部 ≤ 80** —— 本幕没有超预算的构件。 */
  .floor{fill:var(--paper2);stroke:none}
  .slab{fill:var(--card);stroke:none}
  .recess{fill:var(--paper2);stroke:none}

  /* ══ 世界变化 ① 樟木箱：掀蓋 / 合蓋 ══ */
  #chest-lid{transition:transform 420ms ease}
  #chest.open #chest-lid{transform:translate(0,-30px)}
  #chest-mouth{opacity:0;transition:opacity 300ms ease}
  #chest.open #chest-mouth{opacity:1}
  #chest-shut{opacity:0;transition:opacity 360ms ease}
  #chest.shut #chest-shut{opacity:1}
  /* ══ 世界变化 ② 箱底近景：一道槽收進了一物（槽上現出一點朱與「已歸」）══ */
  .mark{opacity:0;transition:opacity 300ms ease}
  .hs.filled .mark{opacity:1}
  /* ══ 世界变化 ③ 箱蓋落下（合卷）══ */
  #lid-down{transform:translateY(-700px);opacity:0;
            transition:transform 460ms ease,opacity 300ms ease}
  #lid-down.on{transform:translateY(0);opacity:1}
  #lid-lock,#lid-seal{opacity:0;transition:opacity 340ms ease}
  #lid-lock.on,#lid-seal.on{opacity:1}
  /* ══ 世界变化 ④ 簏裡的牌數（取走一枚就少一枚）══ */
  #basket-n{transition:opacity 200ms ease}
  /* ══ 錯法：手上的東西抖一下（東西仍在原處）══ */
  @keyframes shake{0%,100%{transform:translateX(0)}35%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
  .shaking{animation:shake 130ms ease-in-out 2}
  /* ══ 錯法：牌順箱底滑回的那一下（現場變化，牌不消失、可立即重放）══ */
  @keyframes fall{0%{opacity:1}100%{opacity:0}}
  #tag-ghost{opacity:0}
  #tag-ghost.fall{animation:fall 460ms ease-in forwards}
  #tag-ghost.at-s1{transform:translate(15px,345px)}
  #tag-ghost.at-s2{transform:translate(159px,345px)}
  #tag-ghost.at-s3{transform:translate(303px,345px)}
  #tag-ghost.at-s4{transform:translate(447px,345px)}
  #tag-ghost.at-s5{transform:translate(591px,345px)}
  #tag-ghost.at-s6{transform:translate(15px,481px)}
  #tag-ghost.at-s7{transform:translate(159px,481px)}
  #tag-ghost.at-s8{transform:translate(303px,481px)}
  #tag-ghost.at-s9{transform:translate(447px,481px)}
  #tag-ghost.at-s10{transform:translate(591px,481px)}
  /* ══ 錯法累到三次：箱底留一塊 12% 朱砂（兩處各一組，不是新色）══ */
  #prints{opacity:0;transition:opacity 260ms ease}
  #prints.show{opacity:1}
  #prints2{opacity:0;transition:opacity 260ms ease}
  #prints2.show{opacity:1}
  /* ══ 拿在手上的東西離位微抬 ══ */
  .lift .art{opacity:.72}
  /* ══ 取走之後留在原處的那個位置（架上空了，痕迹还在）══ */
  #key-stand,#cover-stand,#lock-stand,#seal-stand{transition:opacity 300ms ease}
  #key-stand.taken,#cover-stand.taken,#lock-stand.taken,#seal-stand.taken{opacity:.30}

  /* ══ 纸（在場景內放大展開，不切屏、不加暗底遮罩）══ */
  .paper{opacity:0;pointer-events:none;transition:opacity 260ms ease}
  .paper.show{opacity:1;pointer-events:auto}
  .paper-title{font-size:21px;fill:var(--ink);letter-spacing:.18em}
  .paper-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  .paper-body{font-size:17px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.02em}
  .paper-body .key{font-size:19px}
  .paper-close{font-size:12px;fill:var(--faint);letter-spacing:.08em}

  /* ══ 外殼：典藏司「值房台账」（与前几幕同一套）══ */
  #ledger{opacity:0;pointer-events:none;transition:opacity 420ms ease}
  #ledger.on{opacity:1;pointer-events:auto}
  .led-lede{font-size:26px;fill:var(--ink);letter-spacing:.22em}
  .led-sub{font-size:13px;fill:var(--faint);letter-spacing:.12em}
  .led-item{font-size:19px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.04em}
  .led-item.done{fill:var(--faint)}
  .led-act{font-size:21px;fill:var(--ink);letter-spacing:.2em}
  .led-hint{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  #bridge{opacity:0;pointer-events:none;transition:opacity 380ms ease}
  #bridge.on{opacity:1;pointer-events:auto}
  .br-lede{font-size:22px;fill:var(--ink);letter-spacing:.2em}
  .br-body{font-size:16px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .br-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}

  #boot{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;
        justify-content:center;font-size:15px;color:var(--ink2);letter-spacing:.3em;z-index:9}
  #boot.gone{display:none}

  /* v0.20.13 手机端可读性：1200x720 舞台等比缩放后字太小，竖屏时给一条提示（不改玩法） */
  @media (max-width: 760px) and (orientation: portrait) {
    body::before {
      content: "建议横屏或使用电脑游玩，字体更清晰";
      position: fixed; left: 0; right: 0; top: 0; z-index: 9999;
      padding: 6px 8px; text-align: center;
      background: #a63a2a; color: #f3ecdf; font-size: 12px; letter-spacing: .04em;
    }
    body { padding-top: 26px; }
  }
</style>
<script src="_selftest/live.js" defer></script>

<body>

<div id="boot">樟木箱底</div>

<div id="app">
  <svg id="stage" viewBox="0 0 1200 720" shape-rendering="geometricPrecision"
       xmlns="http://www.w3.org/2000/svg" role="application" aria-label="典藏司樟木箱底 第十幕">
    <defs>
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
      </filter>
    </defs>
    <rect x="0" y="0" width="1200" height="720" fill="var(--paper)"/>
    <g id="world">

      <!-- ══════════════════ view-room：庫房深處（全景）══════════════════
           同一台虚拟相机、同一斜率 k=0.5（§十二）。进深预算全部 ≤ 80（见样式表注释）。
           庫房最深處那一具樟木箱合着 —— 箱底十道空槽，一槽承一幕之產出。 -->
      <g id="view-room" class="view active">

        <!-- ① 庫房地面（水平面）：遠邊在牆腳 y≈596，近邊落在画面之外 -->
        <path class="floor" d="M40,596.4 C300,594.6 700,597.2 1160,595.6 L1160,726 L40,726 Z"/>
        <path class="l3 miter" d="M150,664 C400,662.6 800,665 1090,662.8"/>
        <path class="l3 miter" d="M1136,620 C1137.2,650 1136.4,674 1137,694"/>
        <path class="l3 miter" d="M62,620 C61,650 61.8,674 61,694"/>
        <!-- ② 墙脚交界 -->
        <path class="l2" d="M40,596.6 C300,594.8 700,597.4 1160,595.8"/>

        <!-- A 檐梁（一根旧木横梁）＋ 梁上悬下的旧绳 -->
        <g class="scenery" pointer-events="none">
          <path class="l1 f-wood" d="M60,44.4 C420,42.6 800,45.2 1140,43.6 L1143,77.4 C800,79.2 420,76.6 60,78.4 Z"/>
          <path class="l3" d="M60,61.4 C420,59.6 800,62.2 1140,60.6"/>
          <path class="l3" d="M300,79.6 C298,150 298.6,240 297.4,300"/>
        </g>

        <!-- B 壁上「合卷體例」一纸（翻書可查；本幕自撰，非古籍引文）-->
        <g id="hs_rule" class="hs on" data-hs="h_rule">
          <rect class="hit" x="62" y="150" width="196" height="156"/>
          <g class="art">
            <path class="l1 f-card" d="M70,158.4 C124,156.6 196,159.2 248,157.6 L249,298.4 C196,300.2 124,297.6 70,299.4 Z"/>
            <text class="tx-k" x="159" y="186" font-size="14" text-anchor="middle">合卷體例</text>
            <path class="l3 miter" d="M86,212 L232,212 M86,238 L206,238 M86,264 L220,264"/>
          </g>
        </g>

        <!-- C 壁上「十幕所產一覽」一纸（翻書可查：一槽一幕，逐幕對照）-->
        <g id="hs_list" class="hs on" data-hs="h_list">
          <rect class="hit" x="276" y="150" width="196" height="156"/>
          <g class="art">
            <path class="l1 f-card" d="M284,158.4 C338,156.6 410,159.2 462,157.6 L463,298.4 C410,300.2 338,297.6 284,299.4 Z"/>
            <text class="tx-k" x="373" y="186" font-size="14" text-anchor="middle">十幕所產一覽</text>
            <path class="l3 miter" d="M300,212 L446,212 M300,238 L420,238 M300,264 L434,264"/>
          </g>
        </g>

        <!-- D 左首一具書架（架上是歷班留下的空函）-->
        <g class="scenery" pointer-events="none">
          <path class="l1 f-wood" d="M62,334.4 C110,332.6 200,335.2 246,333.6 L248,594.4 C200,596.2 110,593.6 62,595.4 Z"/>
          <path class="l1 miter" d="M76,348.4 C120,346.8 192,349.2 234,347.6 L235,580.4 C192,582.2 120,579.6 76,581.4 Z" fill="none"/>
          <path class="l2 miter" d="M78,412 L233,412 M78,478 L233,478 M78,544 L233,544"/>
          <path class="l3" d="M120,352 L120,578 M180,352 L180,578"/>
          <path class="l1 f-card" d="M86,356.4 C118,354.8 156,357.2 186,355.6 L187,406.4 C156,408.2 118,405.6 86,407.4 Z"/>
          <path class="l1 f-card" d="M92,418.4 C126,416.8 164,419.2 196,417.6 L197,470.4 C164,472.2 126,469.6 92,471.4 Z"/>
          <path class="l1 f-card" d="M86,484.4 C118,482.8 156,485.2 186,483.6 L187,538.4 C156,540.2 118,537.6 86,539.4 Z"/>
        </g>

        <!-- E 左首那張案（銅匙就擱在案上）-->
        <g class="scenery" pointer-events="none">
          <path class="l1 f-wood" d="M300,498.4 C368,496.6 448,499.2 512,497.6 L514,556.4 C448,558.2 368,555.6 300,557.4 Z"/>
          <path class="l3 miter" d="M320,500 L320,556 M494,500 L494,556"/>
          <path class="l1 f-wood" d="M316,556.4 C320,554.6 334,557.2 338,555.6 L339,596.4 C334,598.2 320,595.6 316,597.4 Z"/>
          <path class="l1 f-wood" d="M476,556.4 C480,554.6 494,557.2 498,555.6 L499,596.4 C494,598.2 480,595.6 476,597.4 Z"/>
          <path class="l2 miter" d="M300,556.6 C368,554.8 448,557.4 514,555.8"/>
        </g>

        <!-- F 樟木箱（合着；箱蓋頂面進深 18 → 帶高 9）-->
        <g id="chest" class="scenery" pointer-events="none">
          <g id="chest-lid">
            <path class="slab" d="M556,405.4 C720,403.6 880,406.2 1004,404.6 L1004,414 L556,414 Z"/>
            <path class="l1 f-wood" d="M552,414.4 C718,412.6 882,415.2 1008,413.6 L1008,428.4 C882,430.2 718,427.6 552,429.4 Z"/>
          </g>
          <g id="chest-mouth">
            <path class="recess" d="M560,415.4 C720,413.6 878,416.2 1000,414.6 L1000,428 L560,428 Z"/>
          </g>
          <path class="l1 f-wood" d="M556,428.4 C720,426.6 880,429.2 1004,427.6 L1006,596.4 C880,598.2 720,595.6 556,597.4 Z"/>
          <path class="l2 miter" d="M574,440 L988,440"/>
          <path class="l3 miter" d="M602,446 L602,590 M960,446 L960,590"/>
          <path class="l3 miter" d="M640,556 L922,556"/>
          <text class="tx-k" x="780" y="486" font-size="17" text-anchor="middle">樟 木 箱</text>
          <text class="tx-k" x="780" y="512" font-size="11" text-anchor="middle" fill="var(--faint)">箱底十道空槽</text>
          <g id="chest-shut">
            <path class="l2 miter" d="M766,414 L796,414 L796,436 L766,436 Z" fill="none"/>
            <circle cx="781" cy="446" r="6" class="l2" fill="none"/>
            <circle cx="858" cy="470" r="13" fill="var(--zhu)" opacity=".14"/>
            <text class="tx-k" x="858" y="475" font-size="12" text-anchor="middle" fill="var(--zhu)">兩存</text>
          </g>
        </g>

        <!-- G 箱上的銅搭扣（本幕第一件事：取匙挑開它）-->
        <g id="hs_latch" class="hs on" data-hs="h_latch">
          <rect class="hit" x="736" y="398" width="92" height="80"/>
          <g class="art">
            <path class="l1 f-wood" d="M762,410.4 C776,408.6 792,411.2 802,409.6 L803,442.4 C792,444.2 776,441.6 762,443.4 Z"/>
            <path class="l2 miter" d="M770,426 L796,426"/>
            <path class="l2" d="M782,442.6 C782,450 782,454 781,459"/>
            <circle cx="781" cy="464" r="5" class="l2" fill="none"/>
          </g>
        </g>

        <!-- H 案上那支銅匙 -->
        <g id="hs_key" class="hs on" data-hs="h_key">
          <rect class="hit" x="328" y="440" width="124" height="84"/>
          <g class="art">
            <g id="key-stand">
              <circle cx="356" cy="486" r="10" class="l2" fill="none"/>
              <path class="l1 f-card" d="M366,480.4 C400,478.6 428,481.2 452,479.6 L452,492.4 C428,494.2 400,491.6 366,493.4 Z"/>

<script>
"use strict";
(function(){

/* ══ 0. 存档：与第一–九幕同一把钥匙、同一结构（幕间协议 §1.3）════════════
   本幕（第十幕 · 終幕）写：act=10，往 done 追加 "act10"，《校勘记》追加本幕条目。
   **只加不改**：不改键名、不改任何既有字段的语义、不写迁移脚本。
   **本幕只往 inv 里放「本幕自己给得出的东西」**（銅匙、九枚歸卷牌、無名封皮、銅鎖、印），
   不假设「玩家还持有上一幕的物件」——第一幕暗格裡那一卷，本幕在箱子夾層裡又拿到一次。 */
var SAVE_KEY = "diandangsi.rustylake.v1";
var NOTES_KEY = "diandangsi.rustylake.v1.notes";
var ACT_NO = 10, ACT_ID = "act10";

/* ══ 1. 上一幕交下来的东西（跨幕累积的读入侧）════════════════════════
   读不到就是 null —— **照实说「沒讀到」，不假装办过**（协议 §1.3.3）。 */
var PREV = (function(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    var o = JSON.parse(raw);
    if(!o || !o.f) return null;
    return o;
  }catch(e){ return null; }
})();
function prevHas(k){ return !!(PREV && PREV.f && PREV.f[k]); }
function prevRead(k){ return !!(PREV && PREV.read && PREV.read.indexOf(k) >= 0); }
function prevDone(id){ return !!(PREV && PREV.done && PREV.done.indexOf && PREV.done.indexOf(id) >= 0); }

/* ══ 2. flags ═══════════════════════════════════════════════════════ */
var FLAG_KEYS = [
  "f_seen_act10","f_bridge_read","f_rule_read","f_list_read","f_close_entered",
  "f_key_taken","f_lid_open",
  "f_slot1_filled","f_slot2_filled","f_slot3_filled","f_slot4_filled","f_slot5_filled",
  "f_slot6_filled","f_slot7_filled","f_slot8_filled","f_slot9_filled","f_slot10_filled",
  "f_ten_slots_full","f_lid_shut","f_lock_taken","f_locked","f_seal_taken","f_sealed",
  "f_act10_done"
];
var F = {}, INV = [], READ = [], SEL = null, CAM = "room";

function resetState(){
  F = {}; FLAG_KEYS.forEach(function(k){ F[k]=false; });
  F.f_misplaced_count = 0;      /* 与第一–九幕同名同义：错的次数 */
  INV = []; READ = []; SEL = null; CAM = "room";
}

/* ══ 3. 存读档（幕间协议 §1.3：只加字段，不改字段语义，不改键名）══════ */
var saveT = null;
var DONE = (PREV && PREV.done && PREV.done.slice) ? PREV.done.slice() : [];
var NOTE_LOG = (PREV && PREV.notes && PREV.notes.slice) ? PREV.notes.slice() : [];
function markActDone(){
  if(F.f_act10_done && DONE.indexOf(ACT_ID) < 0) DONE.push(ACT_ID);
}
function appendNotes(){
  var es = noteEntries();
  for(var i=0;i<es.length;i++){
    var key = ACT_NO + "|" + es[i].h;
    var has = false;
    for(var j=0;j<NOTE_LOG.length;j++){ if(NOTE_LOG[j].key === key){ has = true; break; } }
    if(!has) NOTE_LOG.push({ key:key, act:ACT_NO, h:es[i].h, l:es[i].l });
  }
}
function saveNow(){
  try{
    markActDone(); appendNotes();
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      f:F, inv:INV, read:READ, cam:CAM, ts:Date.now(),
      act:ACT_NO, done:DONE, notes:NOTE_LOG
    }));
  }catch(e){}
}
function saveDebounced(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 300); }
function load(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    var o = JSON.parse(raw);
    if(!o || !o.f) return false;
    FLAG_KEYS.forEach(function(k){ if(k in o.f) F[k]=o.f[k]; });
    if(typeof o.f.f_misplaced_count === "number") F.f_misplaced_count = o.f.f_misplaced_count;
    INV = o.inv || []; READ = o.read || []; CAM = o.cam || "room";
    return true;
  }catch(e){ return false; }
}

function nextTagNo(){

    if(F["f_slot"+n+"_filled"]) continue;
    if(INV.indexOf("it_tag"+n) >= 0) continue;

/* ══ 8. 物品栏 ═══════════════════════════════════════════════════════ */
function give(id){ if(INV.indexOf(id) < 0) INV.push(id); renderInv(); applyArmed(); saveDebounced(); }
function take(id){ var i = INV.indexOf(id); if(i >= 0){ INV.splice(i,1); if(SEL===id) SEL=null; renderInv(); applyArmed(); saveDebounced(); } }
function renderInv(){
  slotsEl.innerHTML = "";

    var id = INV[i], it = ITEMS[id]; if(!it) continue;

/* ══ 10. 音效（可选；WebAudio 合成，不引音频文件）═══════════════════ */
var AC = null, SND = true;
function sfx(kind){
  if(!SND) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    var f = kind==="wood"?150 : kind==="board"?260 : kind==="leaf"?300 : 200;
    o.type = "sine";
    o.frequency.value = f;
    g.gain.value = 0.0001;
    o.connect(g); g.connect(AC.destination);
    g.gain.exponentialRampToValueAtTime(0.06, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.24);
    o.start(t); o.stop(t+0.26);
  }catch(e){}
}
$("#snd").addEventListener("click", function(e){
  e.stopPropagation(); SND = !SND;
  say(SND ? "聲 · 開" : "聲 · 閉", false, 1200);
  try{ localStorage.setItem("diandangsi.rustylake.settings", JSON.stringify({snd:SND})); }catch(e2){}
});

/* ══ 11. 环境文字（不是题目框）：只指方位，不给内容，不出判语 ════════ */

/* ══ 12. 值房台账（幕间切换的枢纽；与前几幕同一套 .led-*）════════════ */
var LEDGER = true;
/* 台账／幕间压着时给 #world 挂 .modal —— 底下那两棵场景整棵钉死（附录 A.4）。
   本幕 #ledger 在标记里就是 class="on"，起手便压着场景：少了这一处，
   看不见的热点照样接得住点击（修前实测走通第 00 步当场 MISS）。*/
function syncModal(){ var w = $("#world"); if(w) w.classList.toggle("modal", !!(LEDGER || bridgeOpen())); }
function showLedger(on){
  LEDGER = !!on;
  $("#ledger").classList.toggle("on", LEDGER);
  if(LEDGER){ closeBridge(); closePaperQuiet(); }
  if(LEDGER) renderLedger();
  syncModal();
}
function ledgerDone(){
  return [ !!F.f_lid_open,
           !!F.f_ten_slots_full,
           !!F.f_sealed ];
}
function renderLedger(){
  var done = ledgerDone();
  for(var i=0;i<3;i++){
    var dot = document.getElementById("led-dot-"+(i+1));
    var tx  = document.getElementById("led-tx-"+(i+1));
    if(!dot) continue;
    if(done[i]){ dot.setAttribute("fill","var(--zhu)"); dot.setAttribute("r","6"); dot.setAttribute("stroke","none"); }
    else { dot.setAttribute("fill","none"); dot.setAttribute("r","8"); dot.setAttribute("stroke","var(--ink2)"); }
    if(tx) tx.classList.toggle("done", !!done[i]);
  }
  var n = document.getElementById("hs_led_notes");
  if(n) n.classList.toggle("gone", !F.f_act10_done);
  var hint = $("#led-hint");
  if(hint){
    if(F.f_act10_done) hint.textContent = "差事已畢。箱子封上，全劇十幕畢 —— 點「取閱校勘記」。";
    else hint.textContent = "箱裡沒有題目 —— 只有十道空槽、九枚歸卷牌、一卷無名封皮。";
  }
}

/* ══ 13. 幕间过渡页：把上一幕交下来的东西念一遍 ═════════════════════ */
function openBridge(){
  var host = $("#bridge-lines");
  host.innerHTML = "";

                act5:"膳房", act6:"類書庫", act7:"抄書齋", act8:"塔院", act9:"藏書閣" };
  var ids = ["act1","act2","act3","act4","act5","act6","act7","act8","act9"];
  var got = [], i;
  for(i=0;i<ids.length;i++){
    if(prevDone(ids[i]) || prevHas("f_" + ids[i] + "_done")) got.push(ids[i]);
  }
  var n = got.length;
  lines.push("上一班在值房交下來的話：");

var NUM = ["〇","一","二","三","四","五","六","七","八","九","十"];
function render(){
  var i;
  /* ① 十槽既滿 —— **由点击链自然成立**，不是脚本直接改 flag */
  if(allSlotsFilled()) F.f_ten_slots_full = true;
  /* ② 樟木箱：掀蓋 / 合蓋 */
  var ch = document.getElementById("chest");
  if(ch){
    ch.classList.toggle("open", !!(F.f_lid_open && !F.f_lid_shut));
    ch.classList.toggle("shut", !!F.f_lid_shut);
  }
  /* ③ 十道槽：已歸的那一槽現出朱點與「已歸」*/
  for(i=1;i<=10;i++){
    var sg = document.getElementById("slot-" + i);
    if(sg) sg.classList.toggle("filled", !!F["f_slot"+i+"_filled"]);
  }
  /* ④ 箱蓋落下（合卷）/ 鎖 / 印 */
  var ld = document.getElementById("lid-down");   if(ld) ld.classList.toggle("on", !!F.f_lid_shut);
  var lk = document.getElementById("lid-lock");   if(lk) lk.classList.toggle("on", !!F.f_locked);
  var ls = document.getElementById("lid-seal");   if(ls) ls.classList.toggle("on", !!F.f_sealed);
  /* ⑤ 簏中的牌數 */
  var bn = document.getElementById("basket-n");
  if(bn){
    var left = basketLeft();
    bn.textContent = left > 0 ? ("簏中尚有" + NUM[left] + "牌") : "簏中牌盡";
  }
  /* ⑥ 取走的那幾件：原位淡下去 */
  var STANDS = { it_key:"key-stand", it_cover:"cover-stand", it_lock:"lock-stand", it_seal:"seal-stand" };
  for(var k2 in STANDS){
    var n2 = document.getElementById(STANDS[k2]);

  }
  /* ⑦ 收束：印落箱面之後，本幕的差事才算畢 */
  if(F.f_sealed) F.f_act10_done = true;
  /* ⑧ 錯法到三次：箱底留一块 12% 朱砂 */
  var pr = (F.f_misplaced_count|0) >= 3;
  var p1 = document.getElementById("prints");  if(p1) p1.classList.toggle("show", pr);
  var p2 = document.getElementById("prints2"); if(p2) p2.classList.toggle("show", pr);
  var nb = document.getElementById("hs_led_notes");
  if(nb) nb.classList.toggle("gone", !F.f_act10_done);
  renderLedger();
  renderInv(); applyArmed();
}

/* ══ 17. 失败回路：可复原、不锁死（与第一–九幕同一语法）═══════════════
   规则：任何一个放错的动作 = 现场变化（抖一下 / 牌順箱底滑回）+ 一句方位话。
   计数器只管「累了几次」。**绝不出判语。** */
function shake(hsId){
  var g = document.querySelector('.hs[data-hs="'+hsId+'"]');
  if(g){ g.classList.remove("shaking"); void g.offsetWidth; g.classList.add("shaking");
    setTimeout(function(){ g.classList.remove("shaking"); }, 300); }
}
function bump(hsId){
  shake(hsId);
  F.f_misplaced_count = (F.f_misplaced_count|0) + 1;
  render(); saveDebounced();
}
function ghostFall(id, ms){
  var gh = document.getElementById(id); if(!gh) return;
  gh.classList.remove("fall"); void gh.offsetWidth; gh.classList.add("fall");
  setTimeout(function(){ gh.classList.remove("fall"); }, ms+80);
}

var tapCount = {}, flagsAtTap = {};

  if(PAPER_OPEN){ closePaper(); return; }

  tapCount[id] = (tapCount[id]||0)+1;
  if(tapCount[id] >= 5 && flagsAtTap[id] === before){ hint(); tapCount[id] = 0; }
  if(tapCount[id] === 1) flagsAtTap[id] = before;
  var fn = H[id];

      var g1 = document.getElementById("tag-ghost");

      bump("h_slot" + n);

function useShut(){

var HINTS = {

};
var hintUsed = {}, lastHint = 0;
function hint(){
  var now = Date.now();
  if(now - lastHint < 180000) return;
  var order;
  if(!F.f_lid_open) order = ["latch","key","wall"];
  else if(CAM !== "close") order = ["go","wall","basket"];
  else if(!F.f_ten_slots_full) order = ["basket","slots","wall","cover"];
  else if(!F.f_sealed) order = ["lockseal","slots"];
  else order = ["slots","wall"];
  for(var i=0;i<order.length;i++){
    var k = order[i];
    if(hintUsed[k]) continue;
    hintUsed[k] = 1; lastHint = now;
    say(HINTS[k], false, 4200);
    return;
  }
}
var idleT = null;
function pokeIdle(){ clearTimeout(idleT); idleT = setTimeout(hint, 90000); }

/* ══ 21. 启动 ═══════════════════════════════════════════════════════ */
function boot(){
  buildSymbols();
  var restored = false;
  var AUTO = (location.hash.match(/auto=([a-z0-9]+)/i)||[])[1];
  var FRESH = /fresh/.test(location.hash);
  if(AUTO || FRESH){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} resetState(); }
  else restored = load();
  if(!restored) resetState();
  F.f_seen_act10 = true;
  render();
  setCam(CAM || "room");
  /* #ledger 在标记里就是 class="on"，起手便压着场景 —— boot() 不补这一次，
     底下那两棵场景就是「看不见却接得住点击」（修前实测走通第 00 步直接 MISS）*/
  syncModal();
  if(AUTO){ showLedger(true); }
  /* 截图探针（仅 ?probe= 时生效）：只摆 flags 与相机，不跳过任何交互分支 */
  var PROBE = (location.search.match(/[?&]probe=([a-z0-9]+)/i)||[])[1];
  if(/[?&]still=1/.test(location.search)){
    var st = document.createElement("style");
    st.textContent = "*{transition-duration:0s!important;animation-delay:0s!important}";
    document.head.appendChild(st);
  }
  function showRoom(){ showLedger(false); F.f_seen_act10 = true; setCam("room"); render(); }
  function showClose(){ showLedger(false); setCam("close"); render(); }
  function fillAll(){ for(var i=1;i<=10;i++){ F["f_slot"+i+"_filled"] = true; } }
  if(PROBE){
    if(PROBE === "room"){ showRoom(); }
    else if(PROBE === "close"){ F.f_lid_open = true; F.f_key_taken = true; showClose(); }
    else if(PROBE === "rule"){ showRoom(); showPaper("p_rule"); }
    else if(PROBE === "list"){ showRoom(); showPaper("p_list"); }
    else if(PROBE === "opened"){ F.f_lid_open = true; F.f_key_taken = true; showRoom(); }
    else if(PROBE === "filled"){ F.f_lid_open = true; F.f_key_taken = true; fillAll(); showClose(); }
    else if(PROBE === "shut"){ F.f_lid_open = true; F.f_key_taken = true; fillAll(); F.f_lid_shut = true; showClose(); }
    else if(PROBE === "locked"){
      F.f_lid_open = true; F.f_key_taken = true; fillAll();
      F.f_lid_shut = true; F.f_lock_taken = true; F.f_locked = true;
      showClose();
    }
    else if(PROBE === "sealed" || PROBE === "done"){
      F.f_lid_open = true; F.f_key_taken = true; fillAll();
      F.f_lid_shut = true; F.f_lock_taken = true; F.f_locked = true;
      F.f_seal_taken = true; F.f_sealed = true;
      showClose();
    }
    else if(PROBE === "notes"){
      F.f_lid_open = true; F.f_key_taken = true; fillAll();
      F.f_lid_shut = true; F.f_lock_taken = true; F.f_locked = true;
      F.f_seal_taken = true; F.f_sealed = true;
      showRoom(); showNotes();
    }
    else if(PROBE === "total"){
      /* 末页：全劇總目（總覽前面各幕）—— 只摆 flags 与页码，不跳过任何交互分支 */
      F.f_lid_open = true; F.f_key_taken = true; fillAll();
      F.f_lid_shut = true; F.f_lock_taken = true; F.f_locked = true;
      F.f_seal_taken = true; F.f_sealed = true;
      showRoom(); showNotes();
      notePage = noteEntries().length - 1; renderNotePage();
    }
    else if(PROBE === "bridge"){ showRoom(); openBridge(); }
    else if(PROBE === "bridgefull"){ load(); render(); setCam("room"); showLedger(false); openBridge(); }
    else if(PROBE === "ledger"){ showLedger(true); }
  }
  requestAnimationFrame(function(){ $("#boot").classList.add("gone"); });
  pokeIdle();
  if(AUTO) runAuto(AUTO);
  else if(restored) say("接着上次的地方。", false, 2400);
}

/* ══ 22. 自动走通：清档重来 + 只用真实 MouseEvent('click') 打真实 .hit ══
   脚本**不直接改任何 flag**：箱蓋靠「取匙 → 挑扣」自然掀开，十槽靠「簏取牌 → 點槽」
   自然成立，合卷靠「合蓋 → 落鎖 → 落印」自然成立 —— runAuto 里没有一处 F.xxx = true。 */
function click(hsId){
  var n = document.querySelector('.hs[data-hs="'+hsId+'"]');
  if(!n) return false;
  if(n.classList.contains("gone")) return false;
  var hit = n.querySelector(".hit") || n;
  if(!inActiveView(n)) return false;
  hit.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function clickEl(sel){
  var n = document.querySelector(sel);
  if(!n) return false;
  n.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function w(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function slotOf(itemId){
  var i = INV.indexOf(itemId); if(i < 0) return null;
  return document.querySelector('.slot[data-slot="'+i+'"]');
}
function pickSlot(itemId){
  if(SEL === itemId) return true;
  var s = slotOf(itemId); if(!s) return false;
  s.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return SEL === itemId;
}
async function runAuto(stop){
  var log = [];
  function step(name, ok){ log.push(name + "=" + (ok ? "ok" : "MISS")); }
  function report(){
    document.title = "SELFTEST::" + log.join(" | ")
      + " || FLAGS[" + FLAG_KEYS.filter(function(k){ return F[k]; }).join(",") + "]"
      + " || misplaced=" + F.f_misplaced_count
      + " || INV[" + INV.join(",") + "] || CAM=" + CAM
      + " || SLOT[" + slotsFilled() + "/10] BASKET=" + basketLeft()
      + " || READ[" + READ.join(",") + "]"
      + " || DONE[" + DONE.join(",") + "]";
    document.body.setAttribute("data-selftest", log.join(" | "));
  }
  var i, n;
  try{
    if(stop === "ledger"){ step("停在值房台賬", LEDGER); report(); return; }
    step("0_讀幕間", click("h_ledger_bridge")); await w(187);
    step("1_收起幕間", click("h_bridge_go")); await w(187);
    if(stop === "bridge"){ step("停在幕間", true); report(); return; }
    step("2_推門入庫", click("h_ledger_enter")); await w(209);
    /* ── 翻書可查：合卷體例 + 十幕所產一覽 ─────────────────────── */
    step("3_讀合卷體例", click("h_rule")); await w(165); closePaper(); await w(120);
    step("4_讀十幕一覽", click("h_list")); await w(165); closePaper(); await w(120);
    /* ── 錯法一：匙不在手就開搭扣（現場變化：抖 + 計數，可立即重放）── */
    step("5_錯法一_匙不在手就開搭扣", (function(){ click("h_latch"); return (F.f_misplaced_count|0) >= 1; })()); await w(220);
    step("6_錯法一已記_蓋未掀", !F.f_lid_open);
    /* ── 蓋未掀就走近：只抖一下、只給一句方位话，不計數 ─────────── */
    step("7_蓋未掀就想走近", (function(){ var b = (F.f_misplaced_count|0); click("h_go"); return (F.f_misplaced_count|0) === b && CAM === "room"; })()); await w(187);
    /* ── 取匙、挑扣、掀蓋 ─────────────────────────────────────── */
    step("8_取銅匙", (function(){ click("h_key"); return SEL === "it_key"; })()); await w(187);
    step("9_挑開搭扣_蓋掀起", (function(){ click("h_latch"); return !!F.f_lid_open; })()); await w(231);
    step("10_匙已歸案上", INV.indexOf("it_key") < 0);
    step("11_走近樟木箱", (function(){ click("h_go"); return CAM === "close"; })()); await w(341);
    step("12_在箱底近景", CAM === "close");
    /* ── 簏中出第一牌（五 · 膳房）──────────────────────────────── */
    step("13_取第一牌", (function(){ click("h_basket"); return SEL === "it_tag5"; })()); await w(187);
    /* ── 錯法二：手裡還捏着一牌，又去取另一牌 ─────────────────── */
    step("14_錯法二_手上有牌再取牌", (function(){ click("h_basket"); return (F.f_misplaced_count|0) >= 2; })()); await w(220);
    step("15_錯法二已記_手上仍是那一牌", SEL === "it_tag5");
    step("16_膳房牌歸第五槽", (function(){ click("h_slot5"); return !!F.f_slot5_filled; })()); await w(220);
    /* ── 錯法三：牌歸錯槽（牌順箱底滑回）──────────────────────── */
    step("17_取第二牌", (function(){ click("h_basket"); return SEL === "it_tag2"; })()); await w(176);
    step("18_錯法三_牌歸錯槽", (function(){ click("h_slot7"); return (F.f_misplaced_count|0) >= 3 && !F.f_slot7_filled; })()); await w(242);
    step("19_錯法三已記_牌仍在手", SEL === "it_tag2");
    step("20_熔銅作牌歸第二槽", (function(){ click("h_slot2"); return !!F.f_slot2_filled; })()); await w(198);
    /* ── 錯法四：十槽未滿就合蓋 ───────────────────────────────── */
    step("21_錯法四_十槽未滿就合蓋", (function(){ click("h_shut"); return (F.f_misplaced_count|0) >= 4; })()); await w(220);
    step("22_錯法四已記_蓋未合上", !F.f_lid_shut);
    step("23_空手點第十槽", (function(){ var b = (F.f_misplaced_count|0); click("h_slot10"); return (F.f_misplaced_count|0) === b; })()); await w(187);
    /* ── 其餘七牌逐牌歸槽（簏中固定次序：9,1,7,3,8,4,6）───────── */
    step("24_取第三牌", (function(){ click("h_basket"); return SEL === "it_tag9"; })()); await w(176);
    step("25_藏書閣牌歸第九槽", (function(){ click("h_slot9"); return !!F.f_slot9_filled; })()); await w(198);
    step("26_取第四牌", (function(){ click("h_basket"); return SEL === "it_tag1"; })()); await w(176);
    step("27_校書閣牌歸第一槽", (function(){ click("h_slot1"); return !!F.f_slot1_filled; })()); await w(198);
    step("28_取第五牌", (function(){ click("h_basket"); return SEL === "it_tag7"; })()); await w(176);
    step("29_抄書齋牌歸第七槽", (function(){ click("h_slot7"); return !!F.f_slot7_filled; })()); await w(198);
    step("30_取第六牌", (function(){ click("h_basket"); return SEL === "it_tag3"; })()); await w(176);
    step("31_校書堂牌歸第三槽", (function(){ click("h_slot3"); return !!F.f_slot3_filled; })()); await w(198);
    step("32_取第七牌", (function(){ click("h_basket"); return SEL === "it_tag8"; })()); await w(176);
    step("33_塔院牌歸第八槽", (function(){ click("h_slot8"); return !!F.f_slot8_filled; })()); await w(198);
    step("34_取第八牌", (function(){ click("h_basket"); return SEL === "it_tag4"; })()); await w(176);
    step("35_書庫走廊牌歸第四槽", (function(){ click("h_slot4"); return !!F.f_slot4_filled; })()); await w(198);
    step("36_取第九牌", (function(){ click("h_basket"); return SEL === "it_tag6"; })()); await w(176);
    step("37_類書庫牌歸第六槽", (function(){ click("h_slot6"); return !!F.f_slot6_filled; })()); await w(198);
    step("38_簏中牌盡", basketLeft() === 0);
    /* ── 第十槽：箱子夾層裡那一卷無名封皮 ─────────────────────── */
    step("39_取無名封皮", (function(){ click("h_cover"); return SEL === "it_cover"; })()); await w(187);
    step("40_封皮歸第十槽", (function(){ click("h_slot10"); return !!F.f_slot10_filled; })()); await w(242);
    step("41_十槽既滿", !!(F.f_ten_slots_full && allSlotsFilled()));
    /* ── 合卷：合蓋 → 落鎖 → 落印 ──────────────────────────────── */
    step("42_合蓋", (function(){ click("h_shut"); return !!F.f_lid_shut; })()); await w(242);
    step("43_取銅鎖", (function(){ click("h_lock"); return SEL === "it_lock"; })()); await w(187);
    step("44_落鎖_合卷", (function(){ click("h_shut"); return !!F.f_locked; })()); await w(242);
    step("45_取印", (function(){ click("h_seal"); return SEL === "it_seal"; })()); await w(187);
    step("46_落印_兩存", (function(){ click("h_shut"); return !!F.f_sealed; })()); await w(242);
    step("47_收束成立", !!F.f_act10_done);
    /* ── 收束：回庫中 → 開台账 → 校勘记（總覽各幕）───────────── */
    step("48_回庫中", (function(){ click("h_close_back"); return CAM === "room"; })()); await w(231);
    step("49_開台賬", (function(){ clickEl("#bk"); return LEDGER; })()); await w(209);
    step("50_校勘記", (function(){ click("h_ledger_notes"); return PAPER_OPEN === "__notes"; })()); await w(286);
    if(stop === "notes"){ report(); return; }
    /* 翻到最後一頁（全劇總目）—— 只用「後一條」那個命中面（x 固定為 W-134 = 566）*/
    for(i=0;i<24;i++){
      var nxt = null;
      paperLayer.querySelectorAll("rect").forEach(function(r){
        if(r.getAttribute("x") === "566") nxt = r;
      });
      if(!nxt) break;
      nxt.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
      await w(60);
    }
    step("51_校勘記末尾_全劇總目", (function(){
      var ts = paperLayer.querySelectorAll("text");
      var all = "";
      for(var q=0;q<ts.length;q++) all += ts[q].textContent;
      return all.indexOf("全劇總目") >= 0 && all.indexOf("已收束") >= 0;
    })());
    closePaper(); await w(132);
    step("52_再入庫", click("h_ledger_enter")); await w(209);
    step("53_收束_本幕已畢", !!F.f_act10_done);
  }catch(err){ log.push("ERR=" + (err && err.message)); }
  report();
}

window.__dd = { F:function(){ return F; }, INV:function(){ return INV; }, DONE:function(){ return DONE; },
  CAM:function(){ return CAM; }, click:click, setCam:setCam,
  auto:runAuto, inActiveView:inActiveView, slotsFilled:slotsFilled, basketLeft:basketLeft,
  hexOf:function(i){ return TEN[i].key; },
  state:function(){ return {F:F, INV:INV, CAM:CAM, SEL:SEL, DONE:DONE, READ:READ}; } };
/* 探针（_selftest/probe-accept-act10.html）需要按名调用这两个只切覆盖层/重绘的函数 */
window.showLedger = showLedger;
window.render = render;

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
})();
