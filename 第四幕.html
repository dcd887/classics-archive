<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>典藏司 · 書庫走廊 · 第四幕</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" href="favicon.ico">
<link rel="icon" href="favicon.ico">
<link rel="icon" href="favicon.ico">
<style>
  /* ══ 色板：与第一、二、三幕逐字相同 —— 9 个 token + 既有平涂旧木 #b9a88c，不新增第 8 色 ══ */
  :root{
    --paper:#f3ecdf; --paper2:#eae1d0; --card:#faf6ec;
    --ink:#2a2622; --ink2:#5c554b; --faint:#8d8577;
    --zhu:#a63a2a; --line:#d3c8b4; --line2:#c0b49d;
    --l1:2.2px; --l2:1.4px; --l3:0.9px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Songti SC","STSong",Georgia,"Noto Serif SC",serif;
    display:flex; align-items:center; justify-content:center; padding:8px;
  }
  /* ══ 窗口自適應（附錄 A.2 / 坑 23）══════════════════════════════════════
     舞台恆為 1200:720。寬度同時受三個上界約束：視窗寬 − 16、設計寬 1200、
     以及「視窗高 − 台賬 64 − 上下留白 16」換算過來的寬。三者取最小 —— 於是
     任何窗口比例下整幅畫面等比完整可見：不裁切左右，也不裁切上下，
     並且 html/body 已 overflow:hidden，不會出現滾動條。
     （舊版只顧寬度：min(97vw,1200px)，高度一旦不夠就上下被切；此為修因。）*/
  #app{width:min(100%,1200px,calc((100vh - 80px) * 1.66667));display:flex;flex-direction:column;min-height:0}
  #stage{display:block;width:100%;height:auto;aspect-ratio:1200/720;background:var(--paper);overflow:hidden}
  #hud{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:14px;
       background:var(--paper);border-top:1px solid var(--line2);padding:0 6px}
  #slots{display:flex;gap:4px}
  .slot{width:56px;height:56px;border:1px solid transparent;position:relative;cursor:default}
  .slot .under{position:absolute;left:8px;right:8px;bottom:6px;height:1px;background:var(--line2)}
  .slot svg{display:block;width:52px;height:52px;margin:1px;transition:transform 120ms ease}
  .slot.has{cursor:pointer}
  .slot.sel{border-color:var(--zhu)}
  .slot.sel svg{transform:translateY(-2px)}
  #caption{margin-left:auto;margin-right:8px;max-width:62%;
           font-family:"Kaiti SC","STKaiti","KaiTi",serif;
           font-size:13px;line-height:1.6;color:var(--ink2);text-align:right;
           opacity:0;transition:opacity 500ms ease}
  #caption.on{opacity:1}
  #caption.zhu{color:var(--zhu)}

  /* ══ 线宽三级（与前几幕同值；vector-effect 保证跨视图/跨缩放不漂移）══ */
  .l1{stroke:var(--ink);stroke-width:var(--l1);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l2{stroke:var(--ink2);stroke-width:var(--l2);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l3{stroke:var(--faint);stroke-width:var(--l3);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .miter{stroke-linejoin:miter}
  .f-wood{fill:#b9a88c}
  .f-card{fill:var(--card)}
  .f-zhu{fill:var(--zhu)}
  .tx{fill:var(--ink);font-family:"Songti SC","STSong",Georgia,serif}
  .tx-k{fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .tx-z{fill:var(--zhu);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .shadow{fill:var(--ink);opacity:.08;stroke:none}

  /* ══ 视图切换（本幕 2 个视图：走廊全景 + 券車近景；台账与过渡页是覆盖层）══ */
  .view{opacity:0;pointer-events:none;transition:opacity 500ms ease}
  .view.active{opacity:1;pointer-events:auto}

  /* ══ 命中（修正）：非活動層的整棵子樹都不收鼠標 ═════════════════════════
     【原本的病灶】.hs .hit{pointer-events:all} 是「顯式值」，會蓋掉祖先
     .view{pointer-events:none} 的繼承；而 opacity:0 的元素照樣參與命中測試。
     兩者相乘：看不見的 #view-cart 與收起的 #ledger / #bridge 裏的透明 .hit
     矩形仍然接得住鼠標，且因為文檔順序在後而蓋在上面 —— 真人點下去，命中的是
     「別人家的透明矩形」。而 #ledger / #bridge 的熱點沒有 .view 祖先，
     inActiveView() 判它為真，於是還會「按錯鍵」（點「幕間」卻執行「收起·入廊」）。
     【修法】不改任何 .hit 的既有寫法（#auto 自檢仍走同一條路），只把非活動層
     整個子樹用 !important 釘死；動畫照舊，只是動畫期間那一層不吃鼠標。*/
  .view:not(.active), .view:not(.active) *,
  #ledger:not(.on), #ledger:not(.on) *,
  #bridge:not(.on), #bridge:not(.on) *,
  .paper:not(.show), .paper:not(.show) *{pointer-events:none!important}
  /* 上層（值房台账／幕間過渡頁）壓着時，底下場景整棵釘死（syncModal 掛 .modal）*/
  #world.modal .view, #world.modal .view *{pointer-events:none!important}
  /* 展開中的紙頁維持原樣：自己吃鼠標，於是不會漏點到紙後面那些熱點 */
  #paper-layer{pointer-events:none}
  #paper-layer .paper.show{pointer-events:auto}

  /* ══ 热点：默认 / 可点 / 已取 三态光标 ══ */
  .hs{cursor:default}
  .hs .hit{fill:transparent;stroke:none;pointer-events:all}
  .hs.on .hit{cursor:pointer}
  .hs.on:hover .art path,.hs.on:hover .art rect,.hs.on:hover .art circle,
  .hs.on:hover .art ellipse,.hs.on:hover .art line,.hs.on:hover .art polygon{stroke:var(--zhu);stroke-width:3}
  .hs.armed .art path,.hs.armed .art rect,.hs.armed .art circle,
  .hs.armed .art ellipse,.hs.armed .art line,.hs.armed .art polygon{stroke:var(--zhu);stroke-width:3}
  .hs.on:hover .art text,.hs.armed .art text{fill:var(--zhu)}
  .hs.gone, .hs.gone *{pointer-events:none}
  .hs.gone .art{opacity:0}
  .hs.breathe .art *{stroke:var(--zhu)!important;animation:breathe 1.2s ease-in-out 2}
  @keyframes breathe{0%,100%{stroke-opacity:1}50%{stroke-opacity:.4}}

  /* ══ 视角规格（§十二）：屏幕坐标 = 正面坐标 + 深度·(0,−0.5)，k = 0.5 ══
     本幕深度预算：走廊地面随画面裁切 / 書格層板進深 20 / 券車 車板進深 60（帶高 30）/
     券車近景 車板進深 80（帶高 40）/ 車上券疊進深 6 / 目籤架 枨面進深 16。
     **全部 ≤ 80** —— 本幕没有超预算的构件。 */
  .floor{fill:var(--paper2);stroke:none}
  .slab{fill:var(--card);stroke:none}

  /* ══ 世界变化 ① 舊籤從車頭牌上取下來（牌上留一個釘孔）══ */
  #room-plate-sign,#plate-sign{transition:opacity 320ms ease}
  #room-plate-sign.gone,#plate-sign.gone{opacity:0}
  /* ══ 世界变化 ② 三紙綴成一券（接縫線與朱序出現）══ */
  #order-marks{opacity:0;transition:opacity 420ms ease}
  #order-marks.on{opacity:1}
  /* ══ 世界变化 ③ 目籤押在車頭牌上（押上就不再取下）══ */
  #pinned{opacity:0;transition:opacity 360ms ease}
  #pinned.on{opacity:1}
  /* ══ 世界变化 ④ 車頭牌上多一枚朱印（收束）══ */
  #seal{opacity:0;transition:opacity 420ms ease}
  #seal.on{opacity:1}
  /* ══ 錯法一：放下的東西抖一下（東西仍在原處）══ */
  @keyframes shake{0%,100%{transform:translateX(0)}35%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
  .shaking{animation:shake 130ms ease-in-out 2}
  /* ══ 錯法二：押錯的那支籤從牌上滑落（現場變化，籤不消失，回手上的路）══ */
  #plate-ghost{opacity:0}
  #plate-ghost.fall{animation:fall 560ms ease-in forwards}
  @keyframes fall{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(52px)}}
  /* ══ 壁上朱印（錯法累到三次才出現，一塊 12% 朱砂，不是新色）══ */
  #prints{opacity:0;transition:opacity 260ms ease}
  #prints.show{opacity:1}
  /* ══ 拿起的那一張紙離板微抬 ══ */
  .lift .art{opacity:.72}

  /* ══ 纸（在場景內放大展開，不切屏、不加暗底遮罩）══ */
  .paper{opacity:0;pointer-events:none;transition:opacity 260ms ease}
  .paper.show{opacity:1;pointer-events:auto}
  .paper-title{font-size:21px;fill:var(--ink);letter-spacing:.18em}
  .paper-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  .paper-body{font-size:17px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.02em}
  .paper-body .key{font-size:19px}
  .paper-close{font-size:12px;fill:var(--faint);letter-spacing:.08em}

  /* ══ 外殼：典藏司「值房台账」（与前几幕同一套）══ */
  #ledger{opacity:0;pointer-events:none;transition:opacity 420ms ease}
  #ledger.on{opacity:1;pointer-events:auto}
  .led-lede{font-size:26px;fill:var(--ink);letter-spacing:.22em}
  .led-sub{font-size:13px;fill:var(--faint);letter-spacing:.12em}
  .led-item{font-size:19px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.04em}
  .led-item.done{fill:var(--faint)}
  .led-act{font-size:21px;fill:var(--ink);letter-spacing:.2em}
  .led-hint{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  #bridge{opacity:0;pointer-events:none;transition:opacity 380ms ease}
  #bridge.on{opacity:1;pointer-events:auto}
  .br-lede{font-size:22px;fill:var(--ink);letter-spacing:.2em}
  .br-body{font-size:16px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .br-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}

  #boot{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;
        justify-content:center;font-size:15px;color:var(--ink2);letter-spacing:.3em;z-index:9}
  #boot.gone{display:none}

  /* v0.20.13 手机端可读性：1200x720 舞台等比缩放后字太小，竖屏时给一条提示（不改玩法） */
  @media (max-width: 760px) and (orientation: portrait) {
    body::before {
      content: "建议横屏或使用电脑游玩，字体更清晰";
      position: fixed; left: 0; right: 0; top: 0; z-index: 9999;
      padding: 6px 8px; text-align: center;
      background: #a63a2a; color: #f3ecdf; font-size: 12px; letter-spacing: .04em;
    }
    body { padding-top: 26px; }
  }
</style>
</head>
<body>

<div id="boot">書庫走廊</div>

<div id="app">
  <svg id="stage" viewBox="0 0 1200 720" shape-rendering="geometricPrecision"
       xmlns="http://www.w3.org/2000/svg" role="application" aria-label="典藏司書庫走廊 第四幕">
    <defs>
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
      </filter>
    </defs>
    <rect x="0" y="0" width="1200" height="720" fill="var(--paper)"/>
    <g id="world">

      <!-- ══════════════════ view-room：書庫走廊（全景）══════════════════
           同一台虚拟相机、同一斜率 k=0.5（§十二）。进深预算全部 ≤ 80（见样式表注释）。 -->
      <g id="view-room" class="view active">

        <!-- ① 走廊地面（水平面）：远边在墙脚 y≈590，近边落在画面之外 -->
        <path class="floor" d="M40,590.4 C300,588.6 700,591.2 1160,589.6 L1160,726 L40,726 Z"/>
        <path class="l3 miter" d="M150,660 C400,658.6 800,661 1090,658.8"/>
        <path class="l3 miter" d="M1136,612 C1137.2,644 1136.4,668 1137,690"/>
        <path class="l3 miter" d="M62,612 C61,644 61.8,668 61,690"/>
        <!-- ② 墙脚交界：家具压其上，只在空处露头 -->
        <path class="l2" d="M40,590.6 C300,588.8 700,591.4 1160,589.8"/>

        <!-- A 檐梁（一根旧木横梁，横贯后墙上沿）＋ 梁上悬下的一根旧绳 -->
        <g class="scenery">
          <path class="l1 f-wood" d="M60,44.4 C420,42.6 800,45.2 1140,43.6 L1143,77.4 C800,79.2 420,76.6 60,78.4 Z"/>
          <path class="l3" d="M60,61.4 C420,59.6 800,62.2 1140,60.6"/>
        </g>
        <g class="scenery" pointer-events="none">
          <path class="l3" d="M690,79.6 C688,140 688.6,200 687.4,262"/>
        </g>

        <!-- B 左壁書格（三層：層板是水平小面，進深 20 → 可见带高 10px）-->
        <g class="scenery" pointer-events="none">
          <path class="l1 f-wood" d="M44,110.4 C120,108.6 226,111.2 296,109.6 L298,590.4 C226,592.2 120,589.6 44,591.4 Z"/>
          <path class="l1 miter" d="M60,126.4 C130,124.8 220,127.2 280,125.6 L282,574.4 C220,576.2 130,573.6 60,575.4 Z"/>
          <path class="slab" d="M60,262.4 C130,260.8 220,263.2 282,261.6 L282,271.4 C220,273.2 130,270.6 60,272.4 Z"/>
          <path class="slab" d="M60,404.4 C130,402.8 220,405.2 282,403.6 L282,413.4 C220,415.2 130,412.6 60,414.4 Z"/>
          <path class="slab" d="M60,522.4 C130,520.8 220,523.2 282,521.6 L282,531.4 C220,533.2 130,530.6 60,532.4 Z"/>
          <path class="l3 miter" d="M170,126 L170,574 M110,262 L110,272 M240,262 L240,272 M110,404 L110,414 M240,404 L240,414"/>
        </g>

        <!-- C 右壁書格（同式，镜像）-->
        <g class="scenery" pointer-events="none">
          <path class="l1 f-wood" d="M902,110.4 C978,108.6 1084,111.2 1156,109.6 L1158,590.4 C1084,592.2 978,589.6 902,591.4 Z"/>
          <path class="l1 miter" d="M918,126.4 C988,124.8 1078,127.2 1140,125.6 L1142,574.4 C1078,576.2 988,573.6 918,575.4 Z"/>
          <path class="slab" d="M918,262.4 C988,260.8 1078,263.2 1142,261.6 L1142,271.4 C1078,273.2 988,270.6 918,272.4 Z"/>
          <path class="slab" d="M918,404.4 C988,402.8 1078,405.2 1142,403.6 L1142,413.4 C1078,415.2 988,412.6 918,414.4 Z"/>
          <path class="slab" d="M918,522.4 C988,520.8 1078,523.2 1142,521.6 L1142,531.4 C1078,533.2 988,530.6 918,532.4 Z"/>
          <path class="l3 miter" d="M1030,126 L1030,574 M970,262 L970,272 M1090,262 L1090,272 M970,404 L970,414 M1090,404 L1090,414"/>
        </g>

        <!-- D 走廊盡頭的一道門（竖直面，不产生水平面问题）＋ 門上一方匾 -->
        <g class="scenery" pointer-events="none">
          <path class="l1 f-wood" d="M528,122.4 C570,120.6 620,123.2 654,121.6 L655,168.4 C620,170.2 570,167.6 528,169.4 Z"/>
        </g>
        <text class="tx-k" x="591" y="154" font-size="20" text-anchor="middle" letter-spacing="6">書庫</text>
        <g class="scenery" pointer-events="none">
          <path class="l1 f-wood" d="M520,192.4 C560,190.6 620,193.2 660,191.6 L660,368.4 C620,370.2 560,367.6 520,369.4 Z"/>
          <path class="l1 f-card" d="M534,206.4 C566,204.8 616,207.2 648,205.6 L648,354.4 C616,356.2 566,353.6 534,355.4 Z"/>
          <path class="l2 miter" d="M556,234 L626,234 M556,326 L626,326"/>
          <path class="l3" d="M604,278 L622,278"/>
        </g>

        <!-- E 架上兩部書（各自的 hotspot；不相邻、不嵌套）-->
        <g id="hs_book_yanshi" class="hs on" data-hs="h_book_yanshi">
          <rect class="hit" x="74" y="146" width="134" height="184"/>
          <g class="art">
            <path class="l1 f-card" d="M88,156.4 L196,154.6 L197,322.4 L89,324.2 Z"/>
            <text class="tx-k" x="142" y="186" font-size="14" text-anchor="middle">顏氏家訓</text>
            <path class="l3" style="stroke:var(--zhu)" d="M104,214 L180,214 M104,236 L156,236 M104,258 L172,258"/>
          </g>
        </g>
        <g id="hs_book_hanshu" class="hs on" data-hs="h_book_hanshu">
          <rect class="hit" x="198" y="146" width="128" height="180"/>
          <g class="art">
            <path class="l1 f-card" d="M210,156.4 L308,154.6 L309,318.4 L211,320.2 Z"/>
            <text class="tx-k" x="259" y="186" font-size="14" text-anchor="middle">漢書</text>
            <path class="l3" style="stroke:var(--zhu)" d="M226,214 L292,214 M226,236 L266,236"/>
          </g>
        </g>

        <!-- F 壁上「書庫體例」一紙（翻書可查；本幕自撰，非古籍引文）-->
        <g id="hs_rule" class="hs on" data-hs="h_rule">
          <rect class="hit" x="76" y="362" width="220" height="160"/>
          <g class="art">
            <path class="l1 f-card" d="M84,372.4 C150,370.6 230,373.2 288,371.6 L289,514.4 C230,516.2 150,513.6 84,515.4 Z"/>
            <text class="tx-k" x="186" y="398" font-size="14" text-anchor="middle">書庫體例</text>
            <path class="l3 miter" d="M104,418 L268,418 M104,442 L238,442 M104,466 L256,466 M104,490 L216,490"/>
          </g>
        </g>

        <!-- G 壁上「勘異」一籤（兩部辭書所引同一句的兩種字形）-->
        <g id="hs_tan" class="hs on" data-hs="h_tan">
          <rect class="hit" x="944" y="164" width="160" height="120"/>
          <g class="art">
            <path class="l1 f-card" d="M956,172.4 L1092,170.6 L1093,272.4 L957,274.2 Z"/>
            <text class="tx-k" x="1024" y="200" font-size="15" text-anchor="middle">勘異 · 紙／張</text>
            <path class="l3" style="stroke:var(--zhu)" d="M978,224 L1070,224 M978,246 L1036,246"/>
            <circle class="l2" cx="1000" cy="262" r="7" fill="none"/>
          </g>
        </g>

        <!-- H 一車待歸檔的券契（点它進券車近景）-->
        <g id="hs_cart" class="hs on" data-hs="h_cart">
          <rect class="hit" x="404" y="388" width="404" height="286"/>
          <g class="art">
            <path class="l3 f-card" d="M556,404.4 C600,402.8 660,405.2 700,403.6 L700,431.4 C660,433.2 600,430.6 556,432.4 Z"/>
            <path class="l1 f-card" d="M536,396.4 C588,394.6 664,397.2 716,395.6 L716,429.4 C664,431.2 588,428.6 536,430.4 Z"/>
            <path class="floor" d="M436,430.4 C540,428.6 660,431.2 790,429.6 L790,459.4 C660,461.2 540,458.6 436,460.4 Z"/>
            <path class="l1" d="M436,430.4 C540,428.6 660,431.2 790,429.6 L790,459.4 C660,461.2 540,458.6 436,460.4 L436,430.4 Z"/>
            <path class="l3 miter" d="M540,430 L540,459 M620,429.6 L620,459 M700,429.4 L700,458.6"/>
            <path class="l1 f-wood" d="M436,460.4 C540,458.6 660,461.2 790,459.4 L790,472.4 C660,474.2 540,471.6 436,473.4 Z"/>
            <circle class="l1 f-wood" cx="500" cy="578" r="36"/>

   **只加不改**：不改键名、不改任何既有字段的语义、不写迁移脚本。

var SAVE_KEY = "diandangsi.rustylake.v1";
var NOTES_KEY = "diandangsi.rustylake.v1.notes";
var ACT_NO = 4, ACT_ID = "act4";

/* ══ 1. 上一幕交下来的东西（跨幕累积的读入侧）════════════════════════
   读不到就是 null —— **照实说「沒讀到」，不假装办过**（协议 §1.3.3）。 */
var PREV = (function(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    var o = JSON.parse(raw);
    if(!o || !o.f) return null;
    return o;
  }catch(e){ return null; }
})();
function prevHas(k){ return !!(PREV && PREV.f && PREV.f[k]); }
function prevRead(k){ return !!(PREV && PREV.read && PREV.read.indexOf(k) >= 0); }
function prevDone(id){ return !!(PREV && PREV.done && PREV.done.indexOf && PREV.done.indexOf(id) >= 0); }

/* ══ 2. flags ═══════════════════════════════════════════════════════ */

];

var ORDER = [1,2,0], MOVE_SEL = null;
var ORDER_START = [1,2,0];
var SIGN_KEY = { it_old_lu:"lu", it_sign_ma:"ma", it_sign_qian:"qian", it_sign_che:"che", it_sign_boshi:"boshi" };

function resetState(){
  F = {}; FLAG_KEYS.forEach(function(k){ F[k]=false; });

  INV = []; READ = []; SEL = null; CAM = "room";
  ORDER = ORDER_START.slice(); MOVE_SEL = null;

function appendNotes(){
  var es = noteEntries();

    var key = ACT_NO + "|" + es[i].h;
    var has = false;
    for(var j=0;j<NOTE_LOG.length;j++){ if(NOTE_LOG[j].key === key){ has = true; break; } }
    if(!has) NOTE_LOG.push({ key:key, act:ACT_NO, h:es[i].h, l:es[i].l });
  }
}

  try{

  if(!SND) return;
  try{

    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    var f = kind==="wood"?150 : kind==="tag"?300 : kind==="paper"?240 : 200;
    o.type = kind==="wood" ? "triangle" : "sine";
    o.frequency.value = f;

    g.gain.exponentialRampToValueAtTime(0.0001, t+(kind==="wood"?0.40:0.22));
    o.start(t); o.stop(t+(kind==="wood"?0.42:0.24));
  }catch(e){}
}

    if(hintUsed[k]) continue;
    hintUsed[k] = 1; lastHint = now;
    say(HINTS[k], false, 4200);
    return;
  }
}
var idleT = null;
function pokeIdle(){ clearTimeout(idleT); idleT = setTimeout(hint, 90000); }
document.addEventListener("mousemove", pokeIdle, {passive:true});
document.addEventListener("keydown", pokeIdle);

/* ══ 19. 事件绑定 ═══════════════════════════════════════════════════ */
function inActiveView(node){
  var v = node.closest ? node.closest(".view") : null;
  return !v || v.classList.contains("active");
}
stage.addEventListener("click", function(e){
  var hs = e.target.closest ? e.target.closest(".hs") : null;
  if(hs && hs.dataset.hs && !hs.classList.contains("gone")){
    if(inActiveView(hs)) onHotspot(hs.dataset.hs);
    return;
  }
  if(bridgeOpen()){ return; }
  /* 判序：熱點 → 過渡頁 → 紙 → 台账（附錄 A.5 坑 24）
     紙（#paper-layer）畫在 #ledger 之後、壓在它上面；舊判序 `if(LEDGER) return`
     先返回 → 簿子開着時校勘記那一頁永遠收不掉，只能按 Esc。*/
  if(PAPER_OPEN){ closePaper(); return; }
  if(LEDGER) return;
  if(CAM !== "room") goRoom();
});
$("#bk").addEventListener("click", function(e){ e.stopPropagation(); showLedger(true); });
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    if(bridgeOpen()){ closeBridge(); return; }
    if(LEDGER){ showLedger(false); return; }
    if(PAPER_OPEN) closePaper(); else if(CAM !== "room") goRoom();
  }
  var k = (e.key||"").toLowerCase();
  if(k === "b") showLedger(!LEDGER);
  if(k === "1") setCam("room");
  if(k === "2") setCam("cart");
});

/* ══ 20. 启动 ═══════════════════════════════════════════════════════ */
function boot(){
  buildSymbols();
  var restored = false;
  var AUTO = (location.hash.match(/auto=([a-z0-9]+)/i)||[])[1];
  var FRESH = /fresh/.test(location.hash);
  if(AUTO || FRESH){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} resetState(); }
  else restored = load();
  if(!restored) resetState();
  F.f_seen_act4 = true;
  render();
  setCam(CAM || "room");
  /* 值房台账在標記裏就是 class="on"（起手壓在場景上）—— 這裏要主動同步一次 .modal，
     否則底下那些看不見的熱點照樣接得住點擊（附錄 A.4 特別點名 boot() 這一次）。*/
  syncModal();
  if(AUTO){ showLedger(true); }
  /* 截图探针（仅 ?probe= 时生效）：只摆 flags 与相机与三紙之序，不跳过任何交互分支 */
  var PROBE = (location.search.match(/[?&]probe=([a-z0-9]+)/i)||[])[1];
  if(/[?&]still=1/.test(location.search)){
    var st = document.createElement("style");
    st.textContent = "*{transition-duration:0s!important;animation-delay:0s!important}";
    document.head.appendChild(st);
  }
  function showRoom(){ showLedger(false); F.f_seen_act4 = true; setCam("room"); render(); }
  function showCart(){ showLedger(false); setCam("cart"); render(); }
  if(PROBE){
    if(PROBE === "room"){ showRoom(); }
    else if(PROBE === "cart"){ showCart(); }
    else if(PROBE === "paperq"){ showRoom(); showPaper("p_q_b"); }
    else if(PROBE === "papersign"){ showRoom(); showPaper("p_zheng"); }
    else if(PROBE === "bridge"){ showRoom(); openBridge(); }
    else if(PROBE === "bridgefull"){ load(); render(); setCam("room"); showLedger(false); openBridge(); }
    else if(PROBE === "read"){
      F.f_rule_read = true; F.f_book_yanshi_read = true; F.f_book_hanshu_read = true; F.f_tan_read = true;
      F.f_q_a_read = true; F.f_q_b_read = true; F.f_q_c_read = true;
      showCart();
    }
    else if(PROBE === "order"){
      F.f_rule_read = true; F.f_q_a_read = true; F.f_q_b_read = true; F.f_q_c_read = true;
      ORDER = [0,1,2]; F.f_order_ok = true; showCart();
    }
    else if(PROBE === "done"){
      F.f_rule_read = true; F.f_book_yanshi_read = true; F.f_book_hanshu_read = true; F.f_tan_read = true;
      F.f_q_a_read = true; F.f_q_b_read = true; F.f_q_c_read = true;
      ORDER = [0,1,2]; F.f_order_ok = true; F.f_old_taken = true; F.f_sign_taken = true;
      F.f_sign_ok = true; F.f_act4_done = true; showCart();
    }
    else if(PROBE === "notes"){
      F.f_rule_read = true; F.f_book_yanshi_read = true; F.f_book_hanshu_read = true; F.f_tan_read = true;
      F.f_q_a_read = true; F.f_q_b_read = true; F.f_q_c_read = true;
      ORDER = [0,1,2]; F.f_order_ok = true; F.f_old_taken = true; F.f_sign_ok = true; F.f_act4_done = true;
      showRoom(); showNotes();
    }
  }
  requestAnimationFrame(function(){
    $("#boot").classList.add("gone");
  });
  pokeIdle();
  if(AUTO) runAuto(AUTO);
  else if(restored) say("接着上次的地方。", false, 2400);
}

/* ══ 21. 自动走通：清档重来 + 只用真实 MouseEvent('click') 打真实 .hit ══
   脚本**不直接改任何 flag**：三紙之序靠「挪柄」两次换位自然成立，
   目籤靠「取籤 → 押籤」自然成立，收束由這兩件事自然帶來。 */
function click(hsId){
  var n = document.querySelector('.hs[data-hs="'+hsId+'"]');
  if(!n) return false;
  if(n.classList.contains("gone")) return false;
  var hit = n.querySelector(".hit") || n;
  if(!inActiveView(n)) return false;
  hit.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function clickEl(sel){
  var n = document.querySelector(sel);
  if(!n) return false;
  n.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function w(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function slotOf(itemId){
  var i = INV.indexOf(itemId); if(i < 0) return null;
  return document.querySelector('.slot[data-slot="'+i+'"]');
}
function pickSlot(itemId){
  var s = slotOf(itemId); if(!s) return false;
  s.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return SEL === itemId;
}
async function runAuto(stop){
  var log = [];
  function step(name, ok){ log.push(name + "=" + (ok ? "ok" : "MISS")); }
  function report(){
    document.title = "SELFTEST::" + log.join(" | ")
      + " || FLAGS[" + FLAG_KEYS.filter(function(k){ return F[k]; }).join(",") + "]"
      + " || misplaced=" + F.f_misplaced_count
      + " || INV[" + INV.join(",") + "] || CAM=" + CAM
      + " || ORDER[" + ORDER.join("") + "]"
      + " || READ[" + READ.join(",") + "]"
      + " || DONE[" + DONE.join(",") + "]";
    document.body.setAttribute("data-selftest", log.join(" | "));
  }
  try{
    if(stop === "ledger"){ step("停在值房台賬", LEDGER); report(); return; }
    step("0_讀幕間", click("h_ledger_bridge")); await w(340);
    step("1_收起幕間", click("h_bridge_go")); await w(340);
    if(stop === "bridge"){ step("停在幕間", true); report(); return; }
    step("2_推門入廊", click("h_ledger_enter")); await w(380);
    /* ── 翻書可查：架上兩部書 + 體例 + 勘異一籤 ─────────────── */
    step("3_讀書庫體例", click("h_rule")); await w(300); closePaper(); await w(140);
    step("4_讀顏氏家訓勉學", click("h_book_yanshi")); await w(300); closePaper(); await w(140);
    step("5_讀漢書成帝紀", click("h_book_hanshu")); await w(300); closePaper(); await w(140);
    step("6_讀勘異一籤", click("h_tan")); await w(300); closePaper(); await w(140);
    step("7_三處已讀", !!(F.f_rule_read && F.f_book_yanshi_read && F.f_book_hanshu_read && F.f_tan_read));
    /* ── 進券車近景，逐紙翻看（三紙之文）────────────────────── */
    step("8_進券車近景", click("h_cart")); await w(600);
    step("9_在近景", CAM === "cart");
    step("10_翻左位那一紙", click("h_paper_l")); await w(300); closePaper(); await w(140);
    step("11_翻中位那一紙", click("h_paper_m")); await w(300); closePaper(); await w(140);
    step("12_翻右位那一紙", click("h_paper_r")); await w(300); closePaper(); await w(140);
    step("13_三紙已翻", !!(F.f_q_a_read && F.f_q_b_read && F.f_q_c_read));
    /* ── 錯法一：牌上還押着上一班的舊籤，就急着押（可复原、不锁死）── */
    step("14_回廊下", (function(){ click("h_cart_back"); return CAM === "room"; })()); await w(420);
    step("15_架取「馬」籤", (function(){ click("h_sign_ma"); return SEL === "it_sign_ma"; })()); await w(340);
    step("16_再進近景", click("h_cart")); await w(600);
    step("17_押在舊籤未取之牌", (function(){ click("h_plate"); return (F.f_misplaced_count|0) >= 1; })()); await w(420);
    step("18_錯法一已記_牌未動", !F.f_old_taken && !F.f_sign_ok);
    /* ── 放下手上的籤，取下牌上那支舊籤「驢」────────────────── */
    step("19_放下「馬」籤", (function(){ pickSlot("it_sign_ma"); return SEL === null; })()); await w(280);
    step("20_取下舊籤", (function(){ click("h_plate"); return !!F.f_old_taken; })()); await w(420);
    step("21_舊籤在手", INV.indexOf("it_old_lu") >= 0 && SEL === "it_old_lu");
    /* ── 綴三紙：兩次換位（挪柄）────────────────────────── */
    step("22_挪柄拿起左位", (function(){ click("h_move_l"); return MOVE_SEL === 0; })()); await w(300);
    step("23_放下到右位", (function(){ click("h_move_r"); return MOVE_SEL === null && ORDER.join("") === "021"; })()); await w(420);
    step("24_挪柄拿起中位", (function(){ click("h_move_m"); return MOVE_SEL === 1; })()); await w(300);
    step("25_再放下到右位", (function(){ click("h_move_r"); return !!F.f_order_ok; })()); await w(520);
    step("26_三紙成一券", ORDER.join("") === "012");
    step("27_序記已現", (function(){ var n=document.getElementById("order-marks"); return n && n.classList.contains("on"); })());
    /* ── 錯法二：把「驢」那一支舊籤押上去（現場變化：籤滑落）────── */
    step("28_押舊籤", (function(){ click("h_plate"); return (F.f_misplaced_count|0) >= 2; })()); await w(520);
    step("29_驗未成立", !F.f_sign_ok);
    /* ── 押「博士」目籤（鏈② → 收束）────────────────────── */
    step("30_回廊下取籤", (function(){ click("h_cart_back"); return CAM === "room"; })()); await w(420);
    step("31_取「博士」籤", (function(){ click("h_sign_boshi"); return SEL === "it_sign_boshi"; })()); await w(340);
    step("32_再進近景", click("h_cart")); await w(600);
    step("33_押上目籤", (function(){ click("h_plate"); return !!F.f_sign_ok; })()); await w(520);
    step("34_收束成立", !!F.f_act4_done);
    step("35_籤已離手", INV.indexOf("it_sign_boshi") < 0);
    /* ── 收束：回台账 → 校勘记 ─────────────────────────── */
    step("36_回廊下", (function(){ click("h_cart_back"); return CAM === "room"; })()); await w(420);
    step("37_開台賬", (function(){ clickEl("#bk"); return LEDGER; })()); await w(380);
    step("38_校勘記", (function(){ click("h_ledger_notes"); return PAPER_OPEN === "__notes"; })()); await w(460);
    if(stop === "notes"){ report(); return; }
    closePaper(); await w(220);
    step("39_再入廊", click("h_ledger_enter")); await w(380);
    step("40_收束_本幕已畢", !!F.f_act4_done);
  }catch(err){ log.push("ERR=" + (err && err.message)); }
  report();
}

window.__dd = { F:function(){ return F; }, INV:function(){ return INV; }, DONE:function(){ return DONE; },
  CAM:function(){ return CAM; }, ORDER:function(){ return ORDER; }, click:click, setCam:setCam,
  auto:runAuto,
  state:function(){ return {F:F, INV:INV, CAM:CAM, SEL:SEL, DONE:DONE, READ:READ, ORDER:ORDER}; } };
/* 探针（_selftest/probe-accept-act4.html）需要按名调用这两个只切覆盖层/重绘的函数 */
window.showLedger = showLedger;
window.render = render;

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
})();
</script>
