<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>典藏司 · 藏書閣 · 第九幕</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" href="favicon.ico">
<link rel="icon" href="favicon.ico">
<style>
  /* ══ 色板：与第一–八幕逐字相同 —— 9 个 token + 既有平涂旧木 #b9a88c，不新增颜色 ══ */
  :root{
    --paper:#f3ecdf; --paper2:#eae1d0; --card:#faf6ec;
    --ink:#2a2622; --ink2:#5c554b; --faint:#8d8577;
    --zhu:#a63a2a; --line:#d3c8b4; --line2:#c0b49d;
    --l1:2.2px; --l2:1.4px; --l3:0.9px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}   /* 不裁切、不出滚动条（附录 A.2）*/
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Songti SC","STSong",Georgia,"Noto Serif SC",serif;
    display:flex; align-items:center; justify-content:center; padding:8px;
  }
  /* 舞台宽度同时受三个上界约束，取最小（附录 A.2 / 坑 23）：
     ① 视窗宽 − 内边距  ② 1200px 名义宽  ③ (视窗高 − 台账 64px − 内边距 16px − 8px 余量) × 1200/720
     —— 只按宽度约束时，窗口一矮就会把舞台上下切掉（本幕修前 1240×790 实测 top=−60）。 */
  #app{width:min(100%,1200px,calc((100vh - 88px) * 1.66667));min-height:0;
       display:flex;flex-direction:column}
  #stage{display:block;width:100%;height:auto;aspect-ratio:1200/720;background:var(--paper);overflow:hidden}
  #hud{flex:0 0 64px;height:64px;display:flex;align-items:center;gap:14px;
       background:var(--paper);border-top:1px solid var(--line2);padding:0 6px}
  #slots{display:flex;gap:4px}
  .slot{width:56px;height:56px;border:1px solid transparent;position:relative;cursor:default}
  .slot .under{position:absolute;left:8px;right:8px;bottom:6px;height:1px;background:var(--line2)}
  .slot svg{display:block;width:52px;height:52px;margin:1px;transition:transform 120ms ease}
  .slot.has{cursor:pointer}
  .slot.sel{border-color:var(--zhu)}
  .slot.sel svg{transform:translateY(-2px)}
  #caption{margin-left:auto;margin-right:8px;max-width:62%;
           font-family:"Kaiti SC","STKaiti","KaiTi",serif;
           font-size:13px;line-height:1.6;color:var(--ink2);text-align:right;
           opacity:0;transition:opacity 500ms ease}
  #caption.on{opacity:1}
  #caption.zhu{color:var(--zhu)}

  /* ══ 线宽三级（与前几幕同值；vector-effect 保证跨视图/跨缩放不漂移）══ */
  .l1{stroke:var(--ink);stroke-width:var(--l1);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l2{stroke:var(--ink2);stroke-width:var(--l2);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l3{stroke:var(--faint);stroke-width:var(--l3);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .miter{stroke-linejoin:miter}
  .f-wood{fill:#b9a88c}
  .f-card{fill:var(--card)}
  .f-zhu{fill:var(--zhu)}
  .tx{fill:var(--ink);font-family:"Songti SC","STSong",Georgia,serif}
  .tx-k{fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .tx-z{fill:var(--zhu);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .shadow{fill:var(--ink);opacity:.08;stroke:none;pointer-events:none}

  /* ══ 视图切换（本幕 2 个视图：藏書閣全景 + 裝訂案近景；台账与过渡页是覆盖层）══ */
  .view{opacity:0;pointer-events:none;transition:opacity 500ms ease}
  .view.active{opacity:1;pointer-events:auto}

  /* ══ 命中（修正）：非活動層整棵子樹釘死（附錄 A.4）════════════════════
     `.hs .hit` 是**顯式** pointer-events:all，會壓過祖先 `.view{pointer-events:none}`
     的**繼承**；而 opacity:0 的元素**照樣參與命中測試**。於是收起的台賬、關着的過渡頁、
     沒進去的近景裏那些透明 .hit 仍在文檔順序更後的位置接得住鼠標 —— 點這一件、被那一件截胡。
     以下五條只改 hit test，不動任何一條 .hit 的既有寫法、不動漸隱動畫。 */
  .view:not(.active), .view:not(.active) *,
  #ledger:not(.on),   #ledger:not(.on) *,
  #bridge:not(.on),   #bridge:not(.on) *,
  .paper:not(.show),  .paper:not(.show) *{pointer-events:none!important}
  /* 上層（台賬／幕間）壓着時，底下場景整棵釘死（syncModal 掛 #world.modal）*/
  #world.modal .view, #world.modal .view *{pointer-events:none!important}
  #paper-layer{pointer-events:none}
  #paper-layer .paper.show{pointer-events:auto}

  /* ══ 热点：默认 / 可点 / 已取 三态光标 ══ */
  .hs{cursor:default}
  .hs .hit{fill:transparent;stroke:none;pointer-events:all}
  .hs.on .hit{cursor:pointer}
  .hs.on:hover .art path,.hs.on:hover .art rect,.hs.on:hover .art circle,
  .hs.on:hover .art ellipse,.hs.on:hover .art line,.hs.on:hover .art polygon{stroke:var(--zhu);stroke-width:3}
  .hs.armed .art path,.hs.armed .art rect,.hs.armed .art circle,
  .hs.armed .art ellipse,.hs.armed .art line,.hs.armed .art polygon{stroke:var(--zhu);stroke-width:3}
  .hs.on:hover .art text,.hs.armed .art text{fill:var(--zhu)}
  .hs.gone, .hs.gone *{pointer-events:none}
  .hs.gone .art{opacity:0}
  /* 已歸門的那一葉：留在案上、淡下去，不能再點（不是 .gone，故看得见）*/
  .hs.filed .hit{pointer-events:none}
  .hs.filed .art{opacity:.34;transform:translateY(-12px)}
  .hs.filed .art{transition:opacity 320ms ease,transform 320ms ease}
  .hs.breathe .art *{stroke:var(--zhu)!important;animation:breathe 1.2s ease-in-out 2}
  @keyframes breathe{0%,100%{stroke-opacity:1}50%{stroke-opacity:.4}}

  /* ══ 视角规格（§十二）：屏幕坐标 = 正面坐标 + 深度·(0,−0.5)，k = 0.5 ══
     本幕深度预算：閣內地面随画面裁切 / 裝訂案案面進深 24（帶高 12）/
     案板下那根横枨進深 16（帶高 8）/ 近景案面進深 24（帶高 12）/
     壁上兩紙、五道門格、八葉散葉、冊、線錐、線、題簽匣、印 皆 0（竖直面）。
     **全部 ≤ 80** —— 本幕没有超预算的构件。 */
  .floor{fill:var(--paper2);stroke:none}
  .slab{fill:var(--card);stroke:none}
  .recess{fill:var(--paper2);stroke:none}

  /* ══ 世界变化 ① 一個門格收進了葉（格上現出這一門已收的葉數）══ */
  .mark{opacity:0;transition:opacity 300ms ease}
  .hs.filled .mark{opacity:1}
  /* ══ 世界变化 ② 書脊三孔：錐開 / 穿線 ══ */
  #hole-1 .core,#hole-2 .core,#hole-3 .core{opacity:0;transition:opacity 260ms ease}
  #hole-1.pierced .core,#hole-2.pierced .core,#hole-3.pierced .core{opacity:1}
  #hole-1 .ring,#hole-2 .ring,#hole-3 .ring{opacity:0;transition:opacity 320ms ease}
  #hole-1.threaded .ring,#hole-2.threaded .ring,#hole-3.threaded .ring{opacity:1}
  /* ══ 世界变化 ③ 冊訂成（五帖上冊、結打在書脊下）══ */
  #book-sheets{opacity:0;transition:opacity 420ms ease}
  #book-sheets.on{opacity:1}
  #knot-line{opacity:0;transition:opacity 420ms ease}
  #knot-line.on{opacity:1}
  #book-tag{opacity:0;transition:opacity 380ms ease}
  #book-tag.on{opacity:1}
  #book-seal{opacity:0;transition:opacity 380ms ease}
  #book-seal.on{opacity:1}
  /* ══ 錯法：手上的東西抖一下（東西仍在原處）══ */
  @keyframes shake{0%,100%{transform:translateX(0)}35%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
  .shaking{animation:shake 130ms ease-in-out 2}
  /* ══ 錯法：葉順案邊滑回的那一下（現場變化，葉不消失、可立即重放）══ */
  @keyframes fall{0%{opacity:1}100%{opacity:0}}
  #leaf-ghost{opacity:0}
  #leaf-ghost.fall{animation:fall 460ms ease-in forwards}
  #leaf-ghost.at-mingwu{transform:translate(120px,286px)}
  #leaf-ghost.at-xungu{transform:translate(336px,286px)}
  #leaf-ghost.at-bianwei{transform:translate(552px,286px)}
  #leaf-ghost.at-banben{transform:translate(768px,286px)}
  #leaf-ghost.at-zhidu{transform:translate(984px,286px)}
  /* ══ 案上朱印（錯法累到三次才出現，一塊 12% 朱砂，不是新色）══ */
  #prints{opacity:0;transition:opacity 260ms ease}
  #prints.show{opacity:1}
  #prints2{opacity:0;transition:opacity 260ms ease}
  #prints2.show{opacity:1}
  /* ══ 拿在手上的東西離位微抬 ══ */
  .lift .art{opacity:.72}
  /* ══ 取走之後留在原處的那個位置（架上空了，痕迹还在）══ */
  #awl-stand,#thread-stand,#tag-stand,#seal-stand{transition:opacity 300ms ease}
  #awl-stand.taken,#thread-stand.taken,#tag-stand.taken,#seal-stand.taken{opacity:.30}

  /* ══ 纸（在場景內放大展開，不切屏、不加暗底遮罩）══ */
  .paper{opacity:0;pointer-events:none;transition:opacity 260ms ease}
  .paper.show{opacity:1;pointer-events:auto}
  .paper-title{font-size:21px;fill:var(--ink);letter-spacing:.18em}
  .paper-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  .paper-body{font-size:17px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.02em}
  .paper-body .key{font-size:19px}
  .paper-close{font-size:12px;fill:var(--faint);letter-spacing:.08em}

  /* ══ 外殼：典藏司「值房台账」（与前几幕同一套）══ */
  #ledger{opacity:0;pointer-events:none;transition:opacity 420ms ease}
  #ledger.on{opacity:1;pointer-events:auto}
  .led-lede{font-size:26px;fill:var(--ink);letter-spacing:.22em}
  .led-sub{font-size:13px;fill:var(--faint);letter-spacing:.12em}
  .led-item{font-size:19px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.04em}
  .led-item.done{fill:var(--faint)}
  .led-act{font-size:21px;fill:var(--ink);letter-spacing:.2em}
  .led-hint{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  #bridge{opacity:0;pointer-events:none;transition:opacity 380ms ease}
  #bridge.on{opacity:1;pointer-events:auto}
  .br-lede{font-size:22px;fill:var(--ink);letter-spacing:.2em}
  .br-body{font-size:16px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .br-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}

  #boot{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;
        justify-content:center;font-size:15px;color:var(--ink2);letter-spacing:.3em;z-index:9}
  #boot.gone{display:none}

  /* v0.20.13 手机端可读性：1200x720 舞台等比缩放后字太小，竖屏时给一条提示（不改玩法） */
  @media (max-width: 760px) and (orientation: portrait) {
    body::before {
      content: "建议横屏或使用电脑游玩，字体更清晰";
      position: fixed; left: 0; right: 0; top: 0; z-index: 9999;
      padding: 6px 8px; text-align: center;
      background: #a63a2a; color: #f3ecdf; font-size: 12px; letter-spacing: .04em;
    }
    body { padding-top: 26px; }
  }
</style>
</head>
<body>

<div id="boot">藏書閣</div>

<div id="app">
  <svg id="stage" viewBox="0 0 1200 720" shape-rendering="geometricPrecision"
       xmlns="http://www.w3.org/2000/svg" role="application" aria-label="典藏司藏書閣 第九幕">
    <defs>
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
      </filter>
    </defs>
    <rect x="0" y="0" width="1200" height="720" fill="var(--paper)"/>
    <g id="world">

      <!-- ══════════════════ view-room：藏書閣（全景）══════════════════
           同一台虚拟相机、同一斜率 k=0.5（§十二）。进深预算全部 ≤ 80（见样式表注释）。
           八幕的散葉都攤在裝訂案上 —— 這一幕不比、不判，只把兩存之異文歸門成冊。 -->
      <g id="view-room" class="view active">

        <!-- ① 閣內地面（水平面）：遠邊在牆腳 y≈596，近邊落在画面之外 -->
        <path class="floor" d="M40,596.4 C300,594.6 700,597.2 1160,595.6 L1160,726 L40,726 Z"/>
        <path class="l3 miter" d="M150,664 C400,662.6 800,665 1090,662.8"/>
        <path class="l3 miter" d="M1136,620 C1137.2,650 1136.4,674 1137,694"/>
        <path class="l3 miter" d="M62,620 C61,650 61.8,674 61,694"/>
        <!-- ② 墙脚交界 -->
        <path class="l2" d="M40,596.6 C300,594.8 700,597.4 1160,595.8"/>

        <!-- A 檐梁（一根旧木横梁）＋ 梁上悬下的旧绳 -->
        <g class="scenery" pointer-events="none">
          <path class="l1 f-wood" d="M60,44.4 C420,42.6 800,45.2 1140,43.6 L1143,77.4 C800,79.2 420,76.6 60,78.4 Z"/>
          <path class="l3" d="M60,61.4 C420,59.6 800,62.2 1140,60.6"/>
          <path class="l3" d="M812,79.6 C810,150 810.6,240 809.4,300"/>
        </g>

        <!-- B 壁上「藏書閣體例」一纸（翻書可查；本幕自撰，非古籍引文）-->
        <g id="hs_rule" class="hs on" data-hs="h_rule">
          <rect class="hit" x="62" y="150" width="196" height="156"/>
          <g class="art">
            <path class="l1 f-card" d="M70,158.4 C124,156.6 196,159.2 248,157.6 L249,298.4 C196,300.2 124,297.6 70,299.4 Z"/>
            <text class="tx-k" x="159" y="186" font-size="14" text-anchor="middle">藏書閣體例</text>
            <path class="l3 miter" d="M86,212 L232,212 M86,238 L206,238 M86,264 L220,264"/>
          </g>
        </g>

        <!-- C 壁上「散葉八條所據」一纸（翻書可查：八葉各據何書、據何門）-->
        <g id="hs_src" class="hs on" data-hs="h_src">
          <rect class="hit" x="276" y="150" width="196" height="156"/>
          <g class="art">
            <path class="l1 f-card" d="M284,158.4 C338,156.6 410,159.2 462,157.6 L463,298.4 C410,300.2 338,297.6 284,299.4 Z"/>
            <text class="tx-k" x="373" y="186" font-size="14" text-anchor="middle">散葉八條所據</text>
            <path class="l3 miter" d="M300,212 L446,212 M300,238 L420,238 M300,264 L434,264"/>
          </g>
        </g>

        <!-- D 兩座書架（架上是空空的一函一格，八幕的葉已取到案上）-->
        <g class="scenery" pointer-events="none">
          <path class="l1 f-wood" d="M62,334.4 C110,332.6 200,335.2 246,333.6 L248,594.4 C200,596.2 110,593.6 62,595.4 Z"/>
          <path class="l1 miter" d="M76,348.4 C120,346.8 192,349.2 234,347.6 L235,580.4 C192,582.2 120,579.6 76,581.4 Z" style="fill:var(--paper2)"/>
          <path class="l2 miter" d="M78,412 L233,412 M78,478 L233,478 M78,544 L233,544"/>
          <path class="l3" d="M120,352 L120,578 M180,352 L180,578"/>
          <path class="l1 f-card" d="M86,356.4 C118,354.8 156,357.2 186,355.6 L187,406.4 C156,408.2 118,405.6 86,407.4 Z"/>
          <path class="l1 f-card" d="M92,418.4 C126,416.8 164,419.2 196,417.6 L197,470.4 C164,472.2 126,469.6 92,471.4 Z"/>
          <path class="l1 f-wood" d="M958,334.4 C1022,332.6 1104,335.2 1146,333.6 L1148,594.4 C1104,596.2 1022,593.6 958,595.4 Z"/>
          <path class="l1 miter" d="M970,348.4 C1032,346.8 1096,349.2 1134,347.6 L1136,580.4 C1096,582.2 1032,579.6 970,581.4 Z" style="fill:var(--paper2)"/>
          <path class="l2 miter" d="M972,412 L1134,412 M972,478 L1134,478 M972,544 L1134,544"/>
          <path class="l3" d="M1014,352 L1014,578 M1074,352 L1074,578"/>
          <path class="l1 f-card" d="M982,420.4 C1014,418.8 1052,421.2 1082,419.6 L1083,472.4 C1052,474.2 1014,471.6 982,473.4 Z"/>
        </g>

        <!-- E 裝訂案（遠處那一張；走近就在案前）-->
        <g class="scenery" pointer-events="none">
          <path class="l1 f-wood" d="M540,498.4 C660,496.6 780,499.2 900,497.6 L902,556.4 C780,558.2 660,555.6 540,557.4 Z"/>
          <path class="l1 f-wood" d="M556,556.4 C560,554.6 574,557.2 578,555.6 L579,596.4 C574,598.2 560,595.6 556,597.4 Z"/>
          <path class="l1 f-wood" d="M864,556.4 C868,554.6 882,557.2 886,555.6 L887,596.4 C882,598.2 868,595.6 864,597.4 Z"/>
          <path class="l3 miter" d="M562,500 L562,556 M878,500 L878,556"/>
          <path class="l2 miter" d="M540,556.6 C660,554.8 780,557.4 902,555.8"/>
        </g>

        <!-- F 案上一盞燈（立在案左首地上）-->
        <g class="scenery" pointer-events="none">
          <path class="l1 f-wood" d="M312,432.4 C336,430.6 366,433.2 386,431.6 L387,596.4 C366,598.2 336,595.6 312,597.4 Z"/>
          <path class="l1 f-card" d="M296,410.4 C326,408.6 366,411.2 396,409.6 L398,436.4 C366,438.2 326,435.6 296,437.4 Z"/>
          <path class="l2" d="M346,408.6 C346,396 346,388 345,378"/>
          <ellipse class="f-zhu" cx="346" cy="370" rx="9" ry="13" opacity=".16"/>
        </g>

        <!-- G 走近裝訂案（進近景；熱區罩住案前那一整片）-->
        <g id="hs_go" class="hs on" data-hs="h_go">
          <rect class="hit" x="520" y="462" width="400" height="140"/>
          <g class="art">
            <path class="l1 miter" d="M532,566 C646,564.4 800,567 908,565.4 L908,610.4 C800,612.2 646,609.6 532,611.4 Z" fill="none"/>
          </g>
          <text class="led-act" x="720" y="596" text-anchor="middle" font-size="17">走 近 裝 訂 案</text>
        </g>

        <!-- H 案上朱印（錯法累到三次才出現；一塊 12% 朱砂，不是新色）-->
        <g id="prints" pointer-events="none">
          <ellipse cx="640" cy="700" rx="17" ry="23" fill="var(--zhu)" opacity=".12"/>
          <ellipse cx="670" cy="706" rx="12" ry="17" fill="var(--zhu)" opacity=".12"/>
        </g>

        <!-- 接觸影（唯一一层阴影：贴底 8% 墨、無方向性、每處一層）-->
        <rect class="shadow" x="66" y="592" width="182" height="7" rx="3"/>
        <rect class="shadow" x="962" y="592" width="186" height="7" rx="3"/>
        <rect class="shadow" x="544" y="596" width="356" height="7" rx="3"/>
        <rect class="shadow" x="314" y="595" width="72" height="6" rx="3"/>
      </g>

      <!-- ══════════════════ view-close：裝訂案近景（五道門格 / 八葉散葉 / 一冊空白的異文錄）══════════════════ -->
      <g id="view-close" class="view">

        <!-- 案後的那面牆與五道門格（每一格是一門；格上現出這一門已收的葉數）-->

<script>
"use strict";
(function(){

/* ══ 0. 存档：与第一–八幕同一把钥匙、同一结构（幕间协议 §1.3）════════════
   本幕（第九幕）写：act=9，往 done 追加 "act9"，《校勘记》追加本幕条目。
   **只加不改**：不改键名、不改任何既有字段的语义、不写迁移脚本。
   **本幕只往 inv 里放「本幕自己给得出的东西」**（八葉散葉、線錐、線、題簽、印），
   不假设「玩家还持有上一幕的物件」。 */
var SAVE_KEY = "diandangsi.rustylake.v1";
var NOTES_KEY = "diandangsi.rustylake.v1.notes";
var ACT_NO = 9, ACT_ID = "act9";

/* ══ 1. 上一幕交下来的东西（跨幕累积的读入侧）════════════════════════
   读不到就是 null —— **照实说「沒讀到」，不假装办过**（协议 §1.3.3）。 */
var PREV = (function(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    var o = JSON.parse(raw);
    if(!o || !o.f) return null;
    return o;
  }catch(e){ return null; }
})();
function prevHas(k){ return !!(PREV && PREV.f && PREV.f[k]); }
function prevRead(k){ return !!(PREV && PREV.read && PREV.read.indexOf(k) >= 0); }
function prevDone(id){ return !!(PREV && PREV.done && PREV.done.indexOf && PREV.done.indexOf(id) >= 0); }

/* ══ 2. flags ═══════════════════════════════════════════════════════ */
var FLAG_KEYS = [
  "f_seen_act9","f_bridge_read","f_rule_read","f_src_read","f_close_entered",
  "f_leaf1_filed","f_leaf2_filed","f_leaf3_filed","f_leaf4_filed",
  "f_leaf5_filed","f_leaf6_filed","f_leaf7_filed","f_leaf8_filed",
  "f_slots_full","f_awl_taken","f_thread_taken",
  "f_hole1_pierced","f_hole2_pierced","f_hole3_pierced",
  "f_hole1_threaded","f_hole2_threaded","f_hole3_threaded",
  "f_bound","f_tag_taken","f_titled","f_seal_taken","f_sealed","f_act9_done"
];
var F = {}, INV = [], READ = [], SEL = null, CAM = "room";

function resetState(){
  F = {}; FLAG_KEYS.forEach(function(k){ F[k]=false; });
  F.f_misplaced_count = 0;      /* 与第一–八幕同名同义：错的次数 */
  INV = []; READ = []; SEL = null; CAM = "room";
}

/* ══ 3. 存读档（幕间协议 §1.3：只加字段，不改字段语义，不改键名）══════ */
var saveT = null;
var DONE = (PREV && PREV.done && PREV.done.slice) ? PREV.done.slice() : [];
var NOTE_LOG = (PREV && PREV.notes && PREV.notes.slice) ? PREV.notes.slice() : [];
function markActDone(){
  if(F.f_act9_done && DONE.indexOf(ACT_ID) < 0) DONE.push(ACT_ID);
}
function appendNotes(){
  var es = noteEntries();
  for(var i=0;i<es.length;i++){
    var key = ACT_NO + "|" + es[i].h;
    var has = false;
    for(var j=0;j<NOTE_LOG.length;j++){ if(NOTE_LOG[j].key === key){ has = true; break; } }
    if(!has) NOTE_LOG.push({ key:key, act:ACT_NO, h:es[i].h, l:es[i].l });
  }
}
function saveNow(){
  try{
    markActDone(); appendNotes();
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      f:F, inv:INV, read:READ, cam:CAM, ts:Date.now(),
      act:ACT_NO, done:DONE, notes:NOTE_LOG
    }));
  }catch(e){}
}
function saveDebounced(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 300); }
function load(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    var o = JSON.parse(raw);
    if(!o || !o.f) return false;
    FLAG_KEYS.forEach(function(k){ if(k in o.f) F[k]=o.f[k]; });
    if(typeof o.f.f_misplaced_count === "number") F.f_misplaced_count = o.f.f_misplaced_count;
    INV = o.inv || []; READ = o.read || []; CAM = o.cam || "room";
    return true;
  }catch(e){ return false; }
}

}
function allFiled(){
  for(var i=0;i<LEAFS.length;i++){ if(!F["f_leaf" + LEAFS[i].no + "_filed"]) return false; }

}
function allPierced(){

function allThreaded(){

function give(id){ if(INV.indexOf(id) < 0) INV.push(id); renderInv(); applyArmed(); saveDebounced(); }
function take(id){ var i = INV.indexOf(id); if(i >= 0){ INV.splice(i,1); if(SEL===id) SEL=null; renderInv(); applyArmed(); saveDebounced(); } }
function renderInv(){
  slotsEl.innerHTML = "";
  for(var i=0;i<INV.length;i++){
    var id = INV[i], it = ITEMS[id]; if(!it) continue;
    var d = document.createElement("div");
    d.className = "slot has" + (SEL===id ? " sel" : "");
    d.setAttribute("data-slot", i);
    var box = it.box;
    d.innerHTML = '<svg viewBox="'+box[0]+' '+box[1]+' '+box[2]+' '+box[3]+'" preserveAspectRatio="xMidYMid meet">'
      + '<use href="#'+it.sym+'"/></svg><span class="under"></span>';
    (function(id2){
      d.addEventListener("click", function(e){
        e.stopPropagation();
        if(SEL === id2){ SEL = null; }
        else { SEL = id2; say("取「"+ITEMS[id2].n+"」在手 —— 看它該歸哪一門、或是該往哪一處。", false, 3200); }
        renderInv(); applyArmed(); render(); saveDebounced();
      });
    })(id);
    slotsEl.appendChild(d);
  }
}

var AC = null, SND = true;
function sfx(kind){
  if(!SND) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    var f = kind==="wood"?150 : kind==="board"?260 : kind==="leaf"?300 : 200;
    o.type = "sine";
    o.frequency.value = f;
    g.gain.value = 0.0001;
    o.connect(g); g.connect(AC.destination);
    g.gain.exponentialRampToValueAtTime(0.06, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.24);
    o.start(t); o.stop(t+0.26);
  }catch(e){}
}

var notePage = 0;
function showNotes(){ notePage = 0; renderNotePage(); }
function renderNotePage(){
  var es = noteEntries();
  if(!es.length){ say("校勘記還是空的。", false, 2400); return; }
  if(notePage < 0) notePage = 0;
  if(notePage > es.length-1) notePage = es.length-1;
  var e = es[notePage];
  PAPER_OPEN = "__notes";
  if(READ.indexOf("__notes") < 0){ READ.push("__notes"); }
  paperLayer.innerHTML = "";
  var W = 700, H = 486, X = 600-W/2, Y = 360-H/2;
  var g = el("g", { "class":"paper show", transform:"translate("+X+","+Y+")" });
  g.appendChild(el("rect",{ x:-4, y:-4, width:W+8, height:H+8, rx:4, "class":"shadow" }));
  g.appendChild(el("path",{ "class":"l1 f-card",
    d:"M2,2.6 C180,1 520,3.2 698,1.6 L698,"+(H-1.6)+" C520,"+(H-3.4)+" 180,"+(H-0.8)+" 2,"+(H-2.4)+" Z" }));
  g.appendChild(txt("paper-title", W/2, 50, "校 勘 記", { "text-anchor":"middle" }));
  g.appendChild(txt("paper-sub", W/2, 76,
    "典藏司 校書閣 · 熔銅作 · 校書堂 · 書庫走廊 · 膳房 · 類書庫 · 抄書齋 · 塔院 · 藏書閣", { "text-anchor":"middle" }));
  g.appendChild(txt("tx-k", 40, 116, e.h, { "font-size":16 }));
  /* 先量折行数，再定行距与字号（照第七幕 §20.2 第（5）处的做法：只改呈现，不动任何 flag）*/
  var lines = [];
  for(var i=0;i<e.l.length;i++){
    wrap(e.l[i], 56).forEach(function(s){ lines.push(s); });
  }
  var top = 148, avail = H - top - 46;
  var lh = Math.min(22, Math.floor(avail / Math.max(1, lines.length)));
  if(lh < 15) lh = 15;
  var fs = lh >= 20 ? 13.5 : (lh >= 17 ? 12.5 : 11.5);
  var y = top;
  for(i=0;i<lines.length;i++){
    g.appendChild(txt("tx-k", 52, y, lines[i], { "font-size": fs, fill:"var(--ink2)" })); y += lh;
  }
  var total = es.length, dw = 14;
  for(i=0;i<total;i++){
    g.appendChild(el("circle",{ cx:(W/2 - (total-1)*dw/2 + i*dw), cy:H-52, r:4,
      fill:(i===notePage) ? "var(--zhu)" : "none",
      stroke:(i===notePage) ? "none" : "var(--faint)", "stroke-width":1 }));
  }
  if(notePage > 0){
    g.appendChild(txt("paper-close", 44, H-44, "◂ 前一條", { "font-size":15 }));
    var hp = el("rect",{ x:34, y:H-62, width:100, height:32, fill:"transparent" });
    hp.setAttribute("style","cursor:pointer");
    hp.addEventListener("click", function(ev){ ev.stopPropagation(); notePage--; renderNotePage(); });
    g.appendChild(hp);
  }
  if(notePage < total-1){
    g.appendChild(txt("paper-close", W-44, H-44, "後一條 ▸", { "font-size":15, "text-anchor":"end" }));
    var hn = el("rect",{ x:W-134, y:H-62, width:100, height:32, fill:"transparent" });
    hn.setAttribute("style","cursor:pointer");
    hn.addEventListener("click", function(ev){ ev.stopPropagation(); notePage++; renderNotePage(); });
    g.appendChild(hn);
  }
  g.appendChild(txt("paper-close", W/2, H-16, "點紙外任意處 · 收起", { "text-anchor":"middle" }));
  g.addEventListener("click", function(ev){ ev.stopPropagation(); closePaper(); });
  paperLayer.appendChild(g);
  /* 「读校勘记」不经过任何 flag 变化 —— 必须在那一刻直接写一次存档（协议 §1.3.2 第 5 条）*/
  appendNotes(); saveNow();
  try{ localStorage.setItem(NOTES_KEY, JSON.stringify({ made:Date.now(), act:ACT_NO, entries:es.length })); }catch(e2){}
}

/* ══ 16. 渲染（唯一的真相来源：flags）════════════════════════════════ */
function render(){
  /* ① 五帖：八葉各歸其門 —— **由点击链自然成立**，不是脚本直接改 flag */
  if(allFiled()) F.f_slots_full = true;
  /* ② 每一葉：已歸門 / 仍在案上 */
  for(var i=0;i<LEAFS.length;i++){
    var L = LEAFS[i], lg = document.getElementById("leaf-" + L.no);
    if(lg) lg.classList.toggle("filed", !!F["f_leaf" + L.no + "_filed"]);
  }
  /* ③ 五道門格：格上現出這一門已收的葉數 */
  for(i=0;i<MEN.length;i++){
    var m = MEN[i], cnt = filedCount(m.k);
    var bin = document.querySelector('.hs[data-hs="h_bin_' + m.k + '"]');
    if(bin) bin.classList.toggle("filled", cnt > 0);
    var nt = document.getElementById("bin-n-" + m.k);
    if(nt) nt.textContent = NUM[cnt];
  }
  /* ④ 書脊三孔：錐開 / 穿線 */
  for(i=1;i<=3;i++){
    var h = document.getElementById("hole-" + i);
    if(h){
      h.classList.toggle("pierced", !!F["f_hole" + i + "_pierced"]);
      h.classList.toggle("threaded", !!F["f_hole" + i + "_threaded"]);
    }
  }
  /* ⑤ 冊：五帖上冊 / 結 / 題簽 / 印 */
  var bs = document.getElementById("book-sheets"); if(bs) bs.classList.toggle("on", !!F.f_bound);
  var kl = document.getElementById("knot-line");   if(kl) kl.classList.toggle("on", !!F.f_bound);
  var bt = document.getElementById("book-tag");     if(bt) bt.classList.toggle("on", !!F.f_titled);
  var bse= document.getElementById("book-seal");    if(bse) bse.classList.toggle("on", !!F.f_sealed);
  /* ⑥ 取走的工具：原位淡下去 */
  var STANDS = { it_awl:"awl-stand", it_thread:"thread-stand", it_tag:"tag-stand", it_seal:"seal-stand" };
  for(var k2 in STANDS){
    var n2 = document.getElementById(STANDS[k2]);
    if(n2) n2.classList.toggle("taken", INV.indexOf(k2) >= 0);
  }
  /* ⑦ 收束：冊尾落印之後，本幕的差事才算畢 */
  if(F.f_sealed) F.f_act9_done = true;
  /* ⑧ 錯法到三次：案上留一块 12% 朱砂 */
  var pr = (F.f_misplaced_count|0) >= 3;
  var p1 = document.getElementById("prints");  if(p1) p1.classList.toggle("show", pr);
  var p2 = document.getElementById("prints2"); if(p2) p2.classList.toggle("show", pr);
  var nb = document.getElementById("hs_led_notes");
  if(nb) nb.classList.toggle("gone", !F.f_act9_done);
  renderLedger();
  renderInv(); applyArmed();
}

/* ══ 17. 失败回路：可复原、不锁死（与第一–八幕同一语法）═══════════════
   规则：任何一个放错的动作 = 现场变化（抖一下 / 葉順案邊滑回 / 線從孔裡走出）+ 一句方位话。
   计数器只管「累了几次」。**绝不出判语。** */
function shake(hsId){
  var g = document.querySelector('.hs[data-hs="'+hsId+'"]');
  if(g){ g.classList.remove("shaking"); void g.offsetWidth; g.classList.add("shaking");
    setTimeout(function(){ g.classList.remove("shaking"); }, 300); }
}
function bump(hsId){
  shake(hsId);
  F.f_misplaced_count = (F.f_misplaced_count|0) + 1;
  render(); saveDebounced();
}
function ghostFall(id, ms){
  var gh = document.getElementById(id); if(!gh) return;
  gh.classList.remove("fall"); void gh.offsetWidth; gh.classList.add("fall");
  setTimeout(function(){ gh.classList.remove("fall"); }, ms+80);
}

/* ══ 19. 老掌书：只指方位，不给内容；没有提示按钮 ═══════════════════ */
var HINTS = {
  leaves:"案上八葉散葉 —— 每一葉上寫着它據的是哪一本書。",
  bins:"案後那五道門格 —— 名物、訓詁、辨偽、版本、制度。",
  awl:"案右首那支線錐 —— 書脊上三個孔位要它。",
  thread:"案右首那一軸線 —— 三孔錐開之後，線才穿得過去。",
  book:"案中央那一冊空白的 —— 五帖齊了，才輪到訂它。",
  tagseal:"題簽匣與那一方印，都在案右首。"
};
var hintUsed = {}, lastHint = 0;
function hint(){
  var now = Date.now();
  if(now - lastHint < 180000) return;
  var order;
  if(!F.f_slots_full) order = ["leaves","bins","awl"];
  else if(!F.f_bound) order = ["awl","thread","book"];
  else if(!F.f_sealed) order = ["tagseal","book"];
  else order = ["book","bins"];
  for(var i=0;i<order.length;i++){
    var k = order[i];
    if(hintUsed[k]) continue;
    hintUsed[k] = 1; lastHint = now;
    say(HINTS[k], false, 4200);
    return;
  }
}
var idleT = null;
function pokeIdle(){ clearTimeout(idleT); idleT = setTimeout(hint, 90000); }
document.addEventListener("mousemove", pokeIdle, {passive:true});
document.addEventListener("keydown", pokeIdle);

/* ══ 20. 事件绑定 ═══════════════════════════════════════════════════ */
function inActiveView(node){
  var v = node.closest ? node.closest(".view") : null;
  return !v || v.classList.contains("active");
}
stage.addEventListener("click", function(e){
  var hs = e.target.closest ? e.target.closest(".hs") : null;
  if(hs && hs.dataset.hs && !hs.classList.contains("gone")){
    if(inActiveView(hs)) onHotspot(hs.dataset.hs);
    return;
  }
  /* 判序：热点 → 过渡页 → **纸** → 台账（附錄 A.5 坑 24）。
     纸（#paper-layer）画在两者之后、压在它们上面，所以「点纸外任意处收起」必须排在
     bridgeOpen()／LEDGER 两个 return **之前**，否则簿子开着时校勘记那一页永远收不掉。 */
  if(PAPER_OPEN){ closePaper(); return; }
  if(bridgeOpen()){ return; }
  if(LEDGER) return;
  if(CAM !== "room") goRoom();
});
$("#bk").addEventListener("click", function(e){ e.stopPropagation(); showLedger(true); });
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    if(bridgeOpen()){ closeBridge(); return; }
    if(LEDGER){ showLedger(false); return; }
    if(PAPER_OPEN) closePaper(); else if(CAM !== "room") goRoom();
  }
  var k = (e.key||"").toLowerCase();
  if(k === "b") showLedger(!LEDGER);
  if(k === "1") setCam("room");
  if(k === "2") setCam("close");
});

/* ══ 21. 启动 ═══════════════════════════════════════════════════════ */
function boot(){
  buildSymbols();
  var restored = false;
  var AUTO = (location.hash.match(/auto=([a-z0-9]+)/i)||[])[1];
  var FRESH = /fresh/.test(location.hash);
  if(AUTO || FRESH){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} resetState(); }
  else restored = load();
  if(!restored) resetState();
  F.f_seen_act9 = true;
  render();
  setCam(CAM || "room");
  syncModal();          /* 起手台账就是 class="on" —— 不同步就等于「看不见的热点全活着」*/
  if(AUTO){ showLedger(true); }
  /* 截图探针（仅 ?probe= 时生效）：只摆 flags 与相机，不跳过任何交互分支 */
  var PROBE = (location.search.match(/[?&]probe=([a-z0-9]+)/i)||[])[1];
  if(/[?&]still=1/.test(location.search)){
    var st = document.createElement("style");
    st.textContent = "*{transition-duration:0s!important;animation-delay:0s!important}";
    document.head.appendChild(st);
  }
  function showRoom(){ showLedger(false); F.f_seen_act9 = true; setCam("room"); render(); }
  function showClose(){ showLedger(false); setCam("close"); render(); }
  function fileAll(){ LEAFS.forEach(function(L){ F["f_leaf" + L.no + "_filed"] = true; }); }
  function pierceAll(){ F.f_hole1_pierced = true; F.f_hole2_pierced = true; F.f_hole3_pierced = true; }
  function threadAll(){ F.f_hole1_threaded = true; F.f_hole2_threaded = true; F.f_hole3_threaded = true; }
  if(PROBE){
    if(PROBE === "room"){ showRoom(); }
    else if(PROBE === "close"){ showClose(); }
    else if(PROBE === "rule"){ showRoom(); showPaper("p_rule"); }
    else if(PROBE === "src"){ showRoom(); showPaper("p_src"); }
    else if(PROBE === "index"){ showRoom(); fileAll(); render(); showPaper("p_index"); }
    else if(PROBE === "filed"){ fileAll(); showClose(); }
    else if(PROBE === "pierced"){ fileAll(); F.f_awl_taken = true; pierceAll(); showClose(); }
    else if(PROBE === "bound"){
      fileAll(); F.f_awl_taken = true; F.f_thread_taken = true;
      pierceAll(); threadAll(); F.f_bound = true;
      showClose();
    }
    else if(PROBE === "sealed" || PROBE === "done"){
      fileAll(); F.f_awl_taken = true; F.f_thread_taken = true;
      pierceAll(); threadAll(); F.f_bound = true;
      F.f_tag_taken = true; F.f_titled = true; F.f_seal_taken = true; F.f_sealed = true;
      showClose();
    }
    else if(PROBE === "notes"){
      fileAll(); F.f_awl_taken = true; F.f_thread_taken = true;
      pierceAll(); threadAll(); F.f_bound = true;
      F.f_tag_taken = true; F.f_titled = true; F.f_seal_taken = true; F.f_sealed = true;
      showRoom(); showNotes();
    }
    else if(PROBE === "bridge"){ showRoom(); openBridge(); }
    else if(PROBE === "bridgefull"){ load(); render(); setCam("room"); showLedger(false); openBridge(); }
    else if(PROBE === "ledger"){ showLedger(true); }
  }
  requestAnimationFrame(function(){ $("#boot").classList.add("gone"); });
  pokeIdle();
  if(AUTO) runAuto(AUTO);
  else if(restored) say("接着上次的地方。", false, 2400);
}

/* ══ 22. 自动走通：清档重来 + 只用真实 MouseEvent('click') 打真实 .hit ══
   脚本**不直接改任何 flag**：八葉歸門靠「取葉 → 落門」自然成立，五帖齊靠這一鏈
   自然成立，三孔一結靠「取錐錐孔 → 取線穿線 → 打結」自然成立，收束由冊尾落印帶來
   —— runAuto 里没有一处 F.xxx = true。 */
function click(hsId){
  var n = document.querySelector('.hs[data-hs="'+hsId+'"]');
  if(!n) return false;
  if(n.classList.contains("gone")) return false;
  if(n.classList.contains("filed")) return false;
  var hit = n.querySelector(".hit") || n;
  if(!inActiveView(n)) return false;
  hit.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function clickEl(sel){
  var n = document.querySelector(sel);
  if(!n) return false;
  n.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function w(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function slotOf(itemId){
  var i = INV.indexOf(itemId); if(i < 0) return null;
  return document.querySelector('.slot[data-slot="'+i+'"]');
}
function pickSlot(itemId){
  if(SEL === itemId) return true;
  var s = slotOf(itemId); if(!s) return false;
  s.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return SEL === itemId;
}
async function runAuto(stop){
  var log = [];
  function step(name, ok){ log.push(name + "=" + (ok ? "ok" : "MISS")); }
  function report(){
    document.title = "SELFTEST::" + log.join(" | ")
      + " || FLAGS[" + FLAG_KEYS.filter(function(k){ return F[k]; }).join(",") + "]"
      + " || misplaced=" + F.f_misplaced_count
      + " || INV[" + INV.join(",") + "] || CAM=" + CAM
      + " || BIN[" + MEN.map(function(m){ return m.n + filedCount(m.k); }).join(" ") + "]"
      + " || READ[" + READ.join(",") + "]"
      + " || DONE[" + DONE.join(",") + "]";
    document.body.setAttribute("data-selftest", log.join(" | "));
  }
  try{
    if(stop === "ledger"){ step("停在值房台賬", LEDGER); report(); return; }
    step("0_讀幕間", click("h_ledger_bridge")); await w(187);
    step("1_收起幕間", click("h_bridge_go")); await w(187);
    if(stop === "bridge"){ step("停在幕間", true); report(); return; }
    step("2_推門入閣", click("h_ledger_enter")); await w(209);
    /* ── 翻書可查：藏書閣體例 + 散葉八條所據 ─────────────────── */
    step("3_讀藏書閣體例", click("h_rule")); await w(165); closePaper(); await w(120);
    step("4_讀散葉所據", click("h_src")); await w(165); closePaper(); await w(120);
    /* ── 進裝訂案近景：八葉逐葉歸門 ─────────────────────────── */
    step("5_進裝訂案近景", click("h_go")); await w(341);
    step("6_在近景", CAM === "close");
    step("7_取第一葉荼茶", (function(){ click("h_leaf1"); return SEL === "it_leaf1"; })()); await w(187);
    /* ── 錯法一：手上還捏着一葉，又去取另一葉（現場變化：抖 + 計數，可立即重放）── */
    step("8_錯法一_手上有葉再取葉", (function(){ click("h_leaf2"); return (F.f_misplaced_count|0) >= 1; })()); await w(220);
    step("9_錯法一已記_手上仍是那一葉", SEL === "it_leaf1");
    step("10_荼茶歸版本門", (function(){ click("h_bin_banben"); return !!F.f_leaf1_filed; })()); await w(220);
    /* ── 空手點門格：只抖一下、只給一句方位话，不計數 ─────────── */
    step("11_空手點名物格", (function(){ var b = (F.f_misplaced_count|0); click("h_bin_mingwu"); return (F.f_misplaced_count|0) === b; })()); await w(187);
    /* ── 其餘七葉逐葉歸門 ─────────────────────────────────────── */
    step("12_取第二葉遍徧", (function(){ click("h_leaf2"); return SEL === "it_leaf2"; })()); await w(176);
    step("13_遍徧歸訓詁門", (function(){ click("h_bin_xungu"); return !!F.f_leaf2_filed; })()); await w(198);
    step("14_取第三葉三紙三張", (function(){ click("h_leaf3"); return SEL === "it_leaf3"; })()); await w(176);
    step("15_三紙三張歸制度門", (function(){ click("h_bin_zhidu"); return !!F.f_leaf3_filed; })()); await w(198);
    step("16_取第四葉勞蟧", (function(){ click("h_leaf4"); return SEL === "it_leaf4"; })()); await w(176);
    step("17_勞蟧歸名物門", (function(){ click("h_bin_mingwu"); return !!F.f_leaf4_filed; })()); await w(198);
    step("18_取第五葉因同", (function(){ click("h_leaf5"); return SEL === "it_leaf5"; })()); await w(176);
    step("19_因同歸版本門", (function(){ click("h_bin_banben"); return !!F.f_leaf5_filed; })()); await w(198);
    step("20_取第六葉申分", (function(){ click("h_leaf6"); return SEL === "it_leaf6"; })()); await w(176);
    step("21_申分歸辨偽門", (function(){ click("h_bin_bianwei"); return !!F.f_leaf6_filed; })()); await w(198);
    step("22_取第七葉十三級十五重", (function(){ click("h_leaf7"); return SEL === "it_leaf7"; })()); await w(176);
    step("23_十三級十五重歸版本門", (function(){ click("h_bin_banben"); return !!F.f_leaf7_filed; })()); await w(198);
    step("24_取第八葉槃盤", (function(){ click("h_leaf8"); return SEL === "it_leaf8"; })()); await w(176);
    step("25_槃盤歸訓詁門", (function(){ click("h_bin_xungu"); return !!F.f_leaf8_filed; })()); await w(220);
    step("26_五帖已齊", !!(F.f_slots_full && allFiled()));
    /* ── 空手點第一孔：只抖一下、只給一句方位话 ───────────────── */
    step("27_空手點第一孔", (function(){ var b = (F.f_misplaced_count|0); click("h_hole1"); return (F.f_misplaced_count|0) === b; })()); await w(187);
    /* ── 取線錐，逐孔錐開 ─────────────────────────────────────── */
    step("28_取線錐", (function(){ click("h_awl"); return SEL === "it_awl"; })()); await w(187);
    step("29_錐開第一孔", (function(){ click("h_hole1"); return !!F.f_hole1_pierced; })()); await w(187);
    step("30_錐開第二孔", (function(){ click("h_hole2"); return !!F.f_hole2_pierced; })()); await w(187);
    step("31_錐開第三孔", (function(){ click("h_hole3"); return !!F.f_hole3_pierced; })()); await w(187);
    /* ── 錯法二：錐在手、線不在手就打結（結打不成，可立即重放）── */
    step("32_錯法二_線不在手就打結", (function(){ click("h_knot"); return (F.f_misplaced_count|0) >= 2; })()); await w(220);
    step("33_錯法二已記_冊未訂成", !F.f_bound);
    /* ── 取線，穿第一、二孔 ───────────────────────────────────── */
    step("34_取線", (function(){ click("h_thread"); return SEL === "it_thread"; })()); await w(187);
    step("35_穿過第一孔", (function(){ click("h_hole1"); return !!F.f_hole1_threaded; })()); await w(187);
    step("36_穿過第二孔", (function(){ click("h_hole2"); return !!F.f_hole2_threaded; })()); await w(187);
    /* ── 錯法三：三孔未穿齊就打結（線從孔裡走出來，可立即重放）── */
    step("37_錯法三_三孔未穿齊就打結", (function(){ click("h_knot"); return (F.f_misplaced_count|0) >= 3; })()); await w(231);
    step("38_錯法三已記_冊未訂成", !F.f_bound);
    step("39_穿過第三孔", (function(){ click("h_hole3"); return !!F.f_hole3_threaded; })()); await w(187);
    /* ── 取題簽，錯法四：冊未訂成就往冊脊上貼 ─────────────────── */
    step("40_取題簽", (function(){ click("h_tag"); return SEL === "it_tag"; })()); await w(187);
    step("41_錯法四_未訂就貼簽", (function(){ click("h_book"); return (F.f_misplaced_count|0) >= 4; })()); await w(231);
    step("42_錯法四已記_冊未題簽", !F.f_titled);
    /* ── 選中線、打結、選中題簽、貼簽、取印、落印 ─────────────── */
    step("43_選中線", (function(){ return pickSlot("it_thread"); })()); await w(165);
    step("44_打結_冊訂成", (function(){ click("h_knot"); return !!F.f_bound; })()); await w(242);
    step("45_選中題簽", (function(){ return pickSlot("it_tag"); })()); await w(165);
    step("46_題簽貼冊脊", (function(){ click("h_book"); return !!F.f_titled; })()); await w(242);
    step("47_取印", (function(){ click("h_seal"); return SEL === "it_seal"; })()); await w(187);
    step("48_印落冊尾", (function(){ click("h_book"); return !!F.f_sealed; })()); await w(242);
    step("49_收束成立", !!F.f_act9_done);
    /* ── 收束：回閣中 → 開台账 → 校勘记 ─────────────────────── */
    step("50_回閣中", (function(){ click("h_close_back"); return CAM === "room"; })()); await w(231);
    step("51_開台賬", (function(){ clickEl("#bk"); return LEDGER; })()); await w(209);
    step("52_校勘記", (function(){ click("h_ledger_notes"); return PAPER_OPEN === "__notes"; })()); await w(286);
    if(stop === "notes"){ report(); return; }
    closePaper(); await w(132);
    step("53_再入閣", click("h_ledger_enter")); await w(209);
    step("54_收束_本幕已畢", !!F.f_act9_done);
  }catch(err){ log.push("ERR=" + (err && err.message)); }
  report();
}
