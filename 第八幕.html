<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>典藏司 · 塔院 · 第八幕</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" href="favicon.ico">
<link rel="icon" href="favicon.ico">
<link rel="icon" href="favicon.ico">
<style>
  /* ══ 色板：与第一–四幕逐字相同 —— 9 个 token + 既有平涂旧木 #b9a88c，不新增第 8 色 ══ */
  :root{
    --paper:#f3ecdf; --paper2:#eae1d0; --card:#faf6ec;
    --ink:#2a2622; --ink2:#5c554b; --faint:#8d8577;
    --zhu:#a63a2a; --line:#d3c8b4; --line2:#c0b49d;
    --l1:2.2px; --l2:1.4px; --l3:0.9px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Songti SC","STSong",Georgia,"Noto Serif SC",serif;
    display:flex; align-items:center; justify-content:center; padding:8px;
  }
  /* 三上界取最小：视窗宽 − 内边距 / 1200 / （视窗高 − 台賬高 − 内边距）× 1200/720。
     旧版只按宽度（min(97vw,1200px)）—— 窗口一矮，舞台上下被切（1214×650 实测 top=−60）。 */
  #app{width:min(100%,1200px,calc((100vh - 88px) * 1.66667));display:flex;flex-direction:column;min-height:0}
  #stage{display:block;width:100%;height:auto;aspect-ratio:1200/720;background:var(--paper);overflow:hidden}
  #hud{flex:0 0 64px;height:64px;display:flex;align-items:center;gap:14px;
       background:var(--paper);border-top:1px solid var(--line2);padding:0 6px}
  #slots{display:flex;gap:4px}
  .slot{width:56px;height:56px;border:1px solid transparent;position:relative;cursor:default}
  .slot .under{position:absolute;left:8px;right:8px;bottom:6px;height:1px;background:var(--line2)}
  .slot svg{display:block;width:52px;height:52px;margin:1px;transition:transform 120ms ease}
  .slot.has{cursor:pointer}
  .slot.sel{border-color:var(--zhu)}
  .slot.sel svg{transform:translateY(-2px)}
  #caption{margin-left:auto;margin-right:8px;max-width:62%;
           font-family:"Kaiti SC","STKaiti","KaiTi",serif;
           font-size:13px;line-height:1.6;color:var(--ink2);text-align:right;
           opacity:0;transition:opacity 500ms ease}
  #caption.on{opacity:1}
  #caption.zhu{color:var(--zhu)}

  /* ══ 线宽三级（与前几幕同值；vector-effect 保证跨视图/跨缩放不漂移）══ */
  .l1{stroke:var(--ink);stroke-width:var(--l1);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l2{stroke:var(--ink2);stroke-width:var(--l2);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l3{stroke:var(--faint);stroke-width:var(--l3);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .miter{stroke-linejoin:miter}
  .f-wood{fill:#b9a88c}
  .f-card{fill:var(--card)}
  .f-zhu{fill:var(--zhu)}
  .tx{fill:var(--ink);font-family:"Songti SC","STSong",Georgia,serif}
  .tx-k{fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .tx-z{fill:var(--zhu);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  /* 只画不接：接觸影畫在熱點之後，不關掉會啃掉貼底熱區的下緣 */
  .shadow{fill:var(--ink);opacity:.08;stroke:none;pointer-events:none}

  /* ══ 视图切换（本幕 2 个视图：塔院全景 + 兩塔近景；台账与过渡页是覆盖层）══ */
  .view{opacity:0;pointer-events:none;transition:opacity 500ms ease}
  .view.active{opacity:1;pointer-events:auto}

  /* ══ 热点：默认 / 可点 / 已取 三态光标 ══ */
  .hs{cursor:default}
  .hs .hit{fill:transparent;stroke:none;pointer-events:all}
  .hs.on .hit{cursor:pointer}
  .hs.on:hover .art path,.hs.on:hover .art rect,.hs.on:hover .art circle,
  .hs.on:hover .art ellipse,.hs.on:hover .art line,.hs.on:hover .art polygon{stroke:var(--zhu);stroke-width:3}
  .hs.armed .art path,.hs.armed .art rect,.hs.armed .art circle,
  .hs.armed .art ellipse,.hs.armed .art line,.hs.armed .art polygon{stroke:var(--zhu);stroke-width:3}
  .hs.on:hover .art text,.hs.armed .art text{fill:var(--zhu)}
  .hs.gone, .hs.gone *{pointer-events:none}
  .hs.gone .art{opacity:0}
  .hs.breathe .art *{stroke:var(--zhu)!important;animation:breathe 1.2s ease-in-out 2}
  @keyframes breathe{0%,100%{stroke-opacity:1}50%{stroke-opacity:.4}}

  /* ══ 视角规格（§十二）：屏幕坐标 = 正面坐标 + 深度·(0,−0.5)，k = 0.5 ══
     本幕深度预算：塔院地面随画面裁切 / 两塔三层石基各進深 20（帶高 10）/
     尺板台進深 24（帶高 12）/ 鈴架下枨進深 16（帶高 8）/
     近景地面随画面裁切 / 近景尺板台進深 24。**全部 ≤ 80** —— 本幕没有超预算的构件。 */
  .floor{fill:var(--paper2);stroke:none}
  .slab{fill:var(--card);stroke:none}
  /* 交出 stroke:none —— 槽面与槽框合画成一条 path（同形双 path 不再画两遍） */
  .recess{fill:var(--paper2)}

  /* ══ 世界变化 ① 木牌嵌进塔旁的層數槽（槽里现出层数）══ */
  #slot-t13 .mark,#slot-t15 .mark{opacity:0;transition:opacity 260ms ease}
  #slot-t13.set .mark,#slot-t15.set .mark{opacity:1}
  /* ══ 世界变化 ② 木牌摆上尺板（两套数字并置，高下自分）══ */
  #meas-signs{opacity:0;transition:opacity 420ms ease}
  #meas-signs.on{opacity:1}
  #meas-lead{opacity:0;transition:opacity 420ms ease}
  #meas-lead.on{opacity:1}
  /* ══ 世界变化 ③ 勘異板上落下朱印（两存不強合）══ */
  #panel-seal{opacity:0;transition:opacity 420ms ease}
  #panel-seal.on{opacity:1}
  /* ══ 世界变化 ④ 銅鈴挂上鈴架（收束）══ */
  #bell-hung{opacity:0;transition:opacity 420ms ease}
  #bell-hung.on{opacity:1}
  #bell-taken{opacity:1;transition:opacity 320ms ease}
  #bell-taken.gone{opacity:0}
  /* ══ 錯法：手上的東西抖一下（東西仍在原處）══ */
  @keyframes shake{0%,100%{transform:translateX(0)}35%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
  .shaking{animation:shake 130ms ease-in-out 2}
  /* ══ 錯法：牌子 / 筆滑落的那一下（現場變化，東西不消失、可立即重放）══ */
  @keyframes fall{0%{opacity:1}100%{opacity:0}}
  #tier-ghost{opacity:0}
  #tier-ghost.fall{animation:fall 460ms ease-in forwards}
  #tier-ghost.at-a{transform:translate(96px,58px)}
  #tier-ghost.at-b{transform:translate(310px,58px)}
  #pen-ghost{opacity:0}
  #pen-ghost.fall{animation:fall 460ms ease-in forwards}
  /* ══ 壁上朱印（錯法累到三次才出現，一塊 12% 朱砂，不是新色）══ */
  #prints{opacity:0;transition:opacity 260ms ease}
  #prints.show{opacity:1}
  /* ══ 拿在手上的東西離位微抬 ══ */
  .lift .art{opacity:.72}

  /* ══ 纸（在場景內放大展開，不切屏、不加暗底遮罩）══ */
  .paper{opacity:0;pointer-events:none;transition:opacity 260ms ease}
  .paper.show{opacity:1;pointer-events:auto}
  .paper-title{font-size:21px;fill:var(--ink);letter-spacing:.18em}
  .paper-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  .paper-body{font-size:17px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.02em}
  .paper-body .key{font-size:19px}
  .paper-close{font-size:12px;fill:var(--faint);letter-spacing:.08em}

  /* ══ 外殼：典藏司「值房台账」（与前几幕同一套）══ */
  #ledger{opacity:0;pointer-events:none;transition:opacity 420ms ease}
  #ledger.on{opacity:1;pointer-events:auto}
  .led-lede{font-size:26px;fill:var(--ink);letter-spacing:.22em}
  .led-sub{font-size:13px;fill:var(--faint);letter-spacing:.12em}
  .led-item{font-size:19px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.04em}
  .led-item.done{fill:var(--faint)}
  .led-act{font-size:21px;fill:var(--ink);letter-spacing:.2em}
  .led-hint{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  #bridge{opacity:0;pointer-events:none;transition:opacity 380ms ease}
  #bridge.on{opacity:1;pointer-events:auto}
  .br-lede{font-size:22px;fill:var(--ink);letter-spacing:.2em}
  .br-body{font-size:16px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .br-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}

  /* ══ 命中（修正）：非活動層整棵子樹釘死 ══════════════════════════════
     病灶：`.hs .hit` 显式写着 pointer-events:all，压过祖先 .view / #ledger /
     #bridge / .paper 的 pointer-events:none（显式值胜过继承）；而 opacity:0
     的元素照常参与命中测试。于是收起的台賬、没进去的近景、关着的过渡页里
     那些透明 .hit 仍在文档顺序更后的位置接得住鼠标 —— 点这一件，被那一件截走。
     以下纯 CSS：不改任何一条 .hit 的既有写法，也不动渐隐动画。 */
  .view:not(.active), .view:not(.active) *,
  #ledger:not(.on),   #ledger:not(.on) *,
  #bridge:not(.on),   #bridge:not(.on) *,
  .paper:not(.show),  .paper:not(.show) *{pointer-events:none!important}
  /* 上層（台賬 / 幕間）壓着時，底下那道景觀整棵釘死 */
  #world.modal .view, #world.modal .view *{pointer-events:none!important}
  /* 命中只認 .hit：不會有某一個熱點的畫蓋住另一個熱點的熱區 */
  .hs .art{pointer-events:none}
  #paper-layer{pointer-events:none}
  #paper-layer .paper.show{pointer-events:auto}

  #boot{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;
        justify-content:center;font-size:15px;color:var(--ink2);letter-spacing:.3em;z-index:9}
  #boot.gone{display:none}

  /* v0.20.13 手机端可读性：1200x720 舞台等比缩放后字太小，竖屏时给一条提示（不改玩法） */
  @media (max-width: 760px) and (orientation: portrait) {
    body::before {
      content: "建议横屏或使用电脑游玩，字体更清晰";
      position: fixed; left: 0; right: 0; top: 0; z-index: 9999;
      padding: 6px 8px; text-align: center;
      background: #a63a2a; color: #f3ecdf; font-size: 12px; letter-spacing: .04em;
    }
    body { padding-top: 26px; }
  }
</style>
</head>
<body>

<div id="boot">塔院</div>

<div id="app">
  <svg id="stage" viewBox="0 0 1200 720" shape-rendering="geometricPrecision"
       xmlns="http://www.w3.org/2000/svg" role="application" aria-label="典藏司塔院 第八幕">
    <defs>
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
      </filter>
    </defs>
    <rect x="0" y="0" width="1200" height="720" fill="var(--paper)"/>
    <g id="world">

      <!-- ══════════════════ view-room：塔院（全景）══════════════════
           同一台虚拟相机、同一斜率 k=0.5（§十二）。进深预算全部 ≤ 80（见样式表注释）。
           两座塔的营造图并排 —— **不比高度，只数层数**（与第一幕链③换手法）。 -->
      <g id="view-room" class="view active">

        <!-- ① 塔院地面（水平面）：远边在墙脚 y≈596，近边落在画面之外 -->
        <path class="floor" d="M40,596.4 C300,594.6 700,597.2 1160,595.6 L1160,726 L40,726 Z"/>
        <path class="l3 miter" d="M150,664 C400,662.6 800,665 1090,662.8"/>
        <path class="l3 miter" d="M1136,620 C1137.2,650 1136.4,674 1137,694"/>
        <path class="l3 miter" d="M62,620 C61,650 61.8,674 61,694"/>
        <!-- ② 墙脚交界 -->
        <path class="l2" d="M40,596.6 C300,594.8 700,597.4 1160,595.8"/>

        <!-- A 檐梁（一根旧木横梁，横贯院墙上沿）＋ 梁上悬下的旧绳 -->
        <g class="scenery" pointer-events="none">
          <path class="l1 f-wood" d="M60,44.4 C420,42.6 800,45.2 1140,43.6 L1143,77.4 C800,79.2 420,76.6 60,78.4 Z"/>
          <path class="l3" d="M60,61.4 C420,59.6 800,62.2 1140,60.6"/>
          <path class="l3" d="M812,79.6 C810,150 810.6,240 809.4,332"/>
        </g>

        <!-- B 壁上「塔院體例」一纸（翻書可查；本幕自撰，非古籍引文）-->
        <g id="hs_rule" class="hs on" data-hs="h_rule">
          <rect class="hit" x="62" y="150" width="196" height="156"/>
          <g class="art">
            <path class="l1 f-card" d="M70,158.4 C124,156.6 196,159.2 248,157.6 L249,298.4 C196,300.2 124,297.6 70,299.4 Z"/>
            <text class="tx-k" x="159" y="186" font-size="14" text-anchor="middle">塔院體例</text>
            <path class="l3 miter" d="M86,212 L232,212 M86,238 L206,238 M86,264 L220,264"/>
          </g>
        </g>

        <!-- C 架上兩卷《洛陽伽藍記 · 卷五》（各自獨立熱點，不相邻、不嵌套）-->
        <g id="hs_vol_a" class="hs on" data-hs="h_vol_a">
          <rect class="hit" x="276" y="150" width="120" height="180"/>
          <g class="art">
            <path class="l1 f-card" d="M284,160.4 L382,158.6 L383,320.4 L285,322.2 Z"/>
            <text class="tx-k" x="333" y="190" font-size="14" text-anchor="middle">洛陽伽藍記</text>
            <text class="tx-k" x="333" y="212" font-size="12" fill="var(--ink2)" text-anchor="middle">卷五 · 甲本</text>
            <path class="l3" style="stroke:var(--zhu)" d="M300,242 L366,242 M300,264 L342,264 M300,286 L358,286"/>
          </g>
        </g>
        <g id="hs_vol_b" class="hs on" data-hs="h_vol_b">
          <rect class="hit" x="406" y="150" width="120" height="180"/>
          <g class="art">
            <path class="l1 f-card" d="M414,160.4 L512,158.6 L513,320.4 L415,322.2 Z"/>
            <text class="tx-k" x="463" y="190" font-size="14" text-anchor="middle">洛陽伽藍記</text>
            <text class="tx-k" x="463" y="212" font-size="12" fill="var(--ink2)" text-anchor="middle">卷五 · 乙本</text>
            <path class="l3" style="stroke:var(--zhu)" d="M430,242 L496,242 M430,264 L472,264 M430,286 L488,286"/>
          </g>
        </g>

        <!-- D 官尺（立在两塔之间的地上，正面竖直；刻度自地面起算）-->
        <g class="scenery" pointer-events="none">
          <path class="l1 f-wood" d="M604,350.4 C610,348.6 622,351.2 628,349.6 L629,662.4 C622,664.2 610,661.6 604,663.4 Z"/>
          <path class="l3 miter" d="M610,384 L622,384 M610,439 L622,439 M610,494 L618,494 M610,549 L618,549 M610,604 L622,604"/>
          <path class="l2" d="M600,384.6 C612,383.2 624,385.6 634,384.4"/>
          <path class="l2" d="M600,494.6 C612,493.2 624,495.6 634,494.4"/>
          <text class="tx-k" x="596" y="378" font-size="12" text-anchor="end" fill="var(--ink2)">七百尺</text>
          <text class="tx-k" x="596" y="488" font-size="12" text-anchor="end" fill="var(--ink2)">四百尺</text>
          <path class="l2" d="M40,662.6 C300,660.8 700,663.4 1160,661.8"/>
        </g>

        <!-- E 兩座塔的营造图：塔身与層數線由 buildTowers() 生成
             （用生成式画法，不手写：与第一幕 §3.6 的「塔 13 檐由脚本生成」同一做法）-->
        <g id="tower-a" class="scenery" pointer-events="none"></g>
        <g id="tower-b" class="scenery" pointer-events="none"></g>

        <!-- F 院中壁上那一方木牌（兩套数字并置的記録，近景裡也擺着同一塊）-->
        <g class="scenery" pointer-events="none">
          <path class="l1 f-wood" d="M890,340.4 C978,338.6 1066,341.2 1146,339.6 L1148,518.4 C1066,520.2 978,517.6 890,519.4 Z"/>
          <path class="l1 miter" d="M904,354.4 C982,352.8 1062,355.2 1132,353.6 L1133,504.4 C1062,506.2 982,503.6 904,505.4 Z" fill="none"/>
          <text class="tx-k" x="1018" y="384" font-size="15" text-anchor="middle">勘 異 板</text>
          <path class="l2" d="M920,404 C980,402.6 1060,405.2 1118,403.6"/>
          <text class="tx-k" x="924" y="432" font-size="13">十三級 · 十三重 · 三百尺 · 七百尺</text>
          <text class="tx-k" x="924" y="462" font-size="13">十五重 · 八十八尺 · 六十三丈二尺</text>
          <path class="l3" d="M920,486 L1108,486"/>
        </g>

        <!-- G 走近兩塔（進近景；熱區罩住兩塔腳下的一整片，與勘異板熱區不相邻）-->
        <g id="hs_tower_go" class="hs on" data-hs="h_tower_go">
          <rect class="hit" x="86" y="446" width="452" height="138"/>
          <g class="art">
            <path class="l1 miter" d="M96,532 C240,530.4 380,533 528,531.4 L528,578.4 C380,580.2 240,577.6 96,579.4 Z" fill="none"/>
          </g>
          <text class="led-act" x="312" y="562" text-anchor="middle" font-size="17">走 近 兩 塔</text>
        </g>

        <!-- H 壁上朱印（錯法累到三次才出現；一塊 12% 朱砂，不是新色）-->
        <g id="prints" pointer-events="none">
          <ellipse cx="700" cy="556" rx="17" ry="23" fill="var(--zhu)" opacity=".12"/>
          <ellipse cx="730" cy="562" rx="12" ry="17" fill="var(--zhu)" opacity=".12"/>
        </g>

        <!-- 塔旁两块石基的接觸影（唯一一层阴影：贴底 8% 墨、無方向性、每處一層）-->
        <rect class="shadow" x="120" y="424" width="200" height="7" rx="3"/>
        <rect class="shadow" x="260" y="424" width="200" height="7" rx="3"/>
        <rect class="shadow" x="884" y="518" width="272" height="7" rx="3"/>
      </g>

      <!-- ══════════════════ view-close：兩塔近景（層數槽 / 兩塊板 / 竹筆 / 鈴架）══════════════════ -->
      <g id="view-close" class="view">

        <!-- 塔後的地面 -->
        <path class="floor" d="M40,596.4 C300,594.6 700,597.2 1160,595.6 L1160,726 L40,726 Z"/>
        <path class="l3 miter" d="M150,664 C400,662.6 800,665 1090,662.8"/>
        <path class="l2" d="M40,596.6 C300,594.8 700,597.4 1160,595.8"/>

        <!-- 兩塔（走近了看：層數一格一格可數）-->
        <g id="tower-c" class="scenery" pointer-events="none"></g>
        <g id="tower-d" class="scenery" pointer-events="none"></g>

        <!-- A 甲塔的層數槽（空槽是嵌牌处；已記了數的槽是取回讀數牌处）—— 擺在甲塔左側 -->
        <g id="slot-t13" class="hs on" data-hs="h_towerA_slot">

<script>
"use strict";
(function(){

/* ══ 0. 存档：与第一–四幕同一把钥匙、同一结构（幕间协议 §1.3）════════════
   本幕（第八幕）写：act=8，往 done 追加 "act8"，《校勘记》追加本幕条目。
   **只加不改**：不改键名、不改任何既有字段的语义、不写迁移脚本。
   **本幕只往 inv 里放「本幕自己给得出的东西」**（两塔的讀數牌、竹筆、銅鈴），
   不假设「玩家还持有上一幕的物件」。 */
var SAVE_KEY = "diandangsi.rustylake.v1";
var NOTES_KEY = "diandangsi.rustylake.v1.notes";
var ACT_NO = 8, ACT_ID = "act8";

/* ══ 1. 上一幕交下来的东西（跨幕累积的读入侧）════════════════════════
   读不到就是 null —— **照实说「沒讀到」，不假装办过**（协议 §1.3.3）。 */
var PREV = (function(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    var o = JSON.parse(raw);
    if(!o || !o.f) return null;
    return o;
  }catch(e){ return null; }
})();
function prevHas(k){ return !!(PREV && PREV.f && PREV.f[k]); }
function prevRead(k){ return !!(PREV && PREV.read && PREV.read.indexOf(k) >= 0); }
function prevDone(id){ return !!(PREV && PREV.done && PREV.done.indexOf && PREV.done.indexOf(id) >= 0); }

/* ══ 2. flags ═══════════════════════════════════════════════════════ */
var FLAG_KEYS = [
  "f_seen_act8","f_bridge_read","f_rule_read",
  "f_vol_a_read","f_vol_b_read","f_panel_read","f_close_entered",
  "f_tier13_taken","f_tier15_taken","f_slot13_set","f_slot15_set",
  "f_tier_pair_moved","f_pen_taken","f_panel_seal","f_bell_taken","f_bell_ok",
  "f_act8_done"
];
var F = {}, INV = [], READ = [], SEL = null, CAM = "room";
/* 两块木牌是否还在原处的牌座上（1 = 在座上；0 = 已取走）*/
var STAND = { it_tier13:1, it_tier15:1 };

function resetState(){
  F = {}; FLAG_KEYS.forEach(function(k){ F[k]=false; });
  F.f_misplaced_count = 0;      /* 与第一–四幕同名同义：错的次数 */
  INV = []; READ = []; SEL = null; CAM = "room";
  STAND = { it_tier13:1, it_tier15:1 };
}

/* ══ 3. 存读档（幕间协议 §1.3：只加字段，不改字段语义，不改键名）══════ */
var saveT = null;
var DONE = (PREV && PREV.done && PREV.done.slice) ? PREV.done.slice() : [];
var NOTE_LOG = (PREV && PREV.notes && PREV.notes.slice) ? PREV.notes.slice() : [];
function markActDone(){
  if(F.f_act8_done && DONE.indexOf(ACT_ID) < 0) DONE.push(ACT_ID);
}
function appendNotes(){
  var es = noteEntries();
  for(var i=0;i<es.length;i++){
    var key = ACT_NO + "|" + es[i].h;
    var has = false;
    for(var j=0;j<NOTE_LOG.length;j++){ if(NOTE_LOG[j].key === key){ has = true; break; } }
    if(!has) NOTE_LOG.push({ key:key, act:ACT_NO, h:es[i].h, l:es[i].l });
  }
}
function saveNow(){
  try{
    markActDone(); appendNotes();
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      f:F, inv:INV, read:READ, cam:CAM, ts:Date.now(),
      act:ACT_NO, done:DONE, notes:NOTE_LOG
    }));
  }catch(e){}
}
function saveDebounced(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 300); }
function load(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    var o = JSON.parse(raw);
    if(!o || !o.f) return false;
    FLAG_KEYS.forEach(function(k){ if(k in o.f) F[k]=o.f[k]; });
    if(typeof o.f.f_misplaced_count === "number") F.f_misplaced_count = o.f.f_misplaced_count;

/* ══ 6. 两座塔的生成式画法 ═══════════════════════════════════════════
   与第一幕 §3.6「塔 13 檐由脚本生成」同一做法：**不手写每一级**。
   同一把尺：700 尺 ↔ 192.5px（0.275 px/尺）。
     甲塔：凡十三級 · 鐵柱高三尺 · 金槃十三重 · 合去地七百尺  → 铁柱 0.8px
     乙塔：金盤十五重 · 鐵柱八十八尺 · 去地六十三丈二尺        → 铁柱 24.2px
   两塔**基座同高（地脚都在 y=430）**：玩家数的是层数，不是高度。 */
var TOWER = {
  A: { x:160, yBase:430, r:24, bodyTop:237.5, tiers:13, ironPx:0.8,  discN:13, discR:76, discH:13,
       name:"甲塔", sub:"凡十三級" },
  B: { x:300, yBase:430, r:24, bodyTop:256.2, tiers:15, ironPx:24.2, discN:15, discR:64, discH:12,
       name:"乙塔", sub:"十五重" }
};
function buildOneTower(hostId, spec){
  var host = document.getElementById(hostId); if(!host) return;
  host.innerHTML = "";
  var x = spec.x, base = spec.yBase, r = spec.r, top = spec.bodyTop;
  function px(v){ return Math.round(v*100)/100; }
  /* 石基：三层叠石（每层進深 20 → 可见水平面带高 10px）*/
  var yy = [base-12, base-24, base-36], rr = [r*2.9, r*2.3, r*1.7], hh = [16, 12, 8];
  for(var s=0;s<3;s++){
    var y0 = yy[s], half = rr[s], hgt = hh[s];
    host.appendChild(el("path", { "class":"l1 f-card",
      d:"M"+px(x-half)+","+px(y0+10.4)+" C"+px(x-half*0.45)+","+px(y0+8.6)+" "+px(x+half*0.45)+","+px(y0+11.2)+" "+px(x+half)+","+px(y0+9.6)
        +" L"+px(x+half)+","+px(y0+hgt+10.4)+" C"+px(x+half*0.45)+","+px(y0+hgt+12.2)+" "+px(x-half*0.45)+","+px(y0+hgt+9.6)+" "+px(x-half)+","+px(y0+hgt+11.4)+" Z" }));
  }
  /* 塔身：逐級 —— 每一級是一个竖直面（rect）+ 偶数級的層數線（写在一条 path 里）*/
  var n = spec.tiers, h = (base - 36 - top) / n;
  var lines = "";
  for(var i=0;i<n;i++){
    var y0 = top + i*h, y1 = y0 + h - 2.2;
    var half = r * (1 - 0.30 * (i/(n-1||1)));
    host.appendChild(el("rect", { "class":"l1 f-card", x:px(x-half), y:px(y0),
      width:px(half*2), height:px(y1-y0) }));
    if(i % 2 === 0){
      lines += "M" + px(x-half-5) + "," + px(y0+2)
            + " C" + px(x-half-1) + "," + px(y0+1.2) + " " + px(x+half+1) + "," + px(y0+2.8)
            + " " + px(x+half+5) + "," + px(y0+2);
    }
  }
  host.appendChild(el("path", { "class":"l3 miter", d:lines }));
  /* 金槃／金盤：塔頂上的圆环（只用线，不平涂朱砂）*/
  var dy0 = top - 4;
  for(var j=0;j<spec.discN;j++){
    var rw = spec.discR * (1 - 0.010*j);
    host.appendChild(el("path", { "class": (j%2===0 ? "l2" : "l3"),
      d:"M"+px(x-rw)+","+px(dy0-j*spec.discH*0.55+0.4)+" C"+px(x-rw*0.4)+","+px(dy0-j*spec.discH*0.55-0.6)
        +" "+px(x+rw*0.4)+","+px(dy0-j*spec.discH*0.55+1.4)+" "+px(x+rw)+","+px(dy0-j*spec.discH*0.55+0.4) }));
  }
  /* 铁柱（两态的差别就在这 0.8px 与 24.2px）*/
  var iy = dy0 - spec.discH*0.55*(spec.discN-1) - 4;
  host.appendChild(el("path", { "class":"l2 miter",
    d:"M"+px(x-2.4)+","+px(iy)+" L"+px(x-2.4)+","+px(iy-spec.ironPx-4)
      +" M"+px(x+2.4)+","+px(iy)+" L"+px(x+2.4)+","+px(iy-spec.ironPx-4) }));
  host.appendChild(el("path", { "class":"l1 f-wood",
    d:"M"+px(x-8)+","+px(iy-spec.ironPx-4)+" L"+px(x+8)+","+px(iy-spec.ironPx-4.8)
      +" L"+px(x+8)+","+px(iy-spec.ironPx-14)+" L"+px(x-8)+","+px(iy-spec.ironPx-13.2)+" Z" }));
  /* 塔名与級數（写在塔頂之上）*/
  host.appendChild(txt("tx-k", x, top-30, spec.name, { "font-size":14, "text-anchor":"middle" }));
  host.appendChild(txt("tx-k", x, top-14, spec.sub, { "font-size":12, "text-anchor":"middle", fill:"var(--ink2)" }));
}
function buildTowers(){
  buildOneTower("tower-a", TOWER.A);
  buildOneTower("tower-b", TOWER.B);
  var c = { A: JSON.parse(JSON.stringify(TOWER.A)), B: JSON.parse(JSON.stringify(TOWER.B)) };
  c.A.x = 232; c.A.r = 42;
  c.B.x = 432; c.B.r = 42;

var AC = null, SND = true;
function sfx(kind){
  if(!SND) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    var f = kind==="wood"?150 : kind==="board"?260 : kind==="bell"?520 : 200;
    o.type = kind==="bell" ? "triangle" : "sine";
    o.frequency.value = f;
    g.gain.value = 0.0001;
    o.connect(g); g.connect(AC.destination);
    g.gain.exponentialRampToValueAtTime(0.06, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+(kind==="bell"?0.60:0.24));
    o.start(t); o.stop(t+(kind==="bell"?0.62:0.26));
  }catch(e){}
}

/* ══ 17. 失败回路：可复原、不锁死（与第一–四幕同一语法）═══════════════
   规则：任何一个放错的动作 = 现场变化（抖一下 / 筆滑落 / 牌弹回）+ 一句方位话。
   计数器只管「累了几次」。**绝不出判语。** */
function shake(hsId){
  var g = document.querySelector('.hs[data-hs="'+hsId+'"]');
  if(g){ g.classList.remove("shaking"); void g.offsetWidth; g.classList.add("shaking");
    setTimeout(function(){ g.classList.remove("shaking"); }, 300); }
}
function bump(hsId){
  shake(hsId);
  F.f_misplaced_count = (F.f_misplaced_count|0) + 1;
  render(); saveDebounced();
}
function ghostFall(id, ms){
  var gh = document.getElementById(id); if(!gh) return;
  gh.classList.remove("fall"); void gh.offsetWidth; gh.classList.add("fall");
  setTimeout(function(){ gh.classList.remove("fall"); }, ms+80);
}

/* 層數槽：同一格两用 —— 空槽是「嵌牌的地方」；已記了數的槽是「取回讀數牌的地方」。

function slotTier(which){
  var wantId = (which === "A") ? "it_tier13" : "it_tier15";
  var keySet = (which === "A") ? "f_slot13_set" : "f_slot15_set";
  if(F[keySet]){
    /* 槽裡已經記着這一塔的層數 —— 再點就是「把讀數牌取回來」*/
    if(INV.indexOf(wantId) >= 0){
      SEL = wantId; renderInv(); applyArmed(); render();
      say("把這一塔的讀數牌取了下來 —— 兩塊都擺到尺板上，兩套數才並得起來。", false, 3600);
      saveDebounced();
      return;
    }
    if(SEL){ INV.splice(INV.indexOf(SEL), 1); SEL = null; }
    INV.push(wantId); SEL = wantId;
    renderInv(); applyArmed(); render(); sfx("tag");
    say("把這一塔的讀數牌取了下來 —— 兩塊都擺到尺板上。", false, 3600);
    saveDebounced();
    return;
  }
  if(!SEL){
    say("槽還空着 —— 塔旁的讀數牌先取一塊，再嵌進來。", false, 3200);
    shake(which === "A" ? "h_towerA_slot" : "h_towerB_slot");
    return;
  }
  if(SEL !== wantId){
    /* 放错：牌沿槽边弹回（現場變化），牌仍留在手邊 —— 可立即重放 */
    var gh = document.getElementById("tier-ghost");
    if(gh){ gh.setAttribute("class", which === "A" ? "at-a" : "at-b"); ghostFall("tier-ghost", 460); }
    bump(which === "A" ? "h_towerA_slot" : "h_towerB_slot");
    say("這一塊不是這個槽的讀數 —— 牌順着槽邊滑了回來。看它記的是哪一座塔。", false, 4200);
    return;
  }
  F[keySet] = true;
  INV.splice(INV.indexOf(wantId), 1); if(SEL === wantId) SEL = null;
  renderInv(); applyArmed();
  sfx("board");
  say((which === "A" ? "甲塔" : "乙塔") + "的層數記在槽裡了 —— 兩座都數過，再把讀數牌擺到尺板上。", false, 4200);
  render(); saveNow();
}
function putOnBoard(){
  if(!SEL){ say("尺板空着 —— 兩塊讀數牌都要擺上去。", false, 3000); return; }
  if(SEL !== "it_tier13" && SEL !== "it_tier15"){
    say("這一塊不是兩塔的讀數牌 —— 尺板上只擺讀數。", false, 3000);
    shake("h_meas"); return;
  }
  var both = (INV.indexOf("it_tier13") >= 0 && INV.indexOf("it_tier15") >= 0);
  var standing = (SEL === "it_tier13") ? (F.f_tier13_taken || STAND.it_tier13 === 0)
                                       : (F.f_tier15_taken || STAND.it_tier15 === 0);
  INV.splice(INV.indexOf(SEL), 1);
  if(SEL === "it_tier13") STAND.it_tier13 = 0; else STAND.it_tier15 = 0;
  SEL = null; renderInv(); applyArmed(); sfx("board");
  if(both && standing){ F.f_tier_pair_moved = true; }
  render(); saveNow();
  if(F.f_tier_pair_moved){
    say("兩塊讀數牌並擺在尺板上 —— 八十八尺與三百尺，高下自分；十三與十五，也自分。", false, 4600);
  }else{
    say("這一塊擺上了；另一座塔的讀數牌也取來，兩塊並擺才看得出。", false, 3600);
  }
}
function ringBell(){
  if(F.f_bell_ok){ say("鈴架上已挂着一只。", false, 2200); return; }
  if(!SEL){
    if(F.f_bell_taken){ say("銅鈴在手，或已挂着 —— 架下那格空了。", false, 2600); return; }
    F.f_bell_taken = true; hold("it_bell"); sfx("tag");
    say("從架下格裡取了那只銅鈴 —— 挂到架上那根横枨上。", false, 3400);
    render(); saveNow(); return;
  }
  if(SEL !== "it_bell"){ say("架上挂的是鈴 —— 不是這一塊。", false, 2600); shake("h_bell"); return; }
  take("it_bell");
  F.f_bell_ok = true; F.f_act8_done = true;
  sfx("bell");
  say("銅鈴挂上了 —— 兩塔的層數已數過、兩套數已並置、勘異板也落了印。這一院歸檔。", false, 4600);
  render(); saveNow();
}
/* 竹筆按在勘異板上（同一个热点两用：手上是竹筆 = 落印；手空 = 翻看板上的字）
   —— 手空就按，現場什么也不落、计数器 +1，并给一句方位话；可立即重放。 */
function pressPanel(){
  if(F.f_panel_seal && SEL !== "it_pen"){ showPaper("p_bi"); return; }
  if(SEL !== "it_pen"){
    bump("h_panel");
    if(!F.f_tier_pair_moved) say("板上還空着兩行 —— 兩塔的層數先數齊，兩塊讀數牌再擺到尺板上。", false, 4600);
    else say("板上要落印 —— 架上那支竹筆取了來，再按上去。", false, 3400);
    showPaper("p_bi");
    return;
  }
  if(F.f_panel_seal){ showPaper("p_bi"); return; }
  if(!F.f_tier_pair_moved){
    ghostFall("pen-ghost", 460);
    bump("h_panel");
    say("這一筆落不下去 —— 兩塔的層數還沒有數齊。先數，再記。", false, 4200);
    return;
  }
  take("it_pen");
  F.f_panel_seal = true;
  sfx("board");
  say("竹筆落在勘異板上 —— 兩套數既不合，兩存之，不強合。", false, 4600);
  render(); saveNow();
}

/* ══ 19. 老掌书：只指方位，不给内容；没有提示按钮 ═══════════════════ */
var HINTS = {
  towers:"院裡兩座塔 —— 看的是層數，不是高下。",
  boards:"塔旁各有一個層數槽；尺板上要擺兩塊讀數牌。",
  panel:"那方勘異板，是把兩套數並置的地方。",
  bell:"架下格裡有一只銅鈴；架上那根横枨是挂它的地方。",
  vols:"架上兩本卷五 —— 同一座塔，兩套數。"
};
var hintUsed = {}, lastHint = 0;
function hint(){
  var now = Date.now();
  if(now - lastHint < 180000) return;
  var order;
  if(!F.f_tier_pair_moved) order = ["towers","boards","vols"];
  else if(!F.f_panel_seal) order = ["panel","bell"];
  else order = ["bell","vols"];
  for(var i=0;i<order.length;i++){
    var k = order[i];
    if(hintUsed[k]) continue;
    hintUsed[k] = 1; lastHint = now;
    say(HINTS[k], false, 4200);
    return;
  }
}
var idleT = null;
function pokeIdle(){ clearTimeout(idleT); idleT = setTimeout(hint, 90000); }
document.addEventListener("mousemove", pokeIdle, {passive:true});
document.addEventListener("keydown", pokeIdle);

/* ══ 20. 事件绑定 ═══════════════════════════════════════════════════ */
function inActiveView(node){
  var v = node.closest ? node.closest(".view") : null;
  return !v || v.classList.contains("active");
}
stage.addEventListener("click", function(e){
  var hs = e.target.closest ? e.target.closest(".hs") : null;
  if(hs && hs.dataset.hs && !hs.classList.contains("gone")){
    if(inActiveView(hs)) onHotspot(hs.dataset.hs);
    return;
  }
  /* 判序：熱點 → 紙 → 過渡頁 → 台賬。紙（#paper-layer）畫在台賬之後、壓在它上面，
     若先 return 掉台賬那一步，簿子開着時那一頁就永遠收不掉，只能按 Esc（坑 24）。 */
  if(PAPER_OPEN){ closePaper(); return; }
  if(bridgeOpen()){ return; }
  if(LEDGER) return;
  if(CAM !== "room") goRoom();
});
$("#bk").addEventListener("click", function(e){ e.stopPropagation(); showLedger(true); });
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    if(bridgeOpen()){ closeBridge(); return; }
    if(LEDGER){ showLedger(false); return; }
    if(PAPER_OPEN) closePaper(); else if(CAM !== "room") goRoom();
  }
  var k = (e.key||"").toLowerCase();
  if(k === "b") showLedger(!LEDGER);
  if(k === "1") setCam("room");
  if(k === "2") setCam("close");
});

/* ══ 21. 启动 ═══════════════════════════════════════════════════════ */
function boot(){
  buildTowers();
  buildSymbols();
  var restored = false;
  var AUTO = (location.hash.match(/auto=([a-z0-9]+)/i)||[])[1];
  var FRESH = /fresh/.test(location.hash);
  if(AUTO || FRESH){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} resetState(); }
  else restored = load();
  if(!restored) resetState();
  F.f_seen_act8 = true;
  render();
  setCam(CAM || "room");
  syncModal();
  if(AUTO){ showLedger(true); }
  /* 截图探针（仅 ?probe= 时生效）：只摆 flags 与相机，不跳过任何交互分支 */
  var PROBE = (location.search.match(/[?&]probe=([a-z0-9]+)/i)||[])[1];
  if(/[?&]still=1/.test(location.search)){
    var st = document.createElement("style");
    st.textContent = "*{transition-duration:0s!important;animation-delay:0s!important}";
    document.head.appendChild(st);
  }
  function showRoom(){ showLedger(false); F.f_seen_act8 = true; setCam("room"); render(); }
  function showClose(){ showLedger(false); setCam("close"); render(); }
  if(PROBE){
    if(PROBE === "room"){ showRoom(); }
    else if(PROBE === "close"){ showClose(); }
    else if(PROBE === "rule"){ showRoom(); showPaper("p_rule"); }
    else if(PROBE === "vola"){ showRoom(); showPaper("p_ly5a"); }
    else if(PROBE === "volb"){ showRoom(); showPaper("p_ly5b"); }
    else if(PROBE === "panel"){ showRoom(); showPaper("p_bi"); }
    else if(PROBE === "panelread"){
      F.f_rule_read = true; F.f_vol_a_read = true; F.f_vol_b_read = true;
      showClose(); showPaper("p_bi");
    }
    else if(PROBE === "bridge"){ showRoom(); openBridge(); }
    else if(PROBE === "bridgefull"){ load(); render(); setCam("room"); showLedger(false); openBridge(); }
    else if(PROBE === "counted"){
      F.f_rule_read = true; F.f_vol_a_read = true; F.f_vol_b_read = true; F.f_panel_read = true;
      F.f_tier13_taken = true; F.f_tier15_taken = true;
      F.f_slot13_set = true; F.f_slot15_set = true; STAND = { it_tier13:0, it_tier15:0 };
      showClose();
    }
    else if(PROBE === "moved"){
      F.f_rule_read = true; F.f_vol_a_read = true; F.f_vol_b_read = true; F.f_panel_read = true;
      F.f_tier13_taken = true; F.f_tier15_taken = true;
      F.f_slot13_set = true; F.f_slot15_set = true; F.f_tier_pair_moved = true;
      STAND = { it_tier13:0, it_tier15:0 };
      showClose();
    }
    else if(PROBE === "done"){
      F.f_rule_read = true; F.f_vol_a_read = true; F.f_vol_b_read = true; F.f_panel_read = true;
      F.f_tier13_taken = true; F.f_tier15_taken = true; F.f_pen_taken = true;
      F.f_slot13_set = true; F.f_slot15_set = true; F.f_tier_pair_moved = true;
      F.f_panel_seal = true; F.f_bell_taken = true; F.f_bell_ok = true; F.f_act8_done = true;
      STAND = { it_tier13:0, it_tier15:0 };
      showClose();
    }
    else if(PROBE === "notes"){
      F.f_rule_read = true; F.f_vol_a_read = true; F.f_vol_b_read = true; F.f_panel_read = true;
      F.f_tier13_taken = true; F.f_tier15_taken = true; F.f_pen_taken = true;
      F.f_slot13_set = true; F.f_slot15_set = true; F.f_tier_pair_moved = true;
      F.f_panel_seal = true; F.f_bell_taken = true; F.f_bell_ok = true; F.f_act8_done = true;
      showRoom(); showNotes();
    }
  }
  requestAnimationFrame(function(){ $("#boot").classList.add("gone"); });
  pokeIdle();
  if(AUTO) runAuto(AUTO);
  else if(restored) say("接着上次的地方。", false, 2400);
}

/* ══ 22. 自动走通：清档重来 + 只用真实 MouseEvent('click') 打真实 .hit ══
   脚本**不直接改任何 flag**：两塔的层数靠「取讀數牌 → 嵌層數槽」自然成立，
   兩套數並置靠「擺上尺板」自然成立，勘異板靠「竹筆按上去」自然成立，
   收束由這幾件事自然帶來 —— runAuto 里没有一处 F.xxx = true。 */
function click(hsId){
  var n = document.querySelector('.hs[data-hs="'+hsId+'"]');
  if(!n) return false;
  if(n.classList.contains("gone")) return false;
  var hit = n.querySelector(".hit") || n;
  if(!inActiveView(n)) return false;
  hit.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function clickEl(sel){
  var n = document.querySelector(sel);
  if(!n) return false;
  n.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function w(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function slotOf(itemId){
  var i = INV.indexOf(itemId); if(i < 0) return null;
  return document.querySelector('.slot[data-slot="'+i+'"]');
}
function pickSlot(itemId){
  if(SEL === itemId) return true;      /* 已選中的就不再點一次（否則會取消選中）*/
  var s = slotOf(itemId); if(!s) return false;
  s.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return SEL === itemId;
}
async function runAuto(stop){
  var log = [];
  function step(name, ok){ log.push(name + "=" + (ok ? "ok" : "MISS")); }
  function report(){
    document.title = "SELFTEST::" + log.join(" | ")
      + " || FLAGS[" + FLAG_KEYS.filter(function(k){ return F[k]; }).join(",") + "]"
      + " || misplaced=" + F.f_misplaced_count
      + " || INV[" + INV.join(",") + "] || CAM=" + CAM
      + " || STAND[" + STAND.it_tier13 + STAND.it_tier15 + "]"
      + " || READ[" + READ.join(",") + "]"
      + " || DONE[" + DONE.join(",") + "]";
    document.body.setAttribute("data-selftest", log.join(" | "));
  }
  try{
    if(stop === "ledger"){ step("停在值房台賬", LEDGER); report(); return; }
    step("0_讀幕間", click("h_ledger_bridge")); await w(340);
    step("1_收起幕間", click("h_bridge_go")); await w(340);
    if(stop === "bridge"){ step("停在幕間", true); report(); return; }
    step("2_推門入院", click("h_ledger_enter")); await w(380);
    /* ── 翻書可查：塔院體例 + 卷五兩本 ─────────────────────── */
    step("3_讀塔院體例", click("h_rule")); await w(300); closePaper(); await w(140);
    step("4_讀卷五甲本", click("h_vol_a")); await w(300); closePaper(); await w(140);
    step("5_讀卷五乙本", click("h_vol_b")); await w(300); closePaper(); await w(140);
    /* ── 進兩塔近景：讀勘異板、逐層數、兩塔各記一牌 ─────────── */
    step("6_進兩塔近景", click("h_tower_go")); await w(620);
    step("7_在近景", CAM === "close");
    step("8_讀勘異板", click("h_panel")); await w(300); closePaper(); await w(140);
    step("9_四處已讀", !!(F.f_rule_read && F.f_vol_a_read && F.f_vol_b_read && F.f_panel_read));
    step("10_取甲塔讀數牌", (function(){ click("h_tier_13"); return SEL === "it_tier13"; })()); await w(340);
    step("11_取乙塔讀數牌", (function(){ click("h_tier_15"); return SEL === "it_tier15"; })()); await w(340);
    /* ── 錯法一：把乙塔的牌嵌到甲塔的槽（牌沿槽边弹回，可立即重放）── */
    step("12_嵌到甲塔槽", (function(){ click("h_towerA_slot"); return (F.f_misplaced_count|0) >= 1; })()); await w(440);
    step("13_錯法一已記_槽空", !F.f_slot13_set);
    step("14_選中甲塔牌", (function(){ return pickSlot("it_tier13"); })()); await w(300);
    step("15_嵌到甲塔槽", (function(){ click("h_towerA_slot"); return !!F.f_slot13_set; })()); await w(520);
    step("16_選中乙塔牌", (function(){ return pickSlot("it_tier15"); })()); await w(320);
    step("17_嵌到乙塔槽", (function(){ click("h_towerB_slot"); return !!F.f_slot15_set; })()); await w(480);
    step("18_兩塔層數已記", !!(F.f_slot13_set && F.f_slot15_set) && !!F.f_tier_pair_moved);
    /* ── 把兩塊讀數牌從層數槽取回、並擺到尺板上 ─────────────── */
    step("19_取回甲塔牌", (function(){ click("h_towerA_slot"); return INV.indexOf("it_tier13") >= 0; })()); await w(340);
    step("20_甲牌擺上尺板", (function(){ if(!pickSlot("it_tier13")) return false;
        click("h_meas");
        return INV.indexOf("it_tier13") < 0; })()); await w(420);
    step("21_取回乙塔牌", (function(){ click("h_towerB_slot"); return INV.indexOf("it_tier15") >= 0; })()); await w(340);
    step("22_乙牌擺上尺板", (function(){ if(!pickSlot("it_tier15")) return false;
        click("h_meas");
        return INV.indexOf("it_tier15") < 0; })()); await w(480);
    step("23_兩套數並置", (function(){ var n = document.getElementById("meas-signs"); return !!n && n.classList.contains("on"); })());
    /* ── 錯法二：竹筆未在手就按勘異板（現場什么也不落，计数器 +1，可立即重放）── */
    step("24_空手按板", (function(){ click("h_panel"); return (F.f_misplaced_count|0) >= 2; })()); await w(340);
    step("25_收起重看", (function(){ closePaper(); return PAPER_OPEN === null; })()); await w(160);
    step("26_錯法二已記_未落印", !F.f_panel_seal);
    /* ── 架上取竹筆 → 按在勘異板上（兩存不強合）──────────────── */
    step("27_架上取竹筆", (function(){ click("h_pen"); return SEL === "it_pen"; })()); await w(420);
    step("28_竹筆按板", (function(){ pressPanel(); return !!F.f_panel_seal; })()); await w(480);
    step("29_勘異板已落印", !!F.f_panel_seal);
    /* ── 從架下格取銅鈴，挂到架上 ───────────────────────────── */
    step("30_取銅鈴", (function(){ click("h_bell"); return SEL === "it_bell"; })()); await w(340);
    step("31_挂上銅鈴", (function(){ click("h_bell"); return !!F.f_bell_ok; })()); await w(520);
    step("32_收束成立", !!F.f_act8_done);
    step("33_鈴已離手", INV.indexOf("it_bell") < 0);
    /* ── 收束：回院中 → 開台账 → 校勘记 ─────────────────────── */
    step("34_回院中", (function(){ click("h_close_back"); return CAM === "room"; })()); await w(420);
    step("35_開台賬", (function(){ clickEl("#bk"); return LEDGER; })()); await w(380);
    step("36_校勘記", (function(){ click("h_ledger_notes"); return PAPER_OPEN === "__notes"; })()); await w(460);
    if(stop === "notes"){ report(); return; }
    closePaper(); await w(240);
    step("37_再入院", click("h_ledger_enter")); await w(380);
    step("38_收束_本幕已畢", !!F.f_act8_done);
  }catch(err){ log.push("ERR=" + (err && err.message)); }
  report();
}

window.__dd = { F:function(){ return F; }, INV:function(){ return INV; }, DONE:function(){ return DONE; },
  CAM:function(){ return CAM; }, STAND:function(){ return STAND; }, click:click, setCam:setCam,
  auto:runAuto, pressPanel:pressPanel, inActiveView:inActiveView,
  state:function(){ return {F:F, INV:INV, CAM:CAM, SEL:SEL, DONE:DONE, READ:READ, STAND:STAND}; } };
/* 探针（_selftest/probe-accept-act8.html）需要按名调用这两个只切覆盖层/重绘的函数 */
window.showLedger = showLedger;
window.render = render;

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
})();
</script>
