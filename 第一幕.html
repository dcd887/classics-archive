<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>典藏司 · 校書閣 · 第一幕</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" href="favicon.ico">
<style>
  /* ══ 色板：现有成品 dist/index.html 第 9–11 行的 9 个 token，不新增第 8 色 ══ */
  :root{
    --paper:#f3ecdf; --paper2:#eae1d0; --card:#faf6ec;
    --ink:#2a2622; --ink2:#5c554b; --faint:#8d8577;
    --zhu:#a63a2a; --line:#d3c8b4; --line2:#c0b49d;
    --l1:2.2px; --l2:1.4px; --l3:0.9px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* 窗口自适应（模板附录 A.2 / 坑 23）：宽度**同时**受「视窗宽 − 内边距」与
     「(视窗高 − 台賬高 − 内边距) × 1200/720」两个上界约束，取最小。
     旧版只写 min(97vw,1200px) —— 窗口一矮，舞台上下被切（1214×650 实测 top=−60 且出纵向滚动条）。
     96px = 台賬 64 + 上下内边距 20 + 12px 余量。 */
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Songti SC","STSong",Georgia,"Noto Serif SC",serif;
    display:flex; align-items:center; justify-content:center; padding:10px;
  }
  #app{width:min(100%,1200px,calc((100vh - 96px) * 1.66667));
       display:flex;flex-direction:column;max-height:100%}
  #stage{display:block;width:100%;height:auto;aspect-ratio:1200/720;background:var(--paper);overflow:hidden}
  #hud{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:14px;
       background:var(--paper);border-top:1px solid var(--line2);padding:0 6px}
  #slots{display:flex;gap:4px}
  .slot{width:56px;height:56px;border:1px solid transparent;position:relative;cursor:default}
  .slot .under{position:absolute;left:8px;right:8px;bottom:6px;height:1px;background:var(--line2)}
  .slot svg{display:block;width:52px;height:52px;margin:1px;
            transition:transform 120ms ease}
  .slot.has{cursor:pointer}
  .slot.sel{border-color:var(--zhu)}
  .slot.sel svg{transform:translateY(-2px)}
  #caption{margin-left:auto;margin-right:8px;max-width:62%;
           font-family:"Kaiti SC","STKaiti","KaiTi",serif;
           font-size:13px;line-height:1.6;color:var(--ink2);text-align:right;
           opacity:0;transition:opacity 500ms ease}
  #caption.on{opacity:1}
  #caption.zhu{color:var(--zhu)}

  /* ══ 线宽三级（1200×720 与近景同值；vector-effect 保证跨视图/跨缩放不漂移）══ */
  .l1{stroke:var(--ink);stroke-width:var(--l1);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l2{stroke:var(--ink2);stroke-width:var(--l2);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l3{stroke:var(--faint);stroke-width:var(--l3);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .miter{stroke-linejoin:miter}
  .f-wood{fill:#b9a88c}
  .f-card{fill:var(--card)}
  .f-zhu{fill:var(--zhu)}
  .tx{fill:var(--ink);font-family:"Songti SC","STSong",Georgia,serif}
  .tx-k{fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .tx-z{fill:var(--zhu);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .vert{writing-mode:vertical-rl;text-orientation:upright}
  .shadow{fill:var(--ink);opacity:.08;stroke:none}
  .ns *{vector-effect:non-scaling-stroke}

  /* ══ 视图切换 ══ */
  .view{opacity:0;pointer-events:none;transition:opacity 500ms ease}
  .view.active{opacity:1;pointer-events:auto}

  /* ══ 真人可点（模板附录 A.4 / 坑 22）══════════════════════════
     真因：`pointer-events` 可继承，但**子元素显式写值就压过继承**；
     `.hs .hit{pointer-events:all}` 正是那个显式值，于是「关掉的」层里那些透明
     `.hit` 矩形仍然接得住鼠标；而 `opacity:0` 也照样参与命中测试（只有
     `display:none` 才退出）。两层相乘 → 真人的点击被看不见的矩形截走。
     修法纯 CSS：把非活动层的**整棵子树**钉死，不动任何 `.hit` 写法、不动渐隐动画。
     `#world.modal` 由 `syncModal()` 挂/摘（showLedger / boot 各调一次）。 */
  .view:not(.active), .view:not(.active) *,
  #ledger:not(.on),   #ledger:not(.on) *,
  #bridge:not(.on),   #bridge:not(.on) *,
  .paper:not(.show),  .paper:not(.show) *{pointer-events:none!important}
  /* 上層（值房台賬）壓着時，底下場景整棵釘死 */
  #world.modal .view, #world.modal .view *{pointer-events:none!important}
  /* 心衣内衬那角纸头是「三件全归位后才淡入」的灰显层：未揭示时它的 .hit
     仍是显式 `all`，会把抱腹中段的点击吃掉（修前实测 h_garment_b 中心命中它，
     页面毫无反应）→ 未 `.show` 时整棵连同 .hit 一起钉死。 */
  #lining:not(.show), #lining:not(.show) *{pointer-events:none!important}

  /* ══ 热点：默认 / 可点 / 已取 三态光标 ══ */
  .hs{cursor:default}
  .hs .hit{fill:transparent;stroke:none;pointer-events:all}
  /* 命中**只认 `.hit`**：`.art` 一律不吃鼠标。修前实测三处「中心点被自己这一族的
     装饰路径截走」—— 全景/近景里点案面中段命中抽屉面板、柜体中心命中抱腹的衣面，
     改后这些点落回各自的 `.hit`。悬停不受影响：光标进了 `.hit` 就是 `.hs:hover`。 */
  .hs .art{pointer-events:none}
  .hs.on .hit{cursor:pointer}
  .hs.on:hover .art path,.hs.on:hover .art rect,.hs.on:hover .art circle,
  .hs.on:hover .art line,.hs.on:hover .art polygon{stroke:var(--zhu);stroke-width:3}
  .hs.armed .art path,.hs.armed .art rect,.hs.armed .art circle,
  .hs.armed .art line,.hs.armed .art polygon{stroke:var(--zhu);stroke-width:3}
  /* 窗外一枝属「场景」（在窗纸之后、窗棂之前），不是可点物件本体
     → 不随可点态描边转朱砂。选择器多一层 .scenery，(0,5,1) > (0,4,1) */
  .hs.on:hover .art .scenery path,.hs.on:hover .art .scenery circle{
    stroke:var(--faint);stroke-width:var(--l3)}
  .hs.gone, .hs.gone *{pointer-events:none}
  .hs.gone .art{opacity:0}
  .hs.breathe .art *{stroke:var(--zhu)!important;animation:breathe 1.2s ease-in-out 2}
  @keyframes breathe{0%,100%{stroke-opacity:1}50%{stroke-opacity:.4}}

  /* ══ 世界变化 ① 抽屉（class 驱动，不另维护坐标表）══
     视角改造：抽屉拉开后要能看见「内腔」——腔口画在案身正面上，
     由 opacity 淡入（不参与位移），位移仍只作用在 #drawer-body 上 */
  #drawer-body{transform:translateY(0);transition:transform 700ms cubic-bezier(.2,.8,.2,1)}
  #drawer.open #drawer-body{transform:translateY(54px)}
  #drawer.open .drawer-plaques{opacity:1;transition:opacity 300ms ease 500ms}
  #drawer .drawer-plaques{opacity:0}
  #drawer .rail{opacity:0;transition:opacity 300ms ease 400ms}
  #drawer.open .rail{opacity:1}
  /* 抽屉内腔（腔口 + 两侧壁 + 腔内底板）：闭合时完全不可见 */
  #drawer .drawer-cavity{opacity:0;transition:opacity 260ms ease 90ms}
  #drawer.open .drawer-cavity{opacity:1}

  /* ══ 视角规格：轻斜投影（微斜/等轴测，非透视）══════════════════
     深度轴只落在「上/下」一个方向：dy = -0.35 · depth（见 实现说明 §11）。
     由此**所有水平面**（地面、案面、柜内隔板、暗格底、箱盖内底）
     在画面上都是一个「有厚度的小矩形面」——面可见，光才有地方落。
     水平面专门用 4 条短横线（L3）示意进深方向，不画木纹。 */
  .floor{fill:var(--paper2);stroke:none}
  .slab{fill:var(--card);stroke:none}
  .recess{fill:var(--paper2);stroke:none}
  /* 美术微调 ②（2026-10-15）：**书架层板的板面**改用「面」色 --paper2。
     理由：书架四层板面原用 --card（#faf6ec，全幅最亮的一档），在旧木书架上
     形成四道白亮带，与「旧木」气质相冲；--paper2 是既有 token、且本来就是
     「水平面」的用色（地面 / 案面 / 窗台 / 暗格腔底全用它），换上去既统一又退到后面。
     **不加新色、不动线宽、不动进深（板面仍 10px + 板厚前棱 4px）。**
     为什么**不**一并改「柜内隔板」（同样用 .slab）：柜内背板本身就是
     .recess（--paper2），板面若同色就看不见板了 —— 故柜内隔板仍留 --card。 */
  #view-room .slab,#view-shelf .slab{fill:var(--paper2)}
  #view-right .drawer-cavity{opacity:0;transition:opacity 500ms ease 260ms}
  #view-right.open .drawer-cavity{opacity:1}
  #secret .secret-cavity{opacity:0;transition:opacity 260ms ease 200ms}
  #secret.open .secret-cavity{opacity:1}

  /* ══ 世界变化 ② 柜门（两扇向外转开 900ms；收拢后落在柜体之外）
     视角改造：门扇本身有厚度，柜门组里另有一条「门侧厚度面」（.door-edge），
     与门扇同时开合 —— 于是开门时看得见门板的厚度，不只是两块薄片平移 */
  .door{transition:transform 900ms cubic-bezier(.25,.8,.3,1),opacity 900ms ease;
        pointer-events:none}   /* 门只是柜体的面板：点它走下面那张柜体热区（见结构注释） */
  #view-right.open .door-l{transform:translateX(-96px) scaleX(.16)}
  #view-right.open .door-r{transform:translateX(96px) scaleX(.16)}
  #view-right.open .door{opacity:.55}
  #view-right .cab-inner{opacity:0;transition:opacity 500ms ease 350ms;
    transform:translate(48px,112px) scale(.9)}
  #view-right.open .cab-inner{opacity:1}

  /* ══ 朱砂洇开 / 污斑 ══ */
  .ink-blot{transform-origin:center;transform:scale(.15);opacity:0;
            transition:transform 600ms cubic-bezier(.2,.7,.3,1),opacity 400ms ease}
  .smudged .ink-blot{transform:scale(1);opacity:1}
  .blotted .ink-blot{opacity:.12;transition:opacity 300ms ease}
  .sealmark{opacity:0;transform:scale(.6);transform-origin:center;
            transition:opacity 260ms ease 380ms,transform 260ms cubic-bezier(.2,.8,.2,1) 380ms}
  .sealed .sealmark{opacity:1;transform:scale(1)}

  /* ══ 木牌嵌入 ══ */
  .plaque{opacity:0;transform:translateY(-14px);transition:opacity 160ms ease,transform 120ms cubic-bezier(.2,.9,.3,1.4)}
  .in-slot .plaque{opacity:1;transform:translateY(0)}

  /* ══ 塔：整体竖向比例 + 塔尖升降 ══ */
  #tower{transform-origin:440px 560px;transform:scaleY(1);transition:transform 700ms cubic-bezier(.3,.8,.3,1)}
  #fig.fig15 #tower{transform:scaleY(.9029)}
  #fig.fig1000 #tower{transform:scaleY(1.4286)}
  #pillar{transform-origin:440px 160px;transform:scaleY(.0343);transition:transform 700ms cubic-bezier(.3,.8,.3,1)}
  #fig.fig15 #pillar{transform:scaleY(1.113)}
  #fig.fig1000 #pillar{opacity:0}
  #fig.fig13 .ring14,#fig.fig13 .ring15{opacity:0;transition:opacity 300ms ease}
  .ring14,.ring15{opacity:1;transition:opacity 300ms ease}
  #frame-lift{opacity:0;transition:opacity 400ms ease}
  #fig.fig1000 #frame-lift{opacity:1}

  /* ══ 世界变化 ③ 尺标底座暗格 ══ */
  #secret-lid{transform:translateY(0);transition:transform 420ms cubic-bezier(.2,.9,.3,1.5)}
  #secret.open #secret-lid{transform:translateY(-13px) rotate(-3deg)}
  #secret .secret-in{opacity:0;transition:opacity 300ms ease 260ms}
  #secret.open .secret-in{opacity:1}

  /* ══ 心衣内衬残纸 淡入 ══ */
  #lining{opacity:0;pointer-events:none;transition:opacity 400ms ease}
  #lining.show{opacity:1;pointer-events:auto}

  /* ══ 衣物挂错：顺墙滑回柜中 ══ */
  @keyframes slideback{
    0%{transform:translate(0,0) rotate(0deg);opacity:1}
    55%{transform:translate(calc(var(--dx)*.6),calc(var(--dy)*.45)) rotate(9deg);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) rotate(16deg);opacity:0}
  }
  .sliding{animation:slideback 550ms ease-in forwards;pointer-events:none}
  @keyframes tagshake{0%,100%{transform:rotate(0)}35%{transform:rotate(-2deg)}70%{transform:rotate(2deg)}}
  .tagshake{animation:tagshake 120ms ease-in-out 2;transform-origin:center}

  /* ══ 烛光呼吸（唯一会动的光源；不做火苗形状）══ */
  @keyframes candle{0%,100%{opacity:.9}50%{opacity:.62}}
  #candle-halo{animation:candle 3.4s ease-in-out infinite}
  @keyframes candle-flick{0%,100%{opacity:1}40%{opacity:.75}60%{opacity:.95}}
  /* 晃一下之后回到呼吸。动画简写只有 #id 能压过 #id，故须写成 #candle-halo.flick */
  #candle-halo.flick{animation:candle-flick 200ms ease-out 1,candle 3.4s ease-in-out 200ms infinite}

  /* ══ 进场自动推近书案（纯演出，不可拒绝）══ */
  @keyframes intro{
    0%{transform:scale(1)}40%{transform:scale(1.08)}70%{transform:scale(1.08)}100%{transform:scale(1)}
  }
  #world.intro{animation:intro 3.1s cubic-bezier(.4,0,.2,1) 1;transform-origin:600px 452px}

  /* ══ 纸（在场景内放大展开，不切屏、不加暗底遮罩）══ */
  .paper{opacity:0;pointer-events:none;transition:opacity 260ms ease}
  .paper.show{opacity:1;pointer-events:auto}
  .paper-title{font-size:21px;fill:var(--ink);letter-spacing:.18em}
  .paper-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  .paper-body{font-size:17px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.02em}
  .paper-body .key{font-size:19px}
  .paper-close{font-size:12px;fill:var(--faint);letter-spacing:.08em}

  /* ══ 外壳：典藏司「值房台账」——玩家从台账进房间，不是从「开始」进 ══ */
  #ledger{opacity:0;pointer-events:none;transition:opacity 420ms ease}
  #ledger.on{opacity:1;pointer-events:auto}
  .led-lede{font-size:26px;fill:var(--ink);letter-spacing:.22em}
  .led-sub{font-size:13px;fill:var(--faint);letter-spacing:.12em}
  .led-item{font-size:19px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.04em}
  .led-item.done{fill:var(--faint)}
  .led-act{font-size:21px;fill:var(--ink);letter-spacing:.2em}
  .led-hint{font-size:13px;fill:var(--faint);letter-spacing:.1em}

  /* ══ 物品栏缩略图（symbol 自带表现属性，不依赖文档 CSS 进 shadow tree）══ */
  .slotslot svg{overflow:visible}
  #boot{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;
        justify-content:center;font-size:15px;color:var(--ink2);letter-spacing:.3em;z-index:9}
  #boot.gone{display:none}

  /* v0.20.13 手机端可读性：1200x720 舞台等比缩放后字太小，竖屏时给一条提示（不改玩法） */
  @media (max-width: 760px) and (orientation: portrait) {
    body::before {
      content: "建议横屏或使用电脑游玩，字体更清晰";
      position: fixed; left: 0; right: 0; top: 0; z-index: 9999;
      padding: 6px 8px; text-align: center;
      background: #a63a2a; color: #f3ecdf; font-size: 12px; letter-spacing: .04em;
    }
    body { padding-top: 26px; }
  }
</style>
</head>
<body>

<div id="boot">校書閣</div>

<div id="app">
  <svg id="stage" viewBox="0 0 1200 720" shape-rendering="geometricPrecision"
       xmlns="http://www.w3.org/2000/svg" role="application" aria-label="典藏司校書閣 第一幕">
    <defs>
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
      </filter>
    </defs>
    <rect x="0" y="0" width="1200" height="720" fill="var(--paper)"/>
    <g id="world">

      <!-- ══════════════════ view-room ══════════════════
           视角：轻斜投影 dy = -0.35·depth（详见 实现说明 §11）。
           水平面 = 一个「有厚度的小矩形面」；竖直面 = 一条窄的侧面条。
           以下 ① 地面 → ② 踢脚线/地平线 → ③ 墙脚家具 → ④ 案 → ⑤ 案上物 → ⑥ 烛光 -->
      <g id="view-room" class="view active">
        <!-- ① 地面（水平面）：远边在墙脚（y≈631），近边落在画面之外。
             这一条从 631 到 720 的浅色带就是「地」——家具的脚都踩在这条带上 -->
        <path class="floor" d="M42,630.4 C300,629.6 700,631.2 1158,628.6 L1158,726 L42,726 Z"/>
        <path class="l3 miter" d="M150,700 C400,698.6 800,701 1086,698.8"/>
        <path class="l3 miter" d="M1136,646 C1137.2,678 1136.4,700 1137,718"/>
        <path class="l3 miter" d="M62,646 C61,678 61.8,700 61,718"/>
        <!-- ② 踢脚线（地平线＝墙与地的那条交界）：一笔，家具压其上、只在空处露头 -->
        <path class="l2" d="M42,630.6 C300,628.8 700,631.4 1158,629.6"/>
        <!-- A 书架（靠墙）：每层板的**板面**看得见（板面 dy=10 + 板厚前棱 dy≈3）。
             板与「匣中舊拓」不随可点态描边，故 .art 只包板与匣 -->
        <g class="hs on" data-hs="h_shelf">
          <rect class="hit" x="76" y="88" width="304" height="544"/>
          <g class="art">
            <path class="l1 f-wood" d="M78,89.4 C178,87.6 300,90.2 382,88.6 L384,626.6 C378,630.8 374,631.4 368,631.6 C300,633.2 178,630.6 78,632.4 Z"/>
            <path class="l1 miter" d="M98,109.4 C178,107.8 300,110.2 362,108.6 L364,608.4 C300,610.2 178,607.6 98,609.4 Z"/>
            <path class="slab" d="M98,223.6 C178,222.4 300,224.8 362,223.4 L362,233.6 C300,235 178,232.6 98,233.8 Z"/>
            <path class="l1 f-card" d="M98,233.6 C178,232.4 300,234.8 362,233.4 L362,237.4 C300,238.8 178,236.4 98,237.6 Z"/>
            <path class="l3 miter" d="M150,226.4 L150,232.8 M300,225.4 L300,231.8"/>
            <path class="l2" d="M100,233.6 C178,232.4 300,234.8 362,233.4"/>
            <path class="slab" d="M98,348.4 C178,347.2 300,349.6 362,348.2 L362,358.4 C300,359.8 178,357.4 98,358.6 Z"/>
            <path class="l1 f-card" d="M98,358.4 C178,357.2 300,359.6 362,358.2 L362,362.2 C300,363.6 178,361.2 98,362.4 Z"/>
            <path class="l3 miter" d="M150,351.2 L150,357.6 M300,350.2 L300,356.6"/>
            <path class="l2" d="M100,358.4 C178,357.2 300,359.6 362,358.2"/>
            <path class="slab" d="M98,473.6 C178,472.4 300,474.8 362,473.4 L362,483.6 C300,485 178,482.6 98,483.8 Z"/>
            <path class="l1 f-card" d="M98,483.6 C178,482.4 300,484.8 362,483.4 L362,487.4 C300,488.8 178,486.4 98,487.6 Z"/>

        if(m[0]>cur){ var n1=document.createElementNS("http://www.w3.org/2000/svg","tspan"); n1.textContent=seg.slice(cur,m[0]); tx.appendChild(n1); }
        var sp=document.createElementNS("http://www.w3.org/2000/svg","tspan"); sp.setAttribute("class","key");
        sp.textContent = seg.slice(m[0],m[1]); tx.appendChild(sp);
        cur = m[1];
      });
      if(cur < seg.length){ var n2=document.createElementNS("http://www.w3.org/2000/svg","tspan"); n2.textContent=seg.slice(cur); tx.appendChild(n2); }
      g.appendChild(tx);
      y += 34;
    }
    y += 10;
  }
  // 页的其余部分：L3 等距短横线示意（不画真字）
  for(i=0;i<4 && y<H-60;i++){ g.appendChild(mkPath("l3","M44,"+y+" L"+(W-64)+","+y)); y += 18; }
  var cl = el("text",{ "class":"paper-close", x:W/2, y:H-18, "text-anchor":"middle" });
  cl.textContent = "點紙外任意處 · 收起"; g.appendChild(cl);
  g.addEventListener("click", function(e){ e.stopPropagation(); closePaper(); });
  paperLayer.appendChild(g);
}

var AC = null, SND = true;
function sfx(kind){
  if(!SND) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    var f = kind==="seal"?80 : kind==="plaque"?200 : kind==="drawer"?90 : 300;
    o.type = kind==="plaque" ? "square" : "sine";
    o.frequency.value = f;
    g.gain.value = 0.0001;
    o.connect(g); g.connect(AC.destination);
    g.gain.exponentialRampToValueAtTime(0.06, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+(kind==="drawer"?0.5:0.22));
    o.start(t); o.stop(t+(kind==="drawer"?0.52:0.24));
  }catch(e){}
}

}
function blot(which){
  if(!F["f_leaf_"+which+"_smudged"]){ say("這頁沒有污。", false, 1800); return; }
  F["f_leaf_"+which+"_smudged"] = false;
  F["f_leaf_"+which+"_blotted"] = true;
  F.f_cloth_used = true;
  takeAway("it_blotter");
  sfx("cloth"); say("污斑淡去，紙上留一道極淡的痕。", false, 3000);
  saveDebounced(); render();
}
var PLACE = { a:"pafu", b:"baofu", c:"xinyi" };
function pickGarment(g){
  if(!F.f_cabinet_open){ openCabinet(); return; }
  var id = "it_garment_"+g;
  if(F["f_garment_"+g+"_placed"]) return;
  if(INV.indexOf(id)<0){ give(id); sfx("cloth"); }
  SEL = id; renderInv(); applyArmed(); bumpBreathe(id);
  say("取下一件 —— 掛到牆上對應的木簽下。", false, 2600);
  saveDebounced(); render();
}
function hangSelected(tag){
  if(!SEL || SEL.indexOf("it_garment_")!==0){
    say("簽下有一枚銅釘，空著。", false, 2200); return;
  }
  hang(SEL.slice(-1), tag);
}
function hang(g, tag){
  var want = PLACE[g];
  if(want === tag){
    F["f_garment_"+g+"_placed"] = true;
    takeAway("it_garment_"+g);
    var tg = $("#tag_"+tag);
    tg.classList.remove("tagshake"); void tg.offsetWidth; tg.classList.add("tagshake");
    sfx("cloth"); say("掛上了。簽上浮出一個極小的朱砂點。", false, 2600);
    if(F.f_garment_a_placed && F.f_garment_b_placed && F.f_garment_c_placed){
      F.f_chain2_done = true;
      say("心衣平攤圖的內襯接縫處，露出一角紙頭。", false, 4000);
    }
    saveDebounced(); render();
  } else {
    slideBack(g, tag);
    F.f_misplaced_count = (F.f_misplaced_count|0) + 1;
    sfx("cloth"); saveDebounced();
    // 语法：现场变化（衣物滑回柜中）+ 一句方位话
    say("衣物順著牆面滑回櫃中 —— 它不該掛這兒。", false, 3600);
    if((F.f_misplaced_count|0) >= 3) setTimeout(function(){
      var p = el("circle",{cx:760, cy:250, r:9, fill:"var(--zhu)", stroke:"none", opacity:".12"});
      var host = document.querySelector("#view-right .cab-inner"); if(host) host.appendChild(p);
    }, 700);
  }
}
function slideBack(g, tag){
  var host = document.querySelector("#view-right");
  var tagEl = document.getElementById("tag_"+tag);
  var target = document.getElementById("scene_g_"+g);
  if(!host || !tagEl || !target) return;
  var b = G[g].box;
  var tb, db;
  try{ tb = tagEl.getBBox(); db = target.getBBox(); }catch(e){ return; }
  if(!tb || !db || !tb.width) return;
  var use = el("use", { href:"#sym_g_"+g,
    x:(tb.x + tb.width/2 - b[2]/2).toFixed(1),
    y:(tb.y + tb.height/2 - b[3]/2).toFixed(1),
    width:b[2], height:b[3] });
  var node = el("g", { "class":"sliding" });
  node.appendChild(use);
  node.style.setProperty("--dx", ((db.x+db.width/2) - (tb.x+tb.width/2)).toFixed(1) + "px");
  node.style.setProperty("--dy", ((db.y+db.height/2) - (tb.y+tb.height/2)).toFixed(1) + "px");
  host.appendChild(node);
  setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); }, 640);
}
function checkChain3(){
  if(F.f_fig_slot_13 && F.f_fig_slot_15 && !F.f_chain3_done){
    F.f_chain3_done = true; F.f_secret_open = true;
    setTimeout(function(){
      F.f_secret_open = true; sfx("drawer"); render();
      say("尺標底座「嗒」一聲，彈開一條縫。", false, 3600);
    }, 620);
  }
}

/* ── 17. 事件绑定 ─────────────────────────────────────────── */
/* 判序（模板附录 A.5 坑 24）：热点 → 纸 → 台账 → 回主视图。
   **纸排在台账之前**：台账开着时点开《校勘记》，再点纸要能收掉 —— 旧判序是
   `if(LEDGER) return;` 先返回，真人只能按 Esc 才退得出那一页。
   `#paper-layer` 本就画在 `#ledger` 之后（纸确实在上面），所以判序与层序一致。 */
stage.addEventListener("click", function(e){
  var hs = e.target.closest ? e.target.closest(".hs") : null;
  if(hs && hs.dataset.hs && !hs.classList.contains("gone")){ onHotspot(hs.dataset.hs); return; }
  if(PAPER_OPEN){ closePaper(); return; }   /* 纸在台账之前 */
  if(LEDGER) return;                        /* 台账开着时不穿透到房间 */
  if(CAM !== "room") goRoom();
});
$("#bk").addEventListener("click", function(e){ e.stopPropagation(); showLedger(true); });
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    if(LEDGER){ showLedger(false); return; }
    if(PAPER_OPEN) closePaper(); else if(CAM!=="room") goRoom();
  }
  var k = (e.key||"").toLowerCase();
  if(k==="b") showLedger(!LEDGER);
  if(k==="1") setCam("room"); if(k==="2") setCam("desk");
  if(k==="3") setCam("shelf"); if(k==="4") setCam("right"); if(k==="5") setCam("scroll");
});

/* ── 18. 启动 ─────────────────────────────────────────────── */
function boot(){
  buildSymbols(); injectGarments(); buildTower();
  var restored = false;
  var AUTO = (location.hash.match(/auto=([a-z0-9]+)/i)||[])[1];
  var FRESH = /fresh/.test(location.hash);
  if(AUTO || FRESH){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} resetState(); }
  else restored = load();
  if(!restored) resetState();
  F.f_seen_room = true;
  render();
  setCam(CAM || "room");
  syncModal();          /* 起手 #ledger 就是 class="on"，这里必须主动挂 .modal（附录 A.4） */
  if(AUTO){ showLedger(true); renderLedger(); }
  /* 截图探针（仅 ?probe= 时生效，且强制先进台账）：把某个世界变化状态
     直接摆好并关掉台账，供无头浏览器在首帧就拍到目标画面。
     只摆 flags 与相机，不跳过任何交互分支（自动走通仍走 runAuto） */
  var PROBE = (location.search.match(/[?&]probe=([a-z0-9]+)/i)||[])[1];
  /* 截图用 ?still=1：把 CSS 过渡时长归零，让「世界变化」在首帧就停在终点。
     只影响动画时长（呈现层），不碰任何 flag 与交互逻辑 */
  if(/[?&]still=1/.test(location.search)){
    var st = document.createElement("style");
    st.textContent = "*{transition-duration:0s!important;animation-delay:0s!important}";
    document.head.appendChild(st);
  }
  function showRoom(){ showLedger(false); F.f_seen_room = true; setCam("room"); render(); }
  if(PROBE){
    if(PROBE === "room"){ showRoom(); }
    else if(PROBE === "desk"){ showRoom(); setCam("desk"); }
    else if(PROBE === "shelf"){ showRoom(); setCam("shelf"); }
    else if(PROBE === "scroll"){ showRoom(); setCam("scroll"); }
    else if(PROBE === "right"){ showRoom(); setCam("right"); F.f_cabinet_open = true; render(); }
    else if(PROBE === "drawer"){
      F.f_leaf_jia_sealed = F.f_leaf_yi_sealed = true;
      F.f_chain1_done = F.f_drawer_open = true;
      showRoom();
    }
    else if(PROBE === "cabinet"){ F.f_cabinet_open = true; showRoom(); setCam("right"); }
    else if(PROBE === "secret"){
      F.f_fig_slot_13 = F.f_fig_slot_15 = F.f_chain3_done = F.f_secret_open = true;
      F.f_fig_slot_13_active13 = F.f_fig_slot_15_active15 = true;
      showRoom(); setCam("scroll");
    }
    else if(PROBE === "end"){
      F.f_leaf_jia_sealed = F.f_leaf_yi_sealed = true;
      F.f_chain1_done = F.f_drawer_open = true;
      F.f_plaque13_taken = F.f_plaque15_taken = true;
      F.f_cabinet_open = true; F.f_chain2_done = true; F.f_slip2_taken = true;
      F.f_garment_a_placed = F.f_garment_b_placed = F.f_garment_c_placed = true;
      F.f_fig_slot_13 = F.f_fig_slot_15 = F.f_fig_slot_1000 = true;
      F.f_fig_slot_13_active13 = F.f_fig_slot_15_active15 = true;
      F.f_chain3_done = F.f_secret_open = F.f_vol10_taken = F.f_act1_done = true;
      F.f_desk_dots = 2;
      showRoom();
    }
  }
  requestAnimationFrame(function(){
    $("#boot").classList.add("gone");
    world.classList.add("intro");
    setTimeout(function(){ world.classList.remove("intro"); }, 3200);
  });
  pokeIdle();
  if(AUTO) runAuto(AUTO);
  else if(restored) say("接著上次的地方。", false, 2400);
}
/* ── 19. 旧自测入口（**只作脚本自检，不是命中证据**）────────────
   下面 `click()` 走的是 `hit.dispatchEvent(new MouseEvent("click"))`：事件被
   直接递给调用者已经选好的元素，**完全绕开浏览器的命中判定**，所以它能报
   「全过」而真人点不动（模板附录 A.5 坑 21）。保留它是为了不破坏既有 `#auto=`
   的留痕，**验收一律以 `_selftest\_fix1\walk1.js`（CDP 真鼠标在视口坐标上点）为准**。 */
function click(hsId){
  var n = document.querySelector('.hs[data-hs="'+hsId+'"]');
  if(!n) return false;
  var hit = n.querySelector(".hit") || n;
  hit.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function w(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function slotOf(itemId){
  var i = INV.indexOf(itemId); if(i<0) return null;
  return document.querySelector('.slot[data-slot="'+i+'"]');
}
function pickSlot(itemId){
  var s = slotOf(itemId); if(!s) return false;
  s.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return SEL === itemId;
}
/* 完整主路径，全部用真实 click 事件走一遍（不是直接改 flags） */
async function runAuto(stop){
  var log = [];
  function step(name, ok){ log.push(name + "=" + (ok ? "ok" : "MISS")); }
  function report(){
    document.title = "SELFTEST::" + log.join(" | ")
      + " || FLAGS[" + FLAG_KEYS.filter(function(k){ return F[k]; }).join(",") + "]"
      + " || blot=" + F.f_blot_count + " misplaced=" + F.f_misplaced_count
      + " || INV[" + INV.join(",") + "] || CAM=" + CAM
      + " || READ[" + READ.join(",") + "]";
    document.body.setAttribute("data-selftest", log.join(" | "));
  }
  try{
    if(stop === "ledger"){ step("停在值房台賬", LEDGER); report(); return; }
    if(stop === "room"){ step("推門入閣", click("h_ledger_enter")); await w(300); report(); return; }
    step("0_自台账入閣", click("h_ledger_enter")); await w(420);
    // ── 链① 校勘 · 荼与茶 ────────────────────────────────
    step("1_進案頭", click("h_desk")); await w(420);
    step("2_讀殘頁甲", click("h_leaf_jia")); await w(300);
    if(stop === "paperjia"){ step("停在殘頁甲", !!PAPER_OPEN); report(); return; }
    closePaper(); await w(150);
    step("3_讀殘頁乙", click("h_leaf_yi")); await w(300); closePaper(); await w(150);
    goRoom(); await w(150);
    step("4_讀體例紙條", click("h_rule")); await w(300); closePaper(); await w(150);
    step("5_進書架", click("h_shelf")); await w(380);
    step("6_讀爾雅釋木", click("h_tag_erya")); await w(280); closePaper(); await w(120);
    step("7_讀爾雅注疏", click("h_tag_zhushu")); await w(280); closePaper(); await w(120);
    step("8_讀釋名卷五", click("h_tag_shiming")); await w(280); closePaper(); await w(120);
    step("9_支線S1讀世說", click("h_tag_shishuo")); await w(280); closePaper(); await w(120);
    step("10_支線S2取舊拓", click("h_box")); await w(200);
    goRoom(); await w(150);
    step("11_回案頭", click("h_desk")); await w(380);
    step("12_取校印", click("h_seal_jiao")); await w(150);
    step("13_選中校印", pickSlot("it_seal_jiao")); await w(150);
    step("14_甲頁落校印", click("h_leaf_jia")); await w(320);
    SEL = null; applyArmed(); render(); await w(120);
    step("15_取異印", click("h_seal_yi")); await w(150);
    step("16_選中異印", pickSlot("it_seal_yi")); await w(150);
    step("17_乙頁落異印", click("h_leaf_yi")); await w(320);
    SEL = null; applyArmed(); render(); await w(1100);
    step("18_鏈①通_抽屜開", F.f_drawer_open);
    if(stop === "drawer"){ report(); return; }
    step("19_取木牌十三", click("h_plaque13")); await w(200);
    step("20_取木牌十五", click("h_plaque15")); await w(200);
    goRoom(); await w(200);

    // ── 链② 名物归位 ────────────────────────────────────
    step("21_開高櫃", click("h_cabinet")); await w(1200);
    if(stop === "cabinet"){ step("停在櫃內近景", F.f_cabinet_open); report(); return; }
    var seq = [["c","h_tag_xinyi"],["a","h_tag_pafu"],["b","h_tag_baofu"]];
    for(var i=0;i<seq.length;i++){
      var g = seq[i][0], tag = seq[i][1];
      step("22_取衣物"+g, click("h_garment_"+g)); await w(180);
      step("23_掛"+g, click(tag)); await w(500);
    }
    await w(600);
    step("24_鏈②通_內襯殘紙現", F.f_chain2_done);
    step("25_取內襯殘紙", click("h_lining_slip")); await w(420); closePaper(); await w(150);
    goRoom(); await w(200);

    // ── 链③ 卷内矛盾 ────────────────────────────────────
    step("26_進營造圖", click("h_scroll")); await w(380);
    step("27_選十三重", pickSlot("it_plaque_13")); await w(150);
    step("28_嵌十三重", click("h_slot_layers")); await w(1000);
    step("29_驗第一說", F.f_fig_slot_13);
    if(stop === "fig13"){ /* 停在第一说 */ }
    else{
      step("30_取下木牌", click("h_slot_layers")); await w(320);
      step("31_選十五重", pickSlot("it_plaque_15")); await w(150);
      step("32_嵌十五重", click("h_slot_layers")); await w(1000);
      step("33_驗第二說", F.f_fig_slot_15);
      await w(600);
      step("34_暗格彈開", F.f_secret_open);
      if(stop === "secret"){ report(); return; }
      step("35_取第十卷", click("h_secret")); await w(600);
      step("36_一幕收束", F.f_act1_done);
      if(stop === "vol10"){ report(); return; }
      // 收束：回台账 → 取阅《校勘记》
      step("36b_回台账", (function(){ showLedger(true); renderLedger(); return LEDGER; })()); await w(300);
      step("36c_校勘記", (function(){ click("h_ledger_notes"); return PAPER_OPEN === "__notes"; })()); await w(400);
      if(stop === "notes"){ report(); return; }
      closePaper(); await w(200);
      step("36d_再入閣", click("h_ledger_enter")); await w(300);
      step("36e_進營造圖", click("h_scroll")); await w(320);
      // 支線 S2：卷一舊拓試擺一千尺
      step("37_選舊拓", pickSlot("it_rubbing")); await w(150);
      step("38_試擺一千尺", click("h_scroll_fig")); await w(1000);
      step("39_第三說已驗", F.f_fig_slot_1000);
    }
  }catch(err){ log.push("ERR=" + (err && err.message)); }
  report();
}

window.__dd = { F:function(){return F;}, INV:function(){return INV;},
  CAM:function(){return CAM;}, click:click, setCam:setCam, state:function(){ return {F:F,INV:INV,CAM:CAM,SEL:SEL}; } };

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
})();
</script>
