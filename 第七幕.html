<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>典藏司 · 抄書齋 · 第七幕</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" href="favicon.ico">
<link rel="icon" href="favicon.ico">
<link rel="icon" href="favicon.ico">
<style>
  /* ══ 色板：与第一–六幕、第八幕逐字相同 —— 9 个 token + 既有平涂旧木 #b9a88c，不新增颜色 ══ */
  :root{
    --paper:#f3ecdf; --paper2:#eae1d0; --card:#faf6ec;
    --ink:#2a2622; --ink2:#5c554b; --faint:#8d8577;
    --zhu:#a63a2a; --line:#d3c8b4; --line2:#c0b49d;
    --l1:2.2px; --l2:1.4px; --l3:0.9px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Songti SC","STSong",Georgia,"Noto Serif SC",serif;
    display:flex; align-items:center; justify-content:center; padding:8px;
  }
  /* 三上界：不超容器、不超 1200 设计宽、**高度**不超（(100vh − 88px) × 1200/720）。
     只按宽度做的旧版在 1214×650 上会把上下两头切掉（修前实测 stage.top = −60，且有竖向滚动条）。*/
  #app{width:min(100%,1200px,calc((100vh - 88px) * 1.66667));min-height:0;display:flex;flex-direction:column}
  #stage{display:block;width:100%;height:auto;aspect-ratio:1200/720;background:var(--paper);overflow:hidden}
  #hud{flex:0 0 64px;height:64px;display:flex;align-items:center;gap:14px;
       background:var(--paper);border-top:1px solid var(--line2);padding:0 6px}
  #slots{display:flex;gap:4px}
  .slot{width:56px;height:56px;border:1px solid transparent;position:relative;cursor:default}
  .slot .under{position:absolute;left:8px;right:8px;bottom:6px;height:1px;background:var(--line2)}
  .slot svg{display:block;width:52px;height:52px;margin:1px;transition:transform 120ms ease}
  .slot.has{cursor:pointer}
  .slot.sel{border-color:var(--zhu)}
  .slot.sel svg{transform:translateY(-2px)}
  #caption{margin-left:auto;margin-right:8px;max-width:62%;
           font-family:"Kaiti SC","STKaiti","KaiTi",serif;
           font-size:13px;line-height:1.6;color:var(--ink2);text-align:right;
           opacity:0;transition:opacity 500ms ease}
  #caption.on{opacity:1}
  #caption.zhu{color:var(--zhu)}

  /* ══ 线宽三级（与前几幕同值；vector-effect 保证跨视图/跨缩放不漂移）══ */
  .l1{stroke:var(--ink);stroke-width:var(--l1);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l2{stroke:var(--ink2);stroke-width:var(--l2);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l3{stroke:var(--faint);stroke-width:var(--l3);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .miter{stroke-linejoin:miter}
  .f-wood{fill:#b9a88c}
  .f-card{fill:var(--card)}
  .f-zhu{fill:var(--zhu)}
  .tx{fill:var(--ink);font-family:"Songti SC","STSong",Georgia,serif}
  .tx-k{fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .tx-z{fill:var(--zhu);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .shadow{fill:var(--ink);opacity:.08;stroke:none;pointer-events:none}

  /* ══ 视图切换（本幕 2 个视图：抄書齋全景 + 對攤近景；台账与过渡页是覆盖层）══ */
  .view{opacity:0;pointer-events:none;transition:opacity 500ms ease}
  .view.active{opacity:1;pointer-events:auto}

  /* ══ 命中（修正）：非活動層的整棵子樹都不接鼠標 ═══════════════════════════
     病灶不在「層」，在「層裏那些透明 .hit」：`.hs .hit{pointer-events:all}` 是**顯式值**，
     壓得過祖先 `.view{pointer-events:none}` 的繼承；而 `opacity:0` 的元素**照樣參與命中測試**。
     於是收起的 #ledger、關掉的 #bridge、沒進去的 #view-room 裏那些看不見的矩形，
     仍在**文檔順序更後**的位置接得住鼠標 —— 點這一件，被那一件截胡。
     下面五行按「層狀態」把整棵子樹釘死；**不動任何一條 .hit 的既有寫法**，
     `#auto` 自檢仍走同一條路。 */
  .view:not(.active), .view:not(.active) *{pointer-events:none!important}
  #ledger:not(.on), #ledger:not(.on) *{pointer-events:none!important}
  #bridge:not(.on), #bridge:not(.on) *{pointer-events:none!important}
  .paper:not(.show), .paper:not(.show) *{pointer-events:none!important}
  #world.modal .view, #world.modal .view *{pointer-events:none!important}
  #paper-layer{pointer-events:none}
  #paper-layer .paper.show{pointer-events:auto}
  /* 兩部書的正文是**景**（畫出來的字），不是熱點自己的記號：
     它畫在 .hit 之後，若照舊接鼠標，就會把底下那個熱點的整個中心點啃掉
     （修前 `h_src` / `c1`..`c4` 五個熱點的中心點全落在 `text.tx-k` 上）。 */
  #type-src, #type-copy{pointer-events:none}

  /* ══ 热点：默认 / 可点 / 已取 三态光标 ══ */
  .hs{cursor:default}
  .hs .hit{fill:transparent;stroke:none;pointer-events:all}
  .hs .art{pointer-events:none}
  .hs.on .hit{cursor:pointer}
  .hs.on:hover .art path,.hs.on:hover .art rect,.hs.on:hover .art circle,
  .hs.on:hover .art ellipse,.hs.on:hover .art line,.hs.on:hover .art polygon{stroke:var(--zhu);stroke-width:3}
  .hs.armed .art path,.hs.armed .art rect,.hs.armed .art circle,
  .hs.armed .art ellipse,.hs.armed .art line,.hs.armed .art polygon{stroke:var(--zhu);stroke-width:3}
  .hs.on:hover .art text,.hs.armed .art text{fill:var(--zhu)}
  .hs.gone, .hs.gone *{pointer-events:none}
  .hs.gone .art{opacity:0}
  .hs.breathe .art *{stroke:var(--zhu)!important;animation:breathe 1.2s ease-in-out 2}
  @keyframes breathe{0%,100%{stroke-opacity:1}50%{stroke-opacity:.4}}

  /* ══ 视角规格（§十二）：屏幕坐标 = 正面坐标 + 深度·(0,−0.5)，k = 0.5 ══
     本幕深度预算：書齋地面随画面裁切 / 書架層板進深 40（帶高 20）/
     抄書案台面進深 80（帶高 40，＝本幕上限）/ 書函頂面進深 24（帶高 12）/
     攤開的兩部書頁、四张異牌、墨碟、筆、三格籤槽進深 0（**竖直面**）。**全部 ≤ 80。** */
  .floor{fill:var(--paper2);stroke:none}
  .slab{fill:var(--card)}
  .recess{fill:var(--paper2);stroke:none}

  /* ══ 世界变化 ① 朱筆圈点：抄件上的一圈（手绘椭圆，不是规规矩矩的正圆）══ */
  .cir{opacity:0;transition:opacity 320ms ease}
  .cir.on{opacity:1}
  /* ══ 世界变化 ② 源書頁邊的朱點（只标「此处有一处異文」，不言何类）══ */
  .dot{opacity:0;transition:opacity 320ms ease}
  .dot.on{opacity:1}
  /* ══ 異文序号（圈与點的对应凭据）：**圈/點落下去之后才显形** ══
     它只在「这一圈对那一點」这件事需要被读的时候才该出现；未圈之前，
     画面上不该有成排的编号（附錄 A.3 ①「要留就做成翻看时才显示的隐藏层」）。
     **不删字**（序号仍是两边的唯一对应凭据），只把它藏到该出现的时候。 */
  .seq{opacity:0;transition:opacity 320ms ease}
  .seq.on{opacity:1}
  /* ══ 世界变化 ③ 異牌落格之後，格裡現出這一類有幾处 ══ */
  .cnt{opacity:0;transition:opacity 300ms ease}
  .cnt.on{opacity:1}
  /* ══ 世界变化 ④ 校勘記成：案上現一条朱線 ══ */
  #doneline{opacity:0;transition:opacity 420ms ease}
  #doneline.on{opacity:1}
  /* ══ 錯法：沿槽邊彈回 / 順紙邊滑落（現場變化，東西不消失、可立即重放）══ */
  @keyframes shake{0%,100%{transform:translateX(0)}35%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
  .shaking{animation:shake 130ms ease-in-out 2}
  @keyframes fall{0%{opacity:1}100%{opacity:0}}
  .card-ghost{opacity:0}
  .card-ghost.fall{animation:fall 520ms ease-in forwards}
  /* ══ 錯法累到三次：案上留一塊 12% 朱砂指印（不是新色）══ */
  #print{opacity:0;transition:opacity 300ms ease}
  #print.show{opacity:1}
  /* ══ 拿在手上的東西離位微抬 ══ */
  .lift .art{opacity:.72}

  /* ══ 纸（在場景內放大展開，不切屏、不加暗底遮罩）══ */
  .paper{opacity:0;pointer-events:none;transition:opacity 260ms ease}
  .paper.show{opacity:1;pointer-events:auto}
  .paper-title{font-size:21px;fill:var(--ink);letter-spacing:.18em}
  .paper-sub{font-size:12.5px;fill:var(--faint);letter-spacing:.1em}
  .paper-body{font-size:16px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.02em}
  .paper-body .key{font-size:18px}
  .paper-close{font-size:12px;fill:var(--faint);letter-spacing:.08em}

  /* ══ 外殼：典藏司「值房台账」（与前几幕同一套）══ */
  #ledger{opacity:0;pointer-events:none;transition:opacity 420ms ease}
  #ledger.on{opacity:1;pointer-events:auto}
  .led-lede{font-size:26px;fill:var(--ink);letter-spacing:.22em}
  .led-sub{font-size:13px;fill:var(--faint);letter-spacing:.12em}
  .led-item{font-size:19px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.04em}
  .led-item.done{fill:var(--faint)}
  .led-act{font-size:21px;fill:var(--ink);letter-spacing:.2em}
  .led-hint{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  #bridge{opacity:0;pointer-events:none;transition:opacity 380ms ease}
  #bridge.on{opacity:1;pointer-events:auto}
  .br-lede{font-size:22px;fill:var(--ink);letter-spacing:.2em}
  .br-body{font-size:16px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .br-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}

  #boot{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;
        justify-content:center;font-size:15px;color:var(--ink2);letter-spacing:.3em;z-index:9}
  #boot.gone{display:none}

  /* v0.20.13 手机端可读性：1200x720 舞台等比缩放后字太小，竖屏时给一条提示（不改玩法） */
  @media (max-width: 760px) and (orientation: portrait) {
    body::before {
      content: "建议横屏或使用电脑游玩，字体更清晰";
      position: fixed; left: 0; right: 0; top: 0; z-index: 9999;
      padding: 6px 8px; text-align: center;
      background: #a63a2a; color: #f3ecdf; font-size: 12px; letter-spacing: .04em;
    }
    body { padding-top: 26px; }
  }
</style>
<script src="_selftest/live.js" defer></script>
</head>
<body>

<div id="boot">抄書齋</div>

<div id="app">
  <svg id="stage" viewBox="0 0 1200 720" shape-rendering="geometricPrecision"
       xmlns="http://www.w3.org/2000/svg" role="application" aria-label="典藏司抄書齋 第七幕">
    <defs>
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
      </filter>
    </defs>
    <rect x="0" y="0" width="1200" height="720" fill="var(--paper)"/>
    <g id="world">

      <!-- ══════════════════ view-room：抄書齋（全景）══════════════════
           同一台虚拟相机、同一斜率 k=0.5（§十二）。进深预算全部 ≤ 80（见样式表注释）。
           本幕不判「哪一个字对」，只管「哪一处是增、哪一处是改、哪一处是删」——
           逐字異文第一幕已经列过；这一幕把它变成**分类圈点**。 -->
      <g id="view-room" class="view active">

        <!-- ① 書齋地面（水平面）：远边在墙脚 y≈580，近边落在画面之外 -->
        <path class="floor" d="M40,580.4 C300,578.6 700,581.2 1160,579.6 L1160,726 L40,726 Z"/>
        <path class="l3 miter" d="M150,652 C400,650.6 800,653 1090,650.8"/>
        <path class="l2" d="M40,580.6 C300,578.8 700,581.4 1160,579.8"/>

        <!-- A 書架（兩部書就攤在架下的抄書案上；架只做背景）-->
        <g class="scenery" pointer-events="none">
          <path class="l1 f-wood" d="M40,56.4 C400,54.6 800,57.2 1160,55.6 L1160,72.4
            C800,74.2 400,71.6 40,73.4 Z"/>
          <path class="l1 f-wood" d="M96,72.4 C300,70.6 500,73.2 700,71.6 L700,420.4
            C500,422.2 300,419.6 96,421.4 Z"/>
          <path class="l1 miter slab" d="M96,168.4 C300,166.6 500,169.2 700,167.6 L700,188.4
            C500,190.2 300,187.6 96,189.4 Z"/>
          <path class="l1 miter slab" d="M96,296.4 C300,294.6 500,297.2 700,295.6 L700,316.4
            C500,318.2 300,315.6 96,317.4 Z"/>
          <path class="l3 miter" d="M120,108 L676,108 M120,132 L600,132 M120,232 L664,232
            M120,256 L580,256 M120,360 L640,360 M120,384 L556,384"/>
        </g>

        <!-- B 架前：「抄書齋體例」一纸（翻書可查；本幕自撰，非古籍引文）-->
        <g id="hs_rule" class="hs on" data-hs="h_rule">
          <rect class="hit" x="724" y="96" width="196" height="160"/>
          <g class="art">
            <path class="l1 f-card" d="M732,104.4 C786,102.6 858,105.2 910,103.6 L911,254.4
              C858,256.2 786,253.6 732,255.4 Z"/>
            <text class="tx-k" x="821" y="132" font-size="14" text-anchor="middle">抄書齋體例</text>
            <path class="l3 miter" d="M748,158 L894,158 M748,184 L868,184 M748,210 L882,210 M748,236 L860,236"/>
          </g>
        </g>

        <!-- C 架前：「校勘之例」一纸（承第三幕的「對照」、第六幕的「並置」）-->
        <g id="hs_rule2" class="hs on" data-hs="h_rule2">
          <rect class="hit" x="944" y="96" width="196" height="160"/>
          <g class="art">
            <path class="l1 f-card" d="M952,104.4 C1006,102.6 1078,105.2 1130,103.6 L1131,254.4
              C1078,256.2 1006,253.6 952,255.4 Z"/>
            <text class="tx-k" x="1041" y="132" font-size="14" text-anchor="middle">校勘之例</text>
            <path class="l3 miter" d="M968,158 L1114,158 M968,184 L1088,184 M968,210 L1102,210 M968,236 L1080,236"/>
          </g>
        </g>

        <!-- D 抄書案（台面進深 80 → 帶高 40）：兩部書就攤在案上 -->
        <g class="scenery" pointer-events="none">
          <path class="l1 miter slab" d="M60,432.4 C400,430.6 800,433.2 1140,431.6 L1140,472.4
            C800,474.2 400,471.6 60,473.4 Z"/>
          <path class="l3 miter" d="M100,450 C400,448.4 800,451 1100,449.4"/>
          <path class="l1 f-card" d="M60,472.4 C400,470.6 800,473.2 1140,471.6 L1140,712.4
            C800,714.2 400,711.6 60,713.4 Z"/>
          <path class="l1 f-wood" d="M84,712.4 C200,710.6 300,713.2 372,711.6 L372,720.4
            C300,722.2 200,719.6 84,721.4 Z"/>
          <path class="l1 f-wood" d="M828,712.4 C900,710.6 1000,713.2 1116,711.6 L1116,720.4
            C1000,722.2 900,719.6 828,721.4 Z"/>
        </g>

        <!-- E 走近抄書案（進近景；熱區與案上諸物都不相鄰）-->
        <g id="hs_go" class="hs on" data-hs="h_go">
          <rect class="hit" x="470" y="612" width="260" height="56"/>
          <g class="art">
            <path class="l1 miter" d="M480,618 C560,616.4 640,619 720,617.4 L720,662
              C640,663.6 560,661 480,662.6 Z"/>
          </g>
          <text class="led-act" x="600" y="650" text-anchor="middle" font-size="17">走 近 抄 書 案</text>
        </g>

        <!-- F 案上的物：兩部書的書函（只是背景，真正摊开的書頁在近景）-->
        <g class="scenery" pointer-events="none">
          <path class="l1 f-wood" d="M150,376.4 C240,374.6 340,377.2 420,375.6 L420,428.4
            C340,430.2 240,427.6 150,429.4 Z"/>
          <path class="l3 miter" d="M180,392 L392,392 M180,410 L360,410"/>
          <path class="l1 f-wood" d="M520,376.4 C610,374.6 710,377.2 790,375.6 L790,428.4
            C710,430.2 610,427.6 520,429.4 Z"/>
          <path class="l3 miter" d="M550,392 L762,392 M550,410 L730,410"/>
          <text class="tx-k" x="285" y="366" font-size="13" text-anchor="middle" fill="var(--ink2)">世説新語</text>
          <text class="tx-k" x="655" y="366" font-size="13" text-anchor="middle" fill="var(--ink2)">茶經 · 抄件</text>
        </g>

        <!-- G 錯法累到三次：案上留一塊 12% 朱砂指印（不是新色）-->
        <g id="print" pointer-events="none">
          <ellipse cx="1052" cy="640" rx="16" ry="21" fill="var(--zhu)" opacity=".12"/>
          <ellipse cx="1070" cy="648" rx="10" ry="14" fill="var(--zhu)" opacity=".12"/>
        </g>

        <!-- 案沿的接觸影（唯一一层阴影：贴底 8% 墨、无方向性、每处一层）-->
        <rect class="shadow" x="66" y="708" width="1068" height="8" rx="3"/>
      </g>

      <!-- ══════════════════ view-close：對攤近景（本幕的主要交互）══════════════════
           左＝源書（《世説新語 · 紕漏》，即引文之所出）；
           右＝抄件（《茶經 · 七之事》所引《世説》那一句）。
           两边的字形**都摊在案上、逐字可读** —— 要圈的是**哪一处異、屬哪一类**。 -->
      <g id="view-close" class="view">

        <!-- 案面远边（進深 80 → 帶高 40）与案前 -->
        <path class="l1 miter slab" d="M40,16.4 C400,14.6 800,17.2 1160,15.6 L1160,56.4
          C800,58.2 400,55.6 40,57.4 Z"/>
        <path class="l3 miter" d="M80,36 C400,34.4 800,37 1120,35.4"/>
        <path class="l1 f-card" d="M40,56.4 C400,54.6 800,57.2 1160,55.6 L1160,700.4
          C800,702.2 400,699.6 40,701.4 Z"/>

        <!-- A 源書（左）：《世説新語 · 紕漏第三十四》。版框 x 52..548，中缝 x 300。
             版心 x0=80、字距 15、字号 14；行高 22，首行基线 y=150；每行 11 字。 -->
        <g id="book-src" class="scenery" pointer-events="none">
          <rect class="shadow" x="46" y="86" width="510" height="9" rx="3"/>
          <path class="l1 f-card" d="M52,80.4 C170,78.6 430,81.2 546,79.6 L548,618.4
            C430,620.2 170,617.6 52,619.4 Z"/>
          <path class="l2 miter" d="M300,80.4 C300.6,260 299.4,440 300,618.4"/>
          <path class="l1 miter" d="M66,100 C180,98.4 420,101 538,99.4"/>
        </g>
        <g id="hs_src" class="hs on" data-hs="h_src">
          <rect class="hit" x="62" y="352" width="234" height="220"/>
          <g class="art"><path class="l3 miter" d="M80,368 L292,368 M80,390 L292,390"/></g>
        </g>

<script>
"use strict";
(function(){

/* ══ 0. 存档：与第一–六幕、第八幕同一把钥匙、同一结构（幕间协议 §1.3）════════
   本幕（第七幕）写：act=7，往 done 追加 "act7"，《校勘记》追加本幕条目。
   **只加不改**：不改键名、不改任何既有字段的语义、不写迁移脚本。
   **本幕只往 inv 里放「本幕自己给得出的东西」**（朱筆 / 四张異牌），
   不假设「玩家还持有上一幕的物件」。 */
var SAVE_KEY = "diandangsi.rustylake.v1";
var NOTES_KEY = "diandangsi.rustylake.v1.notes";
var ACT_NO = 7, ACT_ID = "act7";

/* ══ 1. 上一幕交下来的东西（跨幕累积的读入侧）════════════════════════
   读不到就是 null —— **照实说「沒讀到」，不假装办过**（协议 §1.3.3）。 */
var PREV = (function(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    var o = JSON.parse(raw);
    if(!o || !o.f) return null;
    return o;
  }catch(e){ return null; }
})();
function prevHas(k){ return !!(PREV && PREV.f && PREV.f[k]); }
function prevRead(k){ return !!(PREV && PREV.read && PREV.read.indexOf(k) >= 0); }
function prevDone(id){ return !!(PREV && PREV.done && PREV.done.indexOf && PREV.done.indexOf(id) >= 0); }

/* ══ 2. flags ═══════════════════════════════════════════════════════ */
var FLAG_KEYS = [
  "f_seen_act7","f_bridge_read","f_rule_read","f_rule2_read",
  "f_src_read","f_copy_read",
  "f_brush_taken","f_ink_taken",
  "f_mark_1","f_mark_2","f_mark_3","f_mark_4",
  "f_card_zeng_taken","f_card_gai_taken","f_card_shan_taken","f_card_cun_taken",
  "f_up_zeng","f_up_gai","f_up_shan",
  "f_marks_done","f_typed","f_filed","f_act7_done"
];
var F = {}, INV = [], READ = [], SEL = null, CAM = "close";
/* 墨碟（朱砂）在手否；筆在手否；四张異牌各在何处（0=在手边 / 1..3=已落格）
   三格：1=增字格 / 2=改字格 / 3=刪字格；存牌只有 0 / 4(=存案槽) */
var INKDISH = false, BRUSH = false;
var CARD = { zeng:0, gai:0, shan:0, cun:0 };
/* 四处異文，每处兩点（抄件一字位 + 源書同字位）；点过的记在 CIR 里 */
var CIR = { 1:false, 2:false, 3:false, 4:false };

function resetState(){
  F = {}; FLAG_KEYS.forEach(function(k){ F[k]=false; });
  F.f_misplaced_count = 0;      /* 与第一–六幕、第八幕同名同义：错的次数 */
  INV = []; READ = []; SEL = null; CAM = "close";
  INKDISH = false; BRUSH = false;
  CARD = { zeng:0, gai:0, shan:0, cun:0 };
  CIR = { 1:false, 2:false, 3:false, 4:false };
}

/* ══ 3. 存读档（幕间协议 §1.3：只加字段，不改字段语义，不改键名）══════ */
var saveT = null;
var DONE = (PREV && PREV.done && PREV.done.slice) ? PREV.done.slice() : [];
var NOTE_LOG = (PREV && PREV.notes && PREV.notes.slice) ? PREV.notes.slice() : [];
function markActDone(){
  if(F.f_act7_done && DONE.indexOf(ACT_ID) < 0) DONE.push(ACT_ID);
}
function appendNotes(){
  var es = noteEntries();
  for(var i=0;i<es.length;i++){
    var key = ACT_NO + "|" + es[i].h;
    var has = false;
    for(var j=0;j<NOTE_LOG.length;j++){ if(NOTE_LOG[j].key === key){ has = true; break; } }
    if(!has) NOTE_LOG.push({ key:key, act:ACT_NO, h:es[i].h, l:es[i].l });
  }
}
function saveNow(){
  try{
    markActDone(); appendNotes();
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      f:F, inv:INV, read:READ, cam:CAM, ts:Date.now(),
      act:ACT_NO, done:DONE, notes:NOTE_LOG
    }));
  }catch(e){}
}
function saveDebounced(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 300); }
function load(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    var o = JSON.parse(raw);
    if(!o || !o.f) return false;
    FLAG_KEYS.forEach(function(k){ if(k in o.f) F[k]=o.f[k]; });
    if(typeof o.f.f_misplaced_count === "number") F.f_misplaced_count = o.f.f_misplaced_count;
    INV = o.inv || []; READ = o.read || []; CAM = o.cam || "close";
    BRUSH = INV.indexOf("it_brush") >= 0;
    INKDISH = INV.indexOf("it_inkdish") >= 0;
    CARD = { zeng:(F.f_up_zeng?1:0), gai:(F.f_up_gai?2:0), shan:(F.f_up_shan?3:0), cun:(F.f_filed?4:0) };
    CIR = { 1:!!F.f_mark_1, 2:!!F.f_mark_2, 3:!!F.f_mark_3, 4:!!F.f_mark_4 };
    return true;
  }catch(e){ return false; }
}

/* ══ 4. DOM ═════════════════════════════════════════════════════════ */
var $ = function(s){ return document.querySelector(s); };
var stage = $("#stage"), world = $("#world"), paperLayer = $("#paper-layer");
var caption = $("#caption"), slotsEl = $("#slots");
function el(tag, attrs){ var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if(attrs) for(var k in attrs) n.setAttribute(k, attrs[k]); return n; }
function txt(cls, x, y, s, extra){

  if(extra) for(var k in extra) t.setAttribute(k, extra[k]);

/* ══ 6. 兩部書的逐字排版（同一套坐标规则；兩边的字**都不加大、不变色、不加粗**）
   —— 異文只由**朱圈的位置**指出，不由字号或颜色指出（协议 §3.4 第 2 条）。 */
var SRC_X0 = 80,  SRC_CW = 15, SRC_LH = 22, SRC_FS = 14;   /* 源書左頁（版心 11 字/行） */
var CPY_X0 = 720, CPY_CW = 16, CPY_LH = 32, CPY_FS = 14;   /* 抄件左頁（版心 11 字/行；x=720 起，右端 x≈908 仍在版框 1148 内）*/
/* 兩部書的正文（逐字，繁体底本原字形）—— 与实现说明 §19.9 的引文溯源表逐条对应 */
var SRC_ROWS = [
  "任育長年少時，甚有",
  "令名。武帝崩，選百",
  "二十挽郎，一時之秀",
  "彦，育長亦在其中。",
  "王安豐選女壻，從挽",
  "郎搜其勝者，且擇取",
  "四人，任猶在其中。",
  "童少時，神明可愛，",
  "時人謂育長影亦好。",
  "自過江，便失志。王"
];
var SRC_ROWS2 = [
  "丞相請先度時賢共",
  "至石頭迎之，猶作疇",
  "日相待，一見便覺有",
  "異。坐席竟，下飲，",
  "便問人云：「此爲茶，",
  "爲茗？」覺有異色，",
  "乃自申明云：「向問",
  "飲爲𤍠、爲冷耳。」",
  "嘗行從棺邸下度，流",
  "涕悲哀。王丞相聞之"
];
var CPY_ROWS = [
  "《世説》：「任瞻字",
  "育長，少時有令名，",
  "自過江失志。既下飲，",
  "問人云：『此爲茶？"
];
var CPY_ROWS2 = [
  "爲茗？』覺人有恠色，",
  "乃自分明云：『向問",
  "飲爲熱爲冷？』」"
];
var TYPESET = {};   /* key -> [{x,y,ch}] 的字位表（同一个字位，兩边对得上） */
var MARK_MISS = [];  /* 定位失败的字位（正常应为空；探针会把它报出来） */
function typeset(host, key, rows, spec){
  var pos = [];
  for(var i=0;i<rows.length;i++){
    /* 逐**字**排版，不逐 UTF-16 码元：源書「爲𤍠」的「𤍠」是 Basic-Multilingual-Plane
       之外的字（两个码元），按 row[j] 走会把这个字劈成两半 —— 用 Array.from 取字。 */
    var chars = Array.from(rows[i] || ""), linePos = [];
    var y = spec.y0 + i*spec.lh;
    for(var j=0;j<chars.length;j++){
      var x = spec.x0 + j*spec.cw;
      host.appendChild(txt("tx-k", x, y, chars[j], { "font-size":spec.fs }));
      linePos.push({ x:x, y:y, ch:chars[j] });
    }
    pos.push(linePos);
  }
  TYPESET[key] = pos;
  return pos;
}
function charAt(key, r, c){
  var pos = TYPESET[key] || [];
  if(!pos[r] || !pos[r][c]) return null;
  return pos[r][c];
}
/* 手绘椭圆：**不是**规规矩矩的正圆（外角圆、内角不圆那条规矩管的是构件不是圈画；
   这里是朱筆一笔圈下去的痕，用四段三次贝塞尔 + 每段带相位的小抖动）—— 确定性，无随机。 */
var CH_OFF = [ .638,.498,.300,.230,.170,.260,.460,.300,.140,.260,.300,.420,.240,.300,.180,.220 ];
function handCircle(cx, cy, r, seed){
  var k, p = [];
  for(k=0;k<4;k++){
    var ph = seed*1.7 + k*1.5707963;
    var rr = r * (1 + 0.085*Math.sin(ph + 0.7) + 0.05*Math.cos(ph*2.3 + 1.1));
    p.push({ x:cx + rr*Math.cos(ph), y:cy + rr*Math.sin(ph)*0.62 });
  }
  function ctrl(a, b, i){
    var dx = b.x-a.x, dy = b.y-a.y, L = Math.sqrt(dx*dx+dy*dy) || 1;
    var nx = -dy/L, ny = dx/L;
    var f1 = 0.55 + 0.10*Math.sin(seed*2.1 + i*1.3);
    var f2 = 0.55 + 0.10*Math.cos(seed*1.9 + i*1.7);
    var w1 = CH_OFF[(seed*3 + i*4) % CH_OFF.length];
    var w2 = CH_OFF[(seed*5 + i*4 + 2) % CH_OFF.length];
    return [ a.x + dx*f1 + nx*w1, a.y + dy*f1 + ny*w1,
             a.x + dx*f2 + nx*w2, a.y + dy*f2 + ny*w2 ];
  }
  var d = "M" + (p[0].x).toFixed(1) + "," + (p[0].y).toFixed(1);
  for(k=0;k<4;k++){
    var a = p[k], b = p[(k+1)%4], cc = ctrl(a, b, k);
    d += " C" + cc[0].toFixed(1) + "," + cc[1].toFixed(1)
       + " "  + cc[2].toFixed(1) + "," + cc[3].toFixed(1)
       + " "  + b.x.toFixed(1) + "," + b.y.toFixed(1);
  }
  return d + " Z";
}
/* ── 四处異文（本幕的四个判定点；分类见实现说明 §19.2 与 §19.9）
      1 = 刪字 ：源書「年少時，**甚**有令名」／抄件「少時有令名」（抄件少一「甚」）
      2 = 增字 ：源書「覺有異色」／抄件「覺人有恠色」—— 抄件多出一個「人」
      3 = 改字 ：抄件「分」／源書「申」
      4 = 刪字 ：源書「爲冷**耳**」／抄件无「耳」
      归类一律以源書为底本、看**抄件**在這一處做了什麼：多出字→增、換了字→改、少了字→刪。
      字位一律按「本行原文 + 这一位上的字」定位（locate()），**不按列号** —— 兩部書長短不同。                        ── */
var MARKS = [
  { no:1, kind:"shan", cls:"刪",
    src:{k:"s1", row:"任育長年少時，甚有", ch:"甚"},
    cpy:{k:"c1", row:"育長，少時有令名，", ch:"有"},
    note:"源書「年少時，甚有令名」，抄件作「少時有令名」—— 抄件少了「甚」一字：这一处屬刪。" },
  { no:2, kind:"zeng", cls:"增",
    src:{k:"s2", row:"爲茗？」覺有異色，", ch:"有"},
    cpy:{k:"c2", row:"爲茗？』覺人有恠色，", ch:"人"},
    note:"源書「覺有異色」，抄件作「覺人有恠色」—— 抄件多出一个「人」：这一处屬增。" },
  { no:3, kind:"gai",  cls:"改",
    src:{k:"s2", row:"乃自申明云：「向問", ch:"申"},
    cpy:{k:"c2", row:"乃自分明云：『向問", ch:"分"},
    note:"源書「乃自申明」，抄件作「乃自分明」—— 同一个字位上換了一个字：这一处屬改。" },
  { no:4, kind:"shan", cls:"刪",
    src:{k:"s2", row:"飲爲𤍠、爲冷耳。」", ch:"耳"},
    cpy:{k:"c2", row:"飲爲熱爲冷？』」", ch:"？"},
    note:"源書「爲冷耳」句末有「耳」，抄件作「爲冷？」—— 抄件少了「耳」一字：这一处屬刪。" }
];
/* 字位定位：按「本行原文 + 这一位上的字」求，**不按列号** —— 兩部書長短不同、
   标点也各有出入，按同一个列号取兩边曾把朱圈落在错字上（本轮修）。找不到就返回
   null，由 setupTypeset 报出来，不静默落错地方。 */
var ROWTEXT = { s1:SRC_ROWS, s2:SRC_ROWS2, c1:CPY_ROWS, c2:CPY_ROWS2 };
function locate(spec){
  if(!spec) return null;
  var rows = ROWTEXT[spec.k] || [];
  for(var i=0;i<rows.length;i++){
    if(rows[i] !== spec.row) continue;
    var chars = Array.from(rows[i]);
    for(var j=0;j<chars.length;j++){
      if(chars[j] === spec.ch) return charAt(spec.k, i, j);
    }
    return null;
  }
  return null;
}
function setupTypeset(){
  var hostS = $("#type-src"), hostC = $("#type-copy");
  hostS.innerHTML = ""; hostC.innerHTML = "";
  /* 源書：左頁 10 行（版心 y0=150）+ 右頁 10 行（版心 y0=352；行高 22 → 末行 550，在頁框内） */
  typeset(hostS, "s1", SRC_ROWS,  { x0:SRC_X0, cw:SRC_CW, fs:SRC_FS, y0:150, lh:SRC_LH });
  typeset(hostS, "s2", SRC_ROWS2, { x0:SRC_X0, cw:SRC_CW, fs:SRC_FS, y0:352, lh:SRC_LH });
  /* 抄件：左頁 4 行（版心 y0=176）+ 右頁 3 行（版心 y0=400；行高 32 → 末行 464，在頁框内） */
  typeset(hostC, "c1", CPY_ROWS,  { x0:CPY_X0, cw:CPY_CW, fs:CPY_FS, y0:176, lh:CPY_LH });
  typeset(hostC, "c2", CPY_ROWS2, { x0:CPY_X0, cw:CPY_CW, fs:CPY_FS, y0:400, lh:CPY_LH });
  /* 頁脚的書名（静的景）*/
  hostS.appendChild(txt("tx-k", 300, 636, "源書 · 世説新語 · 紕漏第三十四",
    { "font-size":12, fill:"var(--ink2)", "text-anchor":"middle" }));
  hostC.appendChild(txt("tx-k", 900, 636, "抄件 · 茶經 · 七之事所引",
    { "font-size":12, fill:"var(--ink2)", "text-anchor":"middle" }));
  /* 異文四点：抄件上畫朱圈、源書頁邊立朱點 —— 兩边各按**自己那一行的字位**取，
     不靠字號；定位失败的字位记进 MARK_MISS（探针会报出来，不静默） */
  var gc = $("#mark-copy"), gs = $("#mark-src");
  gc.innerHTML = ""; gs.innerHTML = "";
  MARK_MISS = [];
  MARKS.forEach(function(m){
    var a = locate(m.cpy), b = locate(m.src);
    if(!a) MARK_MISS.push("cpy" + m.no);
    if(!b) MARK_MISS.push("src" + m.no);
    if(a){
      gc.appendChild(el("path", { "class":"cir", id:"cir-"+m.no, style:"stroke:var(--zhu)",
        "stroke-width":"1.6", "stroke-linecap":"round", fill:"none",
        d: handCircle(a.x + 3.5, a.y - 5, 12.5, m.no) }));
      /* 異文序号：一处異文对一处異文，序号是唯一的对应凭据（落在版心左邊的页边）*/
      gc.appendChild(txt("tx-z seq", 684, a.y + 4, String(m.no),
        { "font-size":"8.5", "text-anchor":"middle", id:"seq-c-" + m.no }));
    }
    if(b){
      gs.appendChild(el("path", { "class":"dot", id:"dot-"+m.no, style:"stroke:var(--zhu)",
        "stroke-width":"1.4", "stroke-linecap":"round", fill:"none",
        d:"M" + (b.x - 6.4).toFixed(1) + "," + (b.y - 5).toFixed(1)
        + " m-4,0 a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0" }));
      gs.appendChild(el("path", { "class":"dot", id:"tick-"+m.no, style:"stroke:var(--zhu)",
        "stroke-width":"1.1", "stroke-linecap":"round", fill:"none",
        d:"M" + (b.x - 5.0).toFixed(1) + "," + (b.y - 5).toFixed(1)
        + " L" + (b.x - 2.6).toFixed(1) + "," + (b.y + 1).toFixed(1) }));
      /* 異文序号：兩部書長短不同（源書 130 字 / 抄件 63 字），列号对不齐 ——
         所以「哪一处对哪一处」由**序号**表明，不靠臆造的「同列」。
         序号一律落在**版心之外的页边**上，不压任何字。 */
      gs.appendChild(txt("tx-z seq", 56, b.y + 4, String(m.no),
        { "font-size":"8.5", "text-anchor":"middle", id:"seq-s-" + m.no }));
    }
  });
}

var AC = null, SND = true;
function sfx(kind){
  if(!SND) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    var f = kind==="paper"?250 : kind==="wood"?150 : kind==="board"?300 : 200;
    o.type = (kind==="paper") ? "triangle" : "sine";
    o.frequency.value = f;
    g.gain.value = 0.0001;
    o.connect(g); g.connect(AC.destination);
    g.gain.exponentialRampToValueAtTime(0.06, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+(kind==="paper"?0.30:0.24));
    o.start(t); o.stop(t+(kind==="paper"?0.32:0.26));
  }catch(e){}
}

    out.push({ h:"附 · 抄書齋所治：異文可以归类",
      l:[
        "抄書齋三事：朱筆圈出異处；異处各歸增／改／刪三格；校記成而落牌存案。",

var notePage = 0;
var NOTE_W = 760, NOTE_H = 576;
function showNotes(){ notePage = 0; renderNotePage(); }
function renderNotePage(){
  var es = noteEntries();
  if(!es.length){ say("校勘記還是空的。", false, 2400); return; }
  if(notePage < 0) notePage = 0;
  if(notePage > es.length-1) notePage = es.length-1;
  var e = es[notePage];
  PAPER_OPEN = "__notes";
  if(READ.indexOf("__notes") < 0){ READ.push("__notes"); }
  paperLayer.innerHTML = "";
  var W = NOTE_W, H = NOTE_H, X = 600-W/2, Y = 360-H/2;
  var g = el("g", { "class":"paper show", transform:"translate("+X+","+Y+")" });
  g.appendChild(el("rect",{ x:-4, y:-4, width:W+8, height:H+8, rx:4, "class":"shadow" }));
  g.appendChild(el("path",{ "class":"l1 f-card",
    d:"M2,2.6 C200,1 560,3.2 758,1.6 L758,"+(H-1.6)+" C560,"+(H-3.4)+" 200,"+(H-0.8)+" 2,"+(H-2.4)+" Z" }));
  g.appendChild(txt("paper-title", W/2, 50, "校 勘 記", { "text-anchor":"middle" }));
  g.appendChild(txt("paper-sub", W/2, 76,
    "典藏司 校書閣 · 熔銅作 · 校書堂 · 書庫走廊 · 膳房 · 類書庫 · 抄書齋 · 七幕所校", { "text-anchor":"middle" }));
  g.appendChild(txt("tx-k", 44, 118, e.h, { "font-size":16 }));
  /* 一条一页：条目长短差得远（最短 1 行、最长 18 行），先量出折行数，
     再按可用高度定行距与字号 —— 保证**整条都在纸内**。
     早先写死「折 48 字 + 行距 22」，最长的二十八条（《世説新語》全文＋出處＋備核）
     会溢出纸外两行、压到案上。只改呈现，不动任何 flag、不动条目文字。 */
  var nl = [], i, j;
  for(i=0;i<e.l.length;i++){
    var ws = wrap(e.l[i], 56);
    for(j=0;j<ws.length;j++) nl.push(ws[j]);
  }
  var y0 = 146, yEnd = H - 62, avail = yEnd - y0;
  var lh = Math.min(22, Math.floor(avail / Math.max(1, nl.length)));
  if(lh < 15) lh = 15;
  var nfs = (lh >= 21) ? 12.5 : (lh >= 18 ? 11.5 : (lh >= 16 ? 11 : 10.5));
  var y = y0;
  for(i=0;i<nl.length;i++){
    g.appendChild(txt("tx-k", 56, y, nl[i], { "font-size":nfs, fill:"var(--ink2)" }));
    y += lh;
  }
  var total = es.length, dw = 14;
  for(i=0;i<total;i++){
    g.appendChild(el("circle",{ cx:(W/2 - (total-1)*dw/2 + i*dw), cy:H-52, r:4,
      fill:(i===notePage) ? "var(--zhu)" : "none",
      stroke:(i===notePage) ? "none" : "var(--faint)", "stroke-width":1 }));
  }
  if(notePage > 0){
    g.appendChild(txt("paper-close", 44, H-44, "◂ 前一條", { "font-size":15 }));
    var hp = el("rect",{ x:34, y:H-62, width:100, height:32, fill:"transparent" });
    hp.setAttribute("style","cursor:pointer");
    hp.addEventListener("click", function(ev){ ev.stopPropagation(); notePage--; renderNotePage(); });
    g.appendChild(hp);
  }
  if(notePage < total-1){
    g.appendChild(txt("paper-close", W-44, H-44, "後一條 ▸", { "font-size":15, "text-anchor":"end" }));
    var hn = el("rect",{ x:W-134, y:H-62, width:100, height:32, fill:"transparent" });
    hn.setAttribute("style","cursor:pointer");
    hn.addEventListener("click", function(ev){ ev.stopPropagation(); notePage++; renderNotePage(); });
    g.appendChild(hn);
  }
  g.appendChild(txt("paper-close", W/2, H-16, "點紙外任意處 · 收起", { "text-anchor":"middle" }));
  g.addEventListener("click", function(ev){ ev.stopPropagation(); closePaper(); });
  paperLayer.appendChild(g);
  /* 「读校勘记」不经过任何 flag 变化 —— 必须在那一刻直接写一次存档（协议 §1.3.2 第 5 条）*/
  appendNotes(); saveNow();
  try{ localStorage.setItem(NOTES_KEY, JSON.stringify({ made:Date.now(), act:ACT_NO, entries:es.length })); }catch(e2){}
}

/* ══ 16. 渲染（唯一的真相来源：flags 与 CIR / CARD / INKDISH）══════════ */
function render(){

  if(F.f_mark_1 && F.f_mark_2 && F.f_mark_3 && F.f_mark_4) F.f_marks_done = true;
  if(F.f_up_zeng && F.f_up_gai && F.f_up_shan) F.f_typed = true;
  /* ② 朱圈（抄件）与朱點（源書）：按字位各自亮起 —— 不靠字號、不靠顏色 */
  for(var i=1;i<=4;i++){

    var d = document.getElementById("dot-"+i); if(d) d.classList.toggle("on", !!CIR[i]);

    var ss = document.getElementById("seq-s-"+i); if(ss) ss.classList.toggle("on", !!CIR[i]);
  }

  if(pond) pond.setAttribute("opacity", INKDISH ? "0.55" : "1");
  /* ④ 四张異牌：在手边 / 已落格 */
  document.getElementById("hs_card_zeng").classList.toggle("gone", CARD.zeng !== 0);
  document.getElementById("hs_card_gai").classList.toggle("gone", CARD.gai !== 0);
  document.getElementById("hs_card_shan").classList.toggle("gone", CARD.shan !== 0);
  document.getElementById("hs_card_cun").classList.toggle("gone", CARD.cun !== 0);
  /* ⑤ 三格各現「这一格收了几个」——牌入格才算 */
  var nz = (F.f_up_zeng?1:0), ng = (F.f_up_gai?1:0), ns = (F.f_up_shan?1:0);
  setCnt("cnt-zeng", nz, "增 1 处");
  setCnt("cnt-gai",  ng, "改 1 处");
  setCnt("cnt-shan", ns, "刪 2 处");
  document.getElementById("file-ch").textContent = (CARD.cun === 4) ? "校記已成" : "存案槽";
  /* ⑥ 世界变化：校記成的那一条朱線 */
  document.getElementById("doneline").classList.toggle("on", !!F.f_filed);
  /* ⑦ 錯法累到三次：案上留一块 12% 朱砂 */
  var pr = document.getElementById("print");
  if(pr) pr.classList.toggle("show", (F.f_misplaced_count|0) >= 3);
  var nb = document.getElementById("hs_led_notes");

}

/* ══ 17. 失败回路：可复原、不锁死（与第一–六幕、第八幕同一语法）═══════
   规则：任何一个落不合处的动作 = 现场变化（抖两下 / 牌沿格邊彈回 / 順纸邊滑落）
   + 一句方位话。计数器只管「累了几次」。**绝不出判语。** */
function shake(hsId){

  if(g){ g.classList.remove("shaking"); void g.offsetWidth; g.classList.add("shaking");

}

function drop(id){ var i = INV.indexOf(id); if(i >= 0) INV.splice(i,1); if(SEL === id) SEL = null; renderInv(); applyArmed(); }

/* ══ 18. 热点行为 ═══════════════════════════════════════════════════ */

/* ── 圈点：一筆蘸一次，圈一处；圈上的不再取回（可反复對讀，不必重圈）── */
function markCircle(no){
  if(!BRUSH){
    /* 錯法①：手裡没拿筆，就落不下去 —— 現場變化（案上抖两下）＋ 一句方位话 */

    return;
  }
  if(!INKDISH){
    /* 錯法②：筆在手上、硃不在筆上 —— 現場變化＋一句方位话 */
    bump("h_ink");

/* ── 归格：三格各有其类；放錯了沿格邊彈回，牌不消失、可立即重放 ── */
function slotUp(which){
  var SLOT = { zeng:1, gai:2, shan:3 };
  var want = (which === "zeng" || which === "gai" || which === "shan") ? which : "cun";
  var hsId = "h_up_" + (want === "cun" ? "zeng" : want);
  if(want === "cun"){ slotFile(); return; }
  if(CARD[want] === SLOT[want]){ return; }           /* 已在格中，无事 */
  if(SEL !== "it_card_" + want){
    /* 錯法③：手上拿的不是这一格该收的牌 —— 現場變化（格抖两下）＋ 一句方位话 */
    bump("h_up_" + want);
    if(SEL && /^it_card_(zeng|gai|shan)$/.test(SEL)){
      say("这一格不收它 —— 牌順着格邊彈了回來。先看这一处是多了字、換了字、还是少了字。", false, 4800);
    }else{
      say("这一格還空着 —— 手邊那四张牌裡，先取一张。", false, 4000);
    }
    return;
  }
  drop("it_card_" + want);
  CARD[want] = SLOT[want];
  F["f_up_" + want] = true; sfx("board");
  render(); saveNow();
  var LN = { zeng:"增字格收了一张 —— 抄件在这一位上多寫了一个字的那一处。",
             gai: "改字格收了一张 —— 同一个字位上換了一个字的那一处。",
             shan:"刪字格收了一张 —— 源書有、抄件漏掉的那一处。" };
  say(LN[want], false, 4600);
  if(F.f_up_zeng && F.f_up_gai && F.f_up_shan)
    say("三格各有其牌 —— 增一、改一、刪二。記校記的那一张，還在手邊。", false, 5000);
}
function slotFile(){
  if(CARD.cun === 4) return;
  if(!(F.f_up_zeng && F.f_up_gai && F.f_up_shan)){
    /* 錯法④：三格還沒齊就往存案槽上 —— 槽不受 */
    bump("h_file");
    say("存案槽還空着 —— 三格先各有其牌，才輪到校記落牌。", false, 4600);

    return;
  }
  drop("it_card_cun");
  CARD.cun = 4; F.f_filed = true; sfx("board");
  render(); saveNow();
  if(!F.f_act7_done){
    F.f_act7_done = true; saveNow();
    say("校記已成 —— 四处異文各歸其类，牌入存案槽。這一齋歸檔。", false, 5400);
  }else{

  }
}

var hintUsed = {}, lastHint = 0;
function hint(){
  var now = Date.now();
  if(now - lastHint < 180000) return;
  var order;
  if(!BRUSH) order = ["brush","books"];
  else if(!INKDISH) order = ["ink","marks"];
  else if(!F.f_marks_done) order = ["marks","ink"];
  else if(!F.f_typed) order = ["slots","cards"];
  else if(!F.f_filed) order = ["file","cards"];
  else order = ["books","slots"];
  for(var i=0;i<order.length;i++){
    var k = order[i];
    if(hintUsed[k]) continue;
    hintUsed[k] = 1; lastHint = now;
    say(HINTS[k], false, 4200);
    return;
  }
}

/* ══ 21. 启动 ═══════════════════════════════════════════════════════ */
var BOOTED = false;

    if(INV.indexOf("it_brush") < 0) INV.push("it_brush");
    if(INV.indexOf("it_inkdish") < 0) INV.push("it_inkdish"); }
  function chainMark(){
    tools();
    F.f_rule_read = true; F.f_rule2_read = true; F.f_src_read = true; F.f_copy_read = true;
    for(var i=1;i<=4;i++){ CIR[i] = true; F["f_mark_"+i] = true; }
    F.f_ink_taken = false; INKDISH = false;
    var k = INV.indexOf("it_inkdish"); if(k >= 0) INV.splice(k,1);
    F.f_marks_done = true;
  }
  function chainTyped(){
    chainMark();
    F.f_card_zeng_taken = true; F.f_card_gai_taken = true; F.f_card_shan_taken = true;
    for(var i=INV.length-1;i>=0;i--){ if(/^it_card_/.test(INV[i]) && INV[i] !== "it_card_cun") INV.splice(i,1); }
    CARD.zeng = 1; CARD.gai = 2; CARD.shan = 3;
    F.f_up_zeng = true; F.f_up_gai = true; F.f_up_shan = true; F.f_typed = true;
    if(INV.indexOf("it_card_cun") < 0) INV.push("it_card_cun");
    F.f_card_cun_taken = true;
  }
  function chainFiled(){
    chainTyped(); CARD.cun = 4; F.f_filed = true; F.f_act7_done = true;
    var k = INV.indexOf("it_card_cun"); if(k >= 0) INV.splice(k,1);
  }
  if(PROBE){
    if(PROBE === "ledger"){ showLedger(true); setCam("close"); render(); }
    else if(PROBE === "room"){ showRoom(); }
    else if(PROBE === "close"){ showClose(); }
    else if(PROBE === "rule"){ showRoom(); showPaper("p_rule"); }
    else if(PROBE === "rule2"){ showRoom(); showPaper("p_rule2"); }
    else if(PROBE === "src"){ showClose(); showPaper("p_src"); }
    else if(PROBE === "copy"){ showClose(); showPaper("p_copy"); }
    else if(PROBE === "bridge"){ showRoom(); openBridge(); }
    else if(PROBE === "bridgefull"){ load(); render(); setCam("close"); showLedger(false); openBridge(); }
    else if(PROBE === "tools"){ tools(); showClose(); }
    else if(PROBE === "mark2"){ tools(); CIR[1]=true; CIR[2]=true; F.f_mark_1=true; F.f_mark_2=true;
      F.f_ink_taken=false; INKDISH=false; var q=INV.indexOf("it_inkdish"); if(q>=0) INV.splice(q,1); showClose(); }
    else if(PROBE === "marked"){ chainMark(); showClose(); }
    else if(PROBE === "typed"){ chainTyped(); showClose(); }
    else if(PROBE === "filed"){ chainFiled(); showClose(); }
    else if(PROBE === "done"){ chainFiled(); showClose(); }
    else if(PROBE === "notes"){ chainFiled(); showClose(); showNotes(); }
  }
  syncModal();   /* ?probe= 各分支走完之後再同步一次（附錄 A.4 點名 boot() 那一次）*/
  requestAnimationFrame(function(){ $("#boot").classList.add("gone"); });
  pokeIdle();
  if(AUTO) runAuto(AUTO);
  else if(restored) say("接着上次的地方。", false, 2400);
}

/* ══ 22. 自动走通：清档重来 + 只用真实 MouseEvent('click') 打真实 .hit ══
   脚本**不直接改任何 flag**：四处異文靠「蘸硃 → 圈字」自然成立，
   三格靠「取牌 → 落格」自然成立，校記靠「取存牌 → 落存案槽」自然成立 ——
   runAuto 里没有一处 F.xxx = true。
   **注意**：选择器一律写成 .hs[data-hs="..."]（带引号），否则 h_up_zeng 会前缀命中别的。 */
function click(hsId){
  var n = document.querySelector('.hs[data-hs="'+hsId+'"]');
  if(!n) return false;
  if(n.classList.contains("gone")) return false;
  var hit = n.querySelector(".hit") || n;
  if(!inActiveView(n)) return false;
  hit.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function clickEl(sel){
  var n = document.querySelector(sel);
  if(!n) return false;
  n.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function w(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function slotOf(itemId){
  var i = INV.indexOf(itemId); if(i < 0) return null;
  return document.querySelector('.slot[data-slot="'+i+'"]');
}
function pickSlot(itemId){
  if(SEL === itemId) return true;
  var s = slotOf(itemId); if(!s) return false;
  s.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return SEL === itemId;
}
/* 一处異文 = 蘸硃（若碟空）→ 圈抄件那个字位（朱圈立现）—— 本幕的热点 id 就是 c1..c4 */
function markOne(no){
  if(!INKDISH) click("h_ink");
  var t = document.getElementById("cir-" + no);
  if(t && t.classList.contains("on")) return true;
  click("c" + no);
  return !!(t && t.classList.contains("on"));
}
async function runAuto(stop){
  var log = [];
  function step(name, ok){ log.push(name + "=" + (ok ? "ok" : "MISS")); }
  function report(){
    document.title = "SELFTEST::" + log.join(" | ")
      + " || FLAGS[" + FLAG_KEYS.filter(function(k){ return F[k]; }).join(",") + "]"
      + " || misplaced=" + F.f_misplaced_count
      + " || INV[" + INV.join(",") + "] || CAM=" + CAM
      + " || CIR[" + [1,2,3,4].map(function(i){ return CIR[i]?1:0; }).join("") + "]"
      + " || CARD[" + CARD.zeng + CARD.gai + CARD.shan + CARD.cun + "]"
      + " || INK=" + (INKDISH?1:0) + " BRUSH=" + (BRUSH?1:0)
      + " || READ[" + READ.join(",") + "]"
      + " || DONE[" + DONE.join(",") + "]";
    document.body.setAttribute("data-selftest", log.join(" | "));
  }
  try{
    if(stop === "ledger"){ step("停在值房台賬", LEDGER); report(); return; }
    step("0_讀幕間", click("h_ledger_bridge")); await w(340);
    step("1_收起幕間", click("h_bridge_go")); await w(340);
    if(stop === "bridge"){ step("停在幕間", true); report(); return; }
    step("2_推門入齋", click("h_ledger_enter")); await w(380);
    step("3_在對攤近景", CAM === "close");
    /* ── 翻書可查：兩張體例紙（在全景的架前，所以要先退回全景）─────── */
    step("4_退回書齋", (function(){ click("h_back"); return CAM === "room"; })()); await w(520);
    step("5_讀抄書齋體例", click("h_rule")); await w(300); closePaper(); await w(160);
    step("6_讀校勘之例", click("h_rule2")); await w(300); closePaper(); await w(160);
    step("7_兩紙已讀", !!(F.f_rule_read && F.f_rule2_read));
    step("8_再走近抄書案", (function(){ click("h_go"); return CAM === "close"; })()); await w(620);
    /* ── 翻書可查：案上兩部書（源書 / 抄件）───────────────────────── */
    step("9_讀源書", click("h_src")); await w(320); closePaper(); await w(160);
    step("10_讀抄件", click("h_copy")); await w(320); closePaper(); await w(160);
    step("11_兩部已讀", !!(F.f_src_read && F.f_copy_read));
    /* ── 錯法一：手裡沒筆就落不下去 ─────────────────────────────── */
    step("12_錯法一_空手落筆", (function(){ var mc = F.f_misplaced_count|0; click("c1");
        return (F.f_misplaced_count|0) === mc+1 && !CIR[1]; })()); await w(420);
    step("13_錯法一已記_抄件未圈", !CIR[1]);
    /* ── 具：取筆 → 蘸硃 ──────────────────────────────────────── */
    step("14_取朱筆", (function(){ click("h_brush"); return BRUSH && pickSlot("it_brush"); })()); await w(340);
    step("15_蘸朱砂", (function(){ click("h_ink"); return INKDISH && pickSlot("it_inkdish"); })()); await w(340);
    /* ── 錯法二：筆在手上、硃不在筆上（一筆蘸一次）──────────────────── */
    step("16_用掉這一筆", (function(){ click("c1"); return CIR[1] && !INKDISH; })()); await w(420);
    step("17_錯法二_無硃再落", (function(){ var mc = F.f_misplaced_count|0; click("c2");
        return (F.f_misplaced_count|0) === mc+1 && !CIR[2]; })()); await w(420);
    step("18_錯法二已記_第二处未圈", !CIR[2]);
    /* ── 鏈①：四处異文各圈一处（一筆蘸一次）───────────────────── */
    step("19_蘸硃再圈第二处", (function(){ return markOne(2); })()); await w(420);
    step("20_蘸硃圈第三处",   (function(){ return markOne(3); })()); await w(420);
    step("21_蘸硃圈第四处",   (function(){ return markOne(4); })()); await w(420);
    step("22_四处已圈", !!(F.f_mark_1 && F.f_mark_2 && F.f_mark_3 && F.f_mark_4));
    step("23_圈点已畢", !!F.f_marks_done);
    /* ── 錯法三：三格未齊就往存案槽上（槽不受）────────────────────── */
    step("24_錯法三_空手落存案槽", (function(){ var mc = F.f_misplaced_count|0; click("h_file");
        return (F.f_misplaced_count|0) === mc+1 && !F.f_filed; })()); await w(420);
    step("25_錯法三已記_校記未成", !F.f_filed);
    /* ── 鏈②：四张牌各歸其处（一牌一格）────────────────────────── */
    step("26_取增牌", (function(){ click("h_card_zeng"); return pickSlot("it_card_zeng"); })()); await w(320);
    step("27_增牌落增字格", (function(){ click("h_up_zeng"); return !!F.f_up_zeng; })()); await w(420);
    step("28_取改牌", (function(){ click("h_card_gai"); return pickSlot("it_card_gai"); })()); await w(320);
    /* ── 錯法四：改牌往刪字格放（牌沿格邊彈回）────────────────────── */
    step("29_錯法四_改牌往刪格", (function(){ var mc = F.f_misplaced_count|0; click("h_up_shan");
        return (F.f_misplaced_count|0) === mc+1 && !F.f_up_shan; })()); await w(460);
    step("30_錯法四已記_刪格仍空", !F.f_up_shan);
    step("31_改牌落改字格", (function(){ click("h_up_gai"); return !!F.f_up_gai; })()); await w(420);
    step("32_取刪牌", (function(){ click("h_card_shan"); return pickSlot("it_card_shan"); })()); await w(320);
    step("33_刪牌落刪字格", (function(){ click("h_up_shan"); return !!F.f_up_shan; })()); await w(420);
    step("34_三格各有其牌", !!(F.f_up_zeng && F.f_up_gai && F.f_up_shan && F.f_typed));
    /* ── 鏈③：取存牌 → 落存案槽（收束）────────────────────────── */
    step("35_取存牌", (function(){ click("h_card_cun"); return pickSlot("it_card_cun"); })()); await w(320);
    step("36_存牌落存案槽", (function(){ click("h_file"); return !!F.f_filed; })()); await w(460);
    step("37_校記成", !!F.f_filed);
    step("38_收束成立", !!F.f_act7_done);
    /* ── 開台账 → 校勘记 ───────────────────────────────────── */
    step("39_開台賬", (function(){ clickEl("#bk"); return LEDGER; })()); await w(400);
    step("40_校勘記", (function(){ click("h_ledger_notes"); return PAPER_OPEN === "__notes"; })()); await w(500);
    if(stop === "notes"){ report(); return; }
    closePaper(); await w(240);
    step("41_再入齋", click("h_ledger_enter")); await w(380);
    step("42_收束_本幕已畢", !!F.f_act7_done);
  }catch(err){ log.push("ERR=" + (err && err.message)); }
  report();
}

window.__dd = { F:function(){ return F; }, INV:function(){ return INV; }, DONE:function(){ return DONE; },
  CAM:function(){ return CAM; }, CIR:function(){ return CIR; }, CARD:function(){ return CARD; },
  click:click, setCam:setCam, auto:runAuto, inActiveView:inActiveView,
  /* 字位表（探针用来核「兩边同一個字位」；只读，不改任何状态）*/
  pos:function(key,r,c){
    var p = charAt(key,r,c); if(!p) return null;
    var fs = (key.charAt(0)==="s") ? SRC_FS : CPY_FS;
    return { x:p.x, y:p.y, ch:p.ch, fs:fs };
  },
  marks:function(){ return MARKS.map(function(m){
    return { no:m.no, kind:m.kind, cls:m.cls, src:m.src, cpy:m.cpy };
  }); },
  /* 四处異文的**实机字位**与归类（探针据此核「圈落在被圈的那个字上」）*/
  badMarks:function(){ return MARK_MISS.slice(); },
  markPos:function(){ return MARKS.map(function(m){
    var a = locate(m.cpy), b = locate(m.src);
    return { no:m.no, kind:m.kind, cls:m.cls,
      cpy: a ? { x:a.x, y:a.y, ch:a.ch, fs:CPY_FS } : null,
      src: b ? { x:b.x, y:b.y, ch:b.ch, fs:SRC_FS } : null }; }); },
  /* 抄件正文里每一个字的实机字位（用来数「源書那一段有没有被劈成两半」）*/
  rows:function(key){ return (ROWTEXT[key]||[]).slice(); },
  state:function(){ return {F:F, INV:INV, CAM:CAM, SEL:SEL, DONE:DONE, READ:READ, CIR:CIR, CARD:CARD,
    INKDISH:INKDISH, BRUSH:BRUSH}; } };
/* 探针（_selftest/probe-accept-act7.html）需要按名调用这几个只切覆盖层/重绘的函数 */
window.showLedger = showLedger;
window.render = render;

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
})();
</script>
