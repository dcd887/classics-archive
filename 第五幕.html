<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>典藏司 · 膳房 · 第五幕</title>
<link rel="icon" href="favicon.ico">
<style>
  /* ══ 色板：与第一–四幕、第八幕逐字相同 —— 9 个 token + 既有平涂旧木 #b9a88c，不新增颜色 ══ */
  :root{
    --paper:#f3ecdf; --paper2:#eae1d0; --card:#faf6ec;
    --ink:#2a2622; --ink2:#5c554b; --faint:#8d8577;
    --zhu:#a63a2a; --line:#d3c8b4; --line2:#c0b49d;
    --l1:2.2px; --l2:1.4px; --l3:0.9px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Songti SC","STSong",Georgia,"Noto Serif SC",serif;
    display:flex; align-items:center; justify-content:center; padding:8px;
  }
  /* ══ 窗口自适应（附录 A.2 / 坑 23）══════════════════════════════════════
     舞台恒为 1200:720。宽度同时受三个上界约束：视窗宽 − 16、设计宽 1200、
     以及「视窗高 − 台账 64 − 上下留白 16」换算过来的宽。三者取最小 —— 于是
     任何窗口比例下整幅画面等比完整可见：不裁切左右，也不裁切上下，
     并且 html/body 已 overflow:hidden，不会出现滚动条。
     （旧版只顾宽度：min(97vw,1200px)，高度一旦不够就上下被切；实测 1214x650
     时舞台 top = −60、竖向滚动条 = 有。此为修因。）*/
  #app{width:min(100%,1200px,calc((100vh - 88px) * 1.66667));display:flex;flex-direction:column;min-height:0}
  #stage{display:block;width:100%;height:auto;aspect-ratio:1200/720;background:var(--paper);overflow:hidden}
  #hud{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:14px;
       background:var(--paper);border-top:1px solid var(--line2);padding:0 6px}
  #slots{display:flex;gap:4px}
  .slot{width:56px;height:56px;border:1px solid transparent;position:relative;cursor:default}
  .slot .under{position:absolute;left:8px;right:8px;bottom:6px;height:1px;background:var(--line2)}
  .slot svg{display:block;width:52px;height:52px;margin:1px;transition:transform 120ms ease}
  .slot.has{cursor:pointer}
  .slot.sel{border-color:var(--zhu)}
  .slot.sel svg{transform:translateY(-2px)}
  #caption{margin-left:auto;margin-right:8px;max-width:62%;
           font-family:"Kaiti SC","STKaiti","KaiTi",serif;
           font-size:13px;line-height:1.6;color:var(--ink2);text-align:right;
           opacity:0;transition:opacity 500ms ease}
  #caption.on{opacity:1}
  #caption.zhu{color:var(--zhu)}

  /* ══ 线宽三级（与前几幕同值；vector-effect 保证跨视图/跨缩放不漂移）══ */
  .l1{stroke:var(--ink);stroke-width:var(--l1);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l2{stroke:var(--ink2);stroke-width:var(--l2);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l3{stroke:var(--faint);stroke-width:var(--l3);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .miter{stroke-linejoin:miter}
  .f-wood{fill:#b9a88c}
  .f-card{fill:var(--card)}
  .f-zhu{fill:var(--zhu)}
  .tx{fill:var(--ink);font-family:"Songti SC","STSong",Georgia,serif}
  .tx-k{fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .tx-z{fill:var(--zhu);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .shadow{fill:var(--ink);opacity:.08;stroke:none;pointer-events:none}

  /* ══ 视图切换（本幕 2 个视图：膳房全景 + 水台近景；台账与过渡页是覆盖层）══ */
  .view{opacity:0;pointer-events:none;transition:opacity 500ms ease}
  .view.active{opacity:1;pointer-events:auto}

  /* ══ 命中（修正）：非活动层的整棵子树都不收鼠标 ═════════════════════════
     【原本的病灶】.hs .hit{pointer-events:all} 是「显式值」，会盖掉祖先
     .view{pointer-events:none} / #ledger:not(.on) / #bridge:not(.on) 的继承；
     而 opacity:0 的元素照样参与命中测试。两者相乘：收起的 #ledger、关掉的
     #bridge、没进去的 #view-sink 里那些透明 .hit 矩形仍然接得住鼠标，且因为
     文档顺序在後而盖在上面 —— 真人点下去，命中的是「别人家的透明矩形」，
     甚至按错键（点「走近水台」执行了「收起·進膳房」）。
     【修法】不改任何 .hit 的既有写法（#auto 脚本自检仍走同一条路），只把非活动层
     整个子树用 !important 钉死；动画照旧，只是动画期间那一层不吃鼠标。*/
  .view:not(.active), .view:not(.active) *,
  #ledger:not(.on), #ledger:not(.on) *,
  #bridge:not(.on), #bridge:not(.on) *,
  .paper:not(.show), .paper:not(.show) *{pointer-events:none!important}
  /* 上层（值房台账／幕间过渡页）压着时，底下场景整棵钉死（syncModal 挂 .modal）*/
  #world.modal .view, #world.modal .view *{pointer-events:none!important}
  /* 展开中的纸页维持原样：自己吃鼠标，于是不会漏点到纸后面那些热点 */
  #paper-layer{pointer-events:none}
  #paper-layer .paper.show{pointer-events:auto}

  /* ══ 热点：默认 / 可点 / 已取 三态光标 ══ */
  .hs{cursor:default}
  .hs .hit{fill:transparent;stroke:none;pointer-events:all}
  /* 命中**只认 .hit**：.art 一律不吃鼠标。于是「看得到的范围 = 点得到的范围」
     由 .hit 一张矩形说清，也不会有某热点的画盖住另一热点的热区。*/
  .hs .art{pointer-events:none}
  .hs.on .hit{cursor:pointer}
  .hs.on:hover .art path,.hs.on:hover .art rect,.hs.on:hover .art circle,
  .hs.on:hover .art ellipse,.hs.on:hover .art line,.hs.on:hover .art polygon{stroke:var(--zhu);stroke-width:3}
  .hs.armed .art path,.hs.armed .art rect,.hs.armed .art circle,
  .hs.armed .art ellipse,.hs.armed .art line,.hs.armed .art polygon{stroke:var(--zhu);stroke-width:3}
  .hs.on:hover .art text,.hs.armed .art text{fill:var(--zhu)}
  .hs.gone, .hs.gone *{pointer-events:none}
  .hs.gone .art{opacity:0}
  .hs.breathe .art *{stroke:var(--zhu)!important;animation:breathe 1.2s ease-in-out 2}
  @keyframes breathe{0%,100%{stroke-opacity:1}50%{stroke-opacity:.4}}

  /* ══ 视角规格（§十二）：屏幕坐标 = 正面坐标 + 深度·(0,−0.5)，k = 0.5 ══
     本幕深度预算：膳房地面随画面裁切 / 灶頂板進深 40（帶高 20）/
     水台台面進深 80（帶高 40）/ 灶門膛底進深 16（帶高 8）/
     近景水案台面進深 80（帶高 40）/ 大盆口面進深 80（帶高 40，＝本幕上限）/
     中盆口面進深 60（帶高 30）/ 小盆口面進深 40（帶高 20）/ 竹盤口面進深 48（帶高 24）。
     **全部 ≤ 80** —— 本幕没有超预算的构件。 */
  .floor{fill:var(--paper2);stroke:none}
  .slab{fill:var(--card);stroke:none}
  .recess{fill:var(--paper2);stroke:none}
  .soot{fill:var(--ink2);opacity:.18;stroke:none}

  /* ══ 世界变化 ① 三物入三盆：盆身上現出該物的名（朱字）══ */
  #basin-big .mark,#basin-mid .mark,#basin-small .mark{opacity:0;transition:opacity 260ms ease}
  #basin-big.set .mark,#basin-mid.set .mark,#basin-small.set .mark{opacity:1}
  /* ══ 世界变化 ② 兩頁錄文的缺字處補回本字 ══ */
  #gap-a .fillc,#gap-b .fillc{opacity:0;transition:opacity 260ms ease}
  #hs_slip_a.filled #gap-a .fillc,#hs_slip_b.filled #gap-b .fillc{opacity:1}
  /* ══ 世界变化 ③ 兩頁之間拉起一條「兩存」朱線（一字之異並置）══ */
  #keep-lead{opacity:0;transition:opacity 420ms ease}
  #keep-lead.on{opacity:1}
  /* ══ 世界变化 ④ 灶門掩上（本幕收束）══ */
  #stove-shut{opacity:0;transition:opacity 420ms ease}
  #stove-shut.on{opacity:1}
  #stove-open{opacity:1;transition:opacity 320ms ease}
  #stove-open.gone{opacity:0}
  /* ══ 錯法：手上的東西抖一下（東西仍在原處）══ */
  @keyframes shake{0%,100%{transform:translateX(0)}35%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
  .shaking{animation:shake 130ms ease-in-out 2}
  /* ══ 錯法：物順盆沿滑回 / 字牌順頁邊滑落（現場變化，東西不消失、可立即重放）══ */
  @keyframes fall{0%{opacity:1}100%{opacity:0}}
  #creature-ghost{opacity:0}
  #creature-ghost.fall{animation:fall 460ms ease-in forwards}
  #creature-ghost.at-big{transform:translate(628px,362px)}
  #creature-ghost.at-mid{transform:translate(828px,362px)}
  #creature-ghost.at-small{transform:translate(948px,362px)}
  #tag-ghost{opacity:0}
  #tag-ghost.fall{animation:fall 460ms ease-in forwards}
  #tag-ghost.at-a{transform:translate(560px,180px)}
  #tag-ghost.at-b{transform:translate(860px,180px)}
  /* ══ 灶面上的朱印（錯法累到三次才出現，一塊 12% 朱砂，不是新色）══ */
  #print{opacity:0;transition:opacity 260ms ease}
  #print.show{opacity:1}
  /* ══ 拿在手上的東西離位微抬 ══ */
  .lift .art{opacity:.72}

  /* ══ 纸（在場景內放大展開，不切屏、不加暗底遮罩）══ */
  .paper{opacity:0;pointer-events:none;transition:opacity 260ms ease}
  .paper.show{opacity:1;pointer-events:auto}
  .paper-title{font-size:21px;fill:var(--ink);letter-spacing:.18em}
  .paper-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  .paper-body{font-size:17px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.02em}
  .paper-body .key{font-size:19px}
  .paper-close{font-size:12px;fill:var(--faint);letter-spacing:.08em}

  /* ══ 外殼：典藏司「值房台账」（与前几幕同一套）══ */
  #ledger{opacity:0;pointer-events:none;transition:opacity 420ms ease}
  #ledger.on{opacity:1;pointer-events:auto}
  .led-lede{font-size:26px;fill:var(--ink);letter-spacing:.22em}
  .led-sub{font-size:13px;fill:var(--faint);letter-spacing:.12em}
  .led-item{font-size:19px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.04em}
  .led-item.done{fill:var(--faint)}
  .led-act{font-size:21px;fill:var(--ink);letter-spacing:.2em}
  .led-hint{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  #bridge{opacity:0;pointer-events:none;transition:opacity 380ms ease}
  #bridge.on{opacity:1;pointer-events:auto}
  .br-lede{font-size:22px;fill:var(--ink);letter-spacing:.2em}
  .br-body{font-size:16px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .br-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}

  #boot{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;
        justify-content:center;font-size:15px;color:var(--ink2);letter-spacing:.3em;z-index:9}
  #boot.gone{display:none}
</style>
</head>
<body>

<div id="boot">膳房</div>

<div id="app">
  <svg id="stage" viewBox="0 0 1200 720" shape-rendering="geometricPrecision"
       xmlns="http://www.w3.org/2000/svg" role="application" aria-label="典藏司膳房 第五幕">
    <defs>
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
      </filter>
    </defs>
    <rect x="0" y="0" width="1200" height="720" fill="var(--paper)"/>
    <g id="world">

      <!-- ══════════════════ view-room：膳房（全景）══════════════════
           同一台虚拟相机、同一斜率 k=0.5（§十二）。进深预算全部 ≤ 80（见样式表注释）。
           三物同名而异实 —— **形相类，只能以大小别**（这一厨不比形状，比大小）。 -->
      <g id="view-room" class="view active">

        <!-- ① 膳房地面（水平面）：远边在墙脚 y≈596，近边落在画面之外 -->
        <path class="floor" d="M40,596.4 C300,594.6 700,597.2 1160,595.6 L1160,726 L40,726 Z"/>
        <path class="l3 miter" d="M150,664 C400,662.6 800,665 1090,662.8"/>
        <path class="l3 miter" d="M1136,620 C1137.2,650 1136.4,674 1137,694"/>
        <path class="l3 miter" d="M62,620 C61,650 61.8,674 61,694"/>
        <!-- ② 墙脚交界 -->
        <path class="l2" d="M40,596.6 C300,594.8 700,597.4 1160,595.8"/>

        <!-- A 檐梁（一根旧木横梁，横贯厨墙上沿）＋ 梁上悬下的一只小竹篮 -->
        <g class="scenery" pointer-events="none">
          <path class="l1 f-wood" d="M60,44.4 C420,42.6 800,45.2 1140,43.6 L1143,77.4 C800,79.2 420,76.6 60,78.4 Z"/>
          <path class="l3" d="M60,61.4 C420,59.6 800,62.2 1140,60.6"/>
          <path class="l3" d="M530,79.6 C528.6,112 529.4,148 528.8,180"/>
          <path class="l1 f-wood" d="M508,182.4 C516,180.6 542,183.2 550,181.6 L546,238.4 C538,240.2 520,237.6 512,239.4 Z"/>
          <path class="l3 miter" d="M510,206 C518,204.4 540,207 548,205.4"/>
        </g>

        <!-- B 壁上「膳房體例」一纸（翻書可查；本幕自撰，非古籍引文）-->
        <g id="hs_rule" class="hs on" data-hs="h_rule">
          <rect class="hit" x="62" y="140" width="196" height="160"/>
          <g class="art">
            <path class="l1 f-card" d="M70,148.4 C124,146.6 196,149.2 248,147.6 L249,298.4 C196,300.2 124,297.6 70,299.4 Z"/>
            <text class="tx-k" x="159" y="176" font-size="14" text-anchor="middle">膳房體例</text>
            <path class="l3 miter" d="M86,202 L232,202 M86,228 L206,228 M86,254 L220,254 M86,280 L198,280"/>
          </g>
        </g>

        <!-- C 架上兩部書（各自獨立熱點，不相邻、不嵌套）-->
        <g id="hs_book_ssxy" class="hs on" data-hs="h_book_ssxy">
          <rect class="hit" x="276" y="140" width="110" height="186"/>
          <g class="art">
            <path class="l1 f-card" d="M284,160.4 L376,158.6 L377,320.4 L285,322.2 Z"/>
            <text class="tx-k" x="330" y="190" font-size="14" text-anchor="middle">世説新語</text>
            <text class="tx-k" x="330" y="212" font-size="12" fill="var(--ink2)" text-anchor="middle">卷下 · 紕漏</text>
            <path class="l3" style="stroke:var(--zhu)" d="M300,242 L362,242 M300,264 L338,264 M300,286 L354,286"/>
          </g>
        </g>
        <g id="hs_book_yulan" class="hs on" data-hs="h_book_yulan">
          <rect class="hit" x="396" y="140" width="110" height="186"/>
          <g class="art">
            <path class="l1 f-card" d="M404,160.4 L496,158.6 L497,320.4 L405,322.2 Z"/>
            <text class="tx-k" x="450" y="190" font-size="14" text-anchor="middle">太平御覽</text>
            <text class="tx-k" x="450" y="212" font-size="12" fill="var(--ink2)" text-anchor="middle">鱗介部 · 彭螖</text>
            <path class="l3" style="stroke:var(--zhu)" d="M420,242 L482,242 M420,264 L458,264 M420,286 L474,286"/>
          </g>
        </g>

        <!-- D 壁上兩頁錄文（各缺一字；補字＝鏈②）-->
        <g id="hs_slip_a" class="hs on" data-hs="h_slip_a">
          <rect class="hit" x="560" y="116" width="270" height="210"/>
          <g class="art">
            <path class="l1 f-card" d="M574,130.4 C650,128.6 750,131.2 816,129.6 L817,312.4 C750,314.2 650,311.6 574,313.4 Z"/>
            <text class="tx-k" x="695" y="158" font-size="14" text-anchor="middle">錄文一</text>
            <path class="l3 miter" d="M586,170 L804,170"/>
            <text class="tx-k" x="586" y="198" font-size="12.5">爾雅曰：螖蠌小者</text>
            <rect class="recess" x="692" y="182" width="26" height="20"/>
            <path class="l2 miter" d="M692,182.4 L718,182.4 L718,202 L692,202 Z" fill="none"/>
            <g id="gap-a"><text class="tx-z fillc" x="705" y="197" font-size="15" text-anchor="middle">勞</text></g>
            <text class="tx-k" x="724" y="198" font-size="12.5">。即彭蜞也，</text>
            <text class="tx-k" x="586" y="226" font-size="12.5">似蟹而小。</text>
            <text class="tx-k" x="586" y="262" font-size="11" fill="var(--faint)">（本幕自撰的模擬錄文，非古籍引文。</text>
            <text class="tx-k" x="586" y="280" font-size="11" fill="var(--faint)">所錄之句出《世説新語》劉孝標注。）</text>
            <text class="tx-k" x="586" y="302" font-size="11" fill="var(--faint)">（出處見《校勘記》十九。）</text>
          </g>
        </g>
        <g id="hs_slip_b" class="hs on" data-hs="h_slip_b">
          <rect class="hit" x="860" y="116" width="290" height="210"/>
          <g class="art">
            <path class="l1 f-card" d="M874,130.4 C950,128.6 1050,131.2 1116,129.6 L1117,312.4 C1050,314.2 950,311.6 874,313.4 Z"/>
            <text class="tx-k" x="995" y="158" font-size="14" text-anchor="middle">錄文二</text>
            <path class="l3 miter" d="M886,170 L1104,170"/>
            <text class="tx-k" x="886" y="198" font-size="12.5">爾雅曰：螖蠌，小者</text>
            <rect class="recess" x="1004" y="182" width="26" height="20"/>
            <path class="l2 miter" d="M1004,182.4 L1030,182.4 L1030,202 L1004,202 Z" fill="none"/>
            <g id="gap-b"><text class="tx-z fillc" x="1017" y="197" font-size="15" text-anchor="middle">蟧</text></g>
            <text class="tx-k" x="1036" y="198" font-size="12.5">。</text>
            <text class="tx-k" x="886" y="238" font-size="11" fill="var(--faint)">（本幕自撰的模擬錄文，非古籍引文。</text>
            <text class="tx-k" x="886" y="256" font-size="11" fill="var(--faint)">所錄之句出《太平御覽》鱗介部 · 彭螖。）</text>
            <text class="tx-k" x="886" y="278" font-size="11" fill="var(--faint)">（出處見《校勘記》二十一。）</text>
            <text class="tx-k" x="886" y="300" font-size="11" fill="var(--faint)">（此頁只此一句，無注家之語。）</text>
          </g>
        </g>
        <!-- D2 「兩存」朱線：兩頁一字之異既並置，中拉起一條（世界變化③）-->
        <g id="keep-lead" pointer-events="none">
          <path class="l3" style="stroke:var(--zhu)" d="M820,232 C840,230.6 850,233 858,231.4"/>
          <circle cx="828" cy="231.6" r="3.4" fill="var(--zhu)" opacity=".5"/>
          <circle cx="852" cy="231.8" r="3.4" fill="var(--zhu)" opacity=".5"/>
        </g>

        <!-- E 壁上木枨 ＋ 掛在枨上的兩块字牌（取牌＝鏈②的前半步）-->

<svg id="symdefs" width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="symroot"></defs></svg>

<script>
"use strict";
(function(){

/* ══ 0. 存档：与第一–四幕、第八幕同一把钥匙、同一结构（幕间协议 §1.3）════════
   本幕（第五幕）写：act=5，往 done 追加 "act5"，《校勘记》追加本幕条目。
   **只加不改**：不改键名、不改任何既有字段的语义、不写迁移脚本。
   **本幕只往 inv 里放「本幕自己给得出的东西」**（三物、两块字牌），
   不假设「玩家还持有上一幕的物件」。 */
var SAVE_KEY = "diandangsi.rustylake.v1";
var NOTES_KEY = "diandangsi.rustylake.v1.notes";
var ACT_NO = 5, ACT_ID = "act5";

/* ══ 1. 上一幕交下来的东西（跨幕累积的读入侧）════════════════════════
   读不到就是 null —— **照实说「沒讀到」，不假装办过**（协议 §1.3.3）。 */
var PREV = (function(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    var o = JSON.parse(raw);
    if(!o || !o.f) return null;
    return o;
  }catch(e){ return null; }
})();
function prevHas(k){ return !!(PREV && PREV.f && PREV.f[k]); }
function prevRead(k){ return !!(PREV && PREV.read && PREV.read.indexOf(k) >= 0); }
function prevDone(id){ return !!(PREV && PREV.done && PREV.done.indexOf && PREV.done.indexOf(id) >= 0); }

/* ══ 2. flags ═══════════════════════════════════════════════════════ */
var FLAG_KEYS = [
  "f_seen_act5","f_bridge_read","f_rule_read",
  "f_ssxy_read","f_yulan_read","f_slip_a_read","f_slip_b_read",
  "f_tag_lao_taken","f_tag_liao_taken",
  "f_slip_a_filled","f_slip_b_filled","f_two_forms_kept",
  "f_crab_taken","f_pq_taken","f_px_taken",
  "f_basin_big_set","f_basin_mid_set","f_basin_small_set","f_three_sorted",
  "f_stove_shut","f_act5_done"
];
var F = {}, INV = [], READ = [], SEL = null, CAM = "room";
/* 三物是否还在水台的竹盤上（1 = 在盤上；0 = 已取走）*/
var STAND = { it_crab:1, it_pq:1, it_px:1 };

function resetState(){
  F = {}; FLAG_KEYS.forEach(function(k){ F[k]=false; });
  F.f_misplaced_count = 0;      /* 与第一–四幕、第八幕同名同义：错的次数 */
  INV = []; READ = []; SEL = null; CAM = "room";
  STAND = { it_crab:1, it_pq:1, it_px:1 };
}

/* ══ 3. 存读档（幕间协议 §1.3：只加字段，不改字段语义，不改键名）══════ */
var saveT = null;
var DONE = (PREV && PREV.done && PREV.done.slice) ? PREV.done.slice() : [];
var NOTE_LOG = (PREV && PREV.notes && PREV.notes.slice) ? PREV.notes.slice() : [];
function markActDone(){
  if(F.f_act5_done && DONE.indexOf(ACT_ID) < 0) DONE.push(ACT_ID);
}
function appendNotes(){
  var es = noteEntries();
  for(var i=0;i<es.length;i++){
    var key = ACT_NO + "|" + es[i].h;
    var has = false;
    for(var j=0;j<NOTE_LOG.length;j++){ if(NOTE_LOG[j].key === key){ has = true; break; } }
    if(!has) NOTE_LOG.push({ key:key, act:ACT_NO, h:es[i].h, l:es[i].l });
  }
}
function saveNow(){
  try{
    markActDone(); appendNotes();
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      f:F, inv:INV, read:READ, cam:CAM, ts:Date.now(),
      act:ACT_NO, done:DONE, notes:NOTE_LOG
    }));
  }catch(e){}
}
function saveDebounced(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 300); }
function load(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    var o = JSON.parse(raw);
    if(!o || !o.f) return false;
    FLAG_KEYS.forEach(function(k){ if(k in o.f) F[k]=o.f[k]; });
    if(typeof o.f.f_misplaced_count === "number") F.f_misplaced_count = o.f.f_misplaced_count;
    INV = o.inv || []; READ = o.read || []; CAM = o.cam || "room";
    STAND = { it_crab:(F.f_crab_taken || F.f_basin_big_set   || INV.indexOf("it_crab") >= 0) ? 0 : 1,
              it_pq:  (F.f_pq_taken   || F.f_basin_mid_set    || INV.indexOf("it_pq")   >= 0) ? 0 : 1,
              it_px:  (F.f_px_taken   || F.f_basin_small_set  || INV.indexOf("it_px")   >= 0) ? 0 : 1 };
    return true;
  }catch(e){ return false; }
}

/* ══ 4. DOM ═════════════════════════════════════════════════════════ */
var $ = function(s){ return document.querySelector(s); };
var stage = $("#stage"), world = $("#world"), paperLayer = $("#paper-layer");
var caption = $("#caption"), slotsEl = $("#slots");
function el(tag, attrs){ var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if(attrs) for(var k in attrs) n.setAttribute(k, attrs[k]); return n; }
function txt(cls, x, y, s, extra){
  var t = el("text", { "class":cls, x:x, y:y });
  if(extra) for(var k in extra) t.setAttribute(k, extra[k]);
  t.textContent = s; return t;
}

/* ══ 5. 视图（本幕 2 个：room 膳房全景 / sink 水台近景）═══════════════ */
function setCam(which){
  CAM = which;
  world.dataset.cam = which;
  document.querySelectorAll(".view").forEach(function(v){
    v.classList.toggle("active", v.id === "view-" + which);
  });
  applyArmed();
}
function goRoom(){ setCam("room"); }
function goSink(){ setCam("sink"); }

/* ══ 6. 物件表 + 物品栏 symbol（五件，圖形各一，复用 <use>）═══════════
   三物「形相類」—— 三只 symbol 的躯干、雙螯、八足**逐字同一套路径**，
   只有牌上的名不同。这正是本幕的謎面：目視不辨，只能以大小別。 */
var ITEMS = {
  it_crab:    { n:"蟹 · 八足二螯",   sym:"sym_crab",  box:[-2,-2,104,104] },
  it_pq:      { n:"彭蜞 · 似蟹而小", sym:"sym_pq",    box:[-2,-2,104,104] },
  it_px:      { n:"彭螖 · 蟹之小者", sym:"sym_px",    box:[-2,-2,104,104] },
  it_tag_lao: { n:"字牌 · 勞",       sym:"sym_lao",   box:[-4,-4,108,108] },
  it_tag_liao:{ n:"字牌 · 蟧",       sym:"sym_liao",  box:[-4,-4,108,108] }
};
function buildSymbols(){
  var root = $("#symroot");
  var BODY = "M24,34.4 C36,16.6 64,16.6 76,34.4 L72,52.4 C62,61.2 38,61.2 28,52.4 Z";
  var CLAW_L = "M24,28.4 C6,16.6 2,34.4 16,42.4";
  var CLAW_R = "M76,28.4 C94,16.6 98,34.4 84,42.4";
  var LEGS = "M30,50.4 L12,60.4 M36,56.4 L22,68.4 M44,60.4 L36,74.4 M52,61.4 L50,76.4 "
           + "M70,50.4 L88,60.4 M64,56.4 L78,68.4 M56,60.4 L64,74.4 M48,61.4 L50,76.4";
  function beast(id, name){
    var s = el("symbol", { id:id, viewBox:"0 0 100 100" });
    s.appendChild(el("path", { "class":"l2", d:CLAW_L }));
    s.appendChild(el("path", { "class":"l2", d:CLAW_R }));
    s.appendChild(el("path", { "class":"l1 f-wood", d:BODY }));
    s.appendChild(el("path", { "class":"l3 miter", d:LEGS }));
    s.appendChild(txt("tx-k", 50, 93, name, { "font-size":15, "text-anchor":"middle" }));
    root.appendChild(s);
  }
  beast("sym_crab", "蟹");
  beast("sym_pq", "彭蜞");
  beast("sym_px", "彭螖");
  function tag(id, ch){
    var s = el("symbol", { id:id, viewBox:"0 0 100 100" });
    s.appendChild(el("path", { "class":"l1 f-wood", d:"M22,16.4 C40,14.8 60,17.2 78,15.6 L78,80.4 C60,82.2 40,79.6 22,81.4 Z" }));
    s.appendChild(txt("tx-k", 50, 62, ch, { "font-size":31, "text-anchor":"middle" }));
    root.appendChild(s);
  }
  tag("sym_lao", "勞");
  tag("sym_liao", "蟧");
}

/* ══ 7. 物品栏 ═══════════════════════════════════════════════════════ */
function give(id){ if(INV.indexOf(id) < 0) INV.push(id); renderInv(); applyArmed(); saveDebounced(); }
function take(id){ var i = INV.indexOf(id); if(i >= 0){ INV.splice(i,1); if(SEL===id) SEL=null; renderInv(); applyArmed(); saveDebounced(); } }
function renderInv(){
  slotsEl.innerHTML = "";
  for(var i=0;i<INV.length;i++){
    var id = INV[i], it = ITEMS[id]; if(!it) continue;
    var d = document.createElement("div");
    d.className = "slot has" + (SEL===id ? " sel" : "");
    d.setAttribute("data-slot", i);
    var box = it.box;
    d.innerHTML = '<svg viewBox="'+box[0]+' '+box[1]+' '+box[2]+' '+box[3]+'" preserveAspectRatio="xMidYMid meet">'
      + '<use href="#'+it.sym+'"/></svg><span class="under"></span>';
    (function(id2){
      d.addEventListener("click", function(e){
        e.stopPropagation();
        if(SEL === id2){ SEL = null; }
        else { SEL = id2;
               if(id2 === "it_tag_lao" || id2 === "it_tag_liao")
                 say("「"+ITEMS[id2].n.replace("字牌 · ","")+"」那一块字牌在手 —— 看它該補到壁上哪一頁。", false, 3000);
               else say("「"+ITEMS[id2].n+"」在手 —— 看它該進哪一隻盆。", false, 3000); }
        renderInv(); applyArmed(); render(); saveDebounced();
      });
    })(id);
    slotsEl.appendChild(d);
  }
}

/* ══ 8. 可用热点加粗（持有物件时立刻加粗 **全部可落之处**）═══════════
   三只盆都是「可落之处」（只是不一定落得合），两頁錄文也是 ——
   所以加粗只说明「這裡可以放」，**不泄露哪一隻才合**。 */
var USE = {
  it_crab:    { view:["sink"], hs:["h_basin_big","h_basin_mid","h_basin_small"] },
  it_pq:      { view:["sink"], hs:["h_basin_big","h_basin_mid","h_basin_small"] },
  it_px:      { view:["sink"], hs:["h_basin_big","h_basin_mid","h_basin_small"] },
  it_tag_lao: { view:["room"], hs:["h_slip_a","h_slip_b"] },
  it_tag_liao:{ view:["room"], hs:["h_slip_a","h_slip_b"] }
};
function applyArmed(){
  document.querySelectorAll(".hs.armed").forEach(function(n){ n.classList.remove("armed"); });
  if(!SEL) return;
  var u = USE[SEL]; if(!u) return;
  if(u.view.indexOf(CAM) < 0) return;
  u.hs.forEach(function(id){
    var n = document.querySelector('.hs[data-hs="'+id+'"]');
    if(n && !n.classList.contains("gone")) n.classList.add("armed");
  });
}

/* ══ 9. 音效（可选；WebAudio 合成，不引音频文件）═══════════════════ */
var AC = null, SND = true;
function sfx(kind){
  if(!SND) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    var f = kind==="wood"?140 : kind==="board"?250 : kind==="stove"?180 : 190;
    o.type = kind==="stove" ? "triangle" : "sine";
    o.frequency.value = f;
    g.gain.value = 0.0001;
    o.connect(g); g.connect(AC.destination);
    g.gain.exponentialRampToValueAtTime(0.06, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+(kind==="stove"?0.50:0.24));
    o.start(t); o.stop(t+(kind==="stove"?0.52:0.26));
  }catch(e){}
}
$("#snd").addEventListener("click", function(e){
  e.stopPropagation(); SND = !SND;
  say(SND ? "聲 · 開" : "聲 · 閉", false, 1200);
  try{ localStorage.setItem("diandangsi.rustylake.settings", JSON.stringify({snd:SND})); }catch(e2){}
});

/* ══ 10. 环境文字（不是题目框）：只指方位，不给内容，不出判语 ════════ */
var capT = null;
function say(t, zhu, ms){
  caption.textContent = t;
  caption.classList.toggle("zhu", !!zhu);
  caption.classList.add("on");
  clearTimeout(capT);
  if(ms !== 0) capT = setTimeout(function(){ caption.classList.remove("on"); }, ms||2600);
}

/* ══ 11. 值房台账（幕间切换的枢纽；与前几幕同一套 .led-*）════════════ */
var LEDGER = true;
function showLedger(on){
  LEDGER = !!on;
  $("#ledger").classList.toggle("on", LEDGER);
  if(LEDGER){ closeBridge(); closePaperQuiet(); }
  if(LEDGER) renderLedger();
  syncModal();
}
function ledgerDone(){
  return [ !!(F.f_crab_taken && F.f_pq_taken && F.f_px_taken),
           !!F.f_two_forms_kept,
           !!(F.f_ssxy_read && F.f_yulan_read && F.f_rule_read) ];
}
function renderLedger(){
  var done = ledgerDone();
  for(var i=0;i<3;i++){
    var dot = document.getElementById("led-dot-"+(i+1));
    var tx  = document.getElementById("led-tx-"+(i+1));
    if(!dot) continue;
    if(done[i]){ dot.setAttribute("fill","var(--zhu)"); dot.setAttribute("r","6"); dot.setAttribute("stroke","none"); }
    else { dot.setAttribute("fill","none"); dot.setAttribute("r","8"); dot.setAttribute("stroke","var(--ink2)"); }
    if(tx) tx.classList.toggle("done", !!done[i]);
  }
  var n = document.getElementById("hs_led_notes");
  if(n) n.classList.toggle("gone", !F.f_act5_done);
  var hint = $("#led-hint");
  if(hint){
    if(F.f_act5_done) hint.textContent = "差事已畢。本廚所治已寫入校勘記 —— 點「取閱校勘記」。";
    else hint.textContent = "廚裡沒有題目 —— 只有一口灶、三隻盆、壁上兩頁錄文、架上的兩部書。";
  }
}

/* ══ 11b. 上层压在场景上时，场景那一层整棵子树都不该再吃鼠标 ═══════════
   收起的簿子只是 opacity:0，它里面的 .hit 与各视图里的 .hit 照样接得住点击 ——
   见样式表「命中（修正）」一节。这里只管一件事：把 .modal 挂上／摘下。
   四处各调一次：showLedger / openBridge / closeBridge / boot。*/
function syncModal(){
  if(!world) return;
  world.classList.toggle("modal", !!(LEDGER || bridgeOpen()));
}

/* ══ 12. 幕间过渡页：把上一幕交下来的东西念一遍 ═════════════════════ */
function openBridge(){
  var host = $("#bridge-lines");
  host.innerHTML = "";
  var lines = [];
  var names = { act1:"校書閣", act2:"熔銅作", act3:"校書堂", act4:"書庫走廊" };
  var ids = ["act1","act2","act3","act4"];
  var got = [], i;
  for(i=0;i<ids.length;i++){
    if(prevDone(ids[i]) || prevHas("f_" + ids[i] + "_done")) got.push(ids[i]);
  }
  var n = got.length;
  lines.push("上一班在值房交下來的話：");
  lines.push("");
  if(n === 4){
    lines.push("· 校書閣、熔銅作、校書堂、書庫走廊 —— 四幕的校勘記都在冊上。");
    lines.push("  上一班留下的一句話：「無徵不信，兩存不強合。」");
    lines.push("  上一幕數的是券上的字；這一廚，分的是三隻盆。");
  }else if(n > 0){
    var nm = [];
    for(i=0;i<n;i++) nm.push(names[got[i]]);
    lines.push("· 上一班只交下來一半 —— 收了束的 " + n + " 幕：");
    lines.push("　" + nm.join("、") + "。");
    lines.push("  沒辦完的還在原處，不催；校勘記從記得下的地方接着記。");
  }else if(PREV){
    lines.push("· 值房裡有存檔，但四幕的差事都沒有收束。");
    lines.push("  本班照實從膳房這一頁開始記，不替上一班認帳。");
  }else{
    lines.push("· 值房裡沒有上一班的存檔 —— 這是第一班進膳房。");
    lines.push("  校勘記從本幕這一頁開始記。");
  }
  lines.push("");
  lines.push("本班的差事（三件）：");
  lines.push("一、三物各異而形相類 —— 按大小分置三盆，各記一名。");
  lines.push("二、壁上兩頁各缺一字 —— 取字牌補回本頁，兩存不合。");
  lines.push("三、所引之書 —— 取架上《世説新語》《太平御覽》兩部校之。");
  var reads = [];
  if(prevRead("p_ly5a")||prevRead("p_ly5b")||prevRead("p_ly1")) reads.push("《洛陽伽藍記》");
  if(prevRead("p_yanshi")||prevRead("p_zheng")) reads.push("《顏氏家訓》");
  if(prevRead("p_q_a")||prevRead("p_q_b")||prevRead("p_q_c")) reads.push("券文三紙");
  if(prevRead("p_jia")||prevRead("p_yi")) reads.push("《茶經》殘頁");
  if(reads.length){
    lines.push("");
    lines.push("（上一班翻過的書還攤在原處：");
    lines.push("　" + reads.join("") + "。）");
  }
  var y = 228;
  for(i=0;i<lines.length;i++){
    var t = el("text",{ "class":"br-body", x:372, y:y });
    t.textContent = lines[i];
    host.appendChild(t);
    y += (lines[i] === "" ? 10 : 26);
  }
  $("#bridge").classList.add("on");
  syncModal();
  F.f_bridge_read = true; saveDebounced();
}
function closeBridge(){ $("#bridge").classList.remove("on"); syncModal(); }
function bridgeOpen(){ return $("#bridge").classList.contains("on"); }

/* ══ 13. 纸：在场景内展开（两部书 / 體例 / 兩頁錄文 / 校勘记）══════════
   本幕的每一句引文都已在 2026-10-16 在本班沙箱内**逐字比对命中**并记下 HTTP 状态；
   逐条 URL 与状态见《校勘记》十九–二十二 与实现说明 §17.9。 */
var PAPER_OPEN = null;
function wrap(s, n){ var out = [], i; for(i=0;i<s.length;i+=n) out.push(s.slice(i,i+n)); return out; }
var PAPERS = {
  p_rule: { t:"壁上 · 膳房體例", s:"本幕自撰（非古籍引文）",

  paperLayer.innerHTML = "";

  g.appendChild(el("path",{ "class":"l1 f-card",

  g.appendChild(txt("paper-sub", W/2, 76, P.s, { "text-anchor":"middle" }));
  var y = 130;
  for(var i=0;i<P.body.length;i++){
    var lines = wrap(P.body[i], 32);
    for(var j=0;j<lines.length;j++){
      var tx = el("text",{ "class":"paper-body", x:48, y:y });
      var seg = lines[j], marks = [], cur = 0;
      P.keys.forEach(function(k){ var idx=0,p; while((p=seg.indexOf(k,idx))>=0){ marks.push([p,p+k.length]); idx=p+1; } });
      marks.sort(function(a,b){ return a[0]-b[0]; });
      marks.forEach(function(m){
        if(m[0] < cur) return;
        if(m[0] > cur){ var n1 = el("tspan"); n1.textContent = seg.slice(cur,m[0]); tx.appendChild(n1); }
        var sp = el("tspan"); sp.setAttribute("class","key"); sp.textContent = seg.slice(m[0],m[1]); tx.appendChild(sp);
        cur = m[1];
      });

      g.appendChild(tx); y += 25;

  g.addEventListener("click", function(ev){ ev.stopPropagation(); closePaper(); });

  render(); saveDebounced();
}

  STAND[b.id] = 0; hold(b.id); F[b.fk] = true; sfx("tag");

function basin(which){
  var m = BASIN[which];
  if(F[m.k]){
    /* 已記了名的盆：再點＝把物取回來（同一格两用，所以不会锁死、可反复搬）*/
    if(INV.indexOf(m.id) >= 0){
      SEL = m.id; renderInv(); applyArmed(); render();
      say("這一盆裡的物已在手邊 —— 三隻盆都要對上大小。", false, 3200);

};
var hintUsed = {}, lastHint = 0;
function hint(){
  var now = Date.now();
  if(now - lastHint < 180000) return;
  var order;
  if(!F.f_ssxy_read || !F.f_yulan_read) order = ["books","sizes","forms"];
  else if(!F.f_two_forms_kept) order = ["forms","stove"];
  else if(!F.f_three_sorted) order = ["sizes","basins"];
  else order = ["stove","books"];
  for(var i=0;i<order.length;i++){
    var k = order[i];
    if(hintUsed[k]) continue;
    hintUsed[k] = 1; lastHint = now;
    say(HINTS[k], false, 4200);
    return;
  }
}
var idleT = null;
function pokeIdle(){ clearTimeout(idleT); idleT = setTimeout(hint, 90000); }
document.addEventListener("mousemove", pokeIdle, {passive:true});
document.addEventListener("keydown", pokeIdle);

/* ══ 20. 启动 ═══════════════════════════════════════════════════════ */
function boot(){
  buildSymbols();
  var restored = false;
  var AUTO = (location.hash.match(/auto=([a-z0-9]+)/i)||[])[1];
  var FRESH = /fresh/.test(location.hash);
  if(AUTO || FRESH){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} resetState(); }
  else restored = load();
  if(!restored) resetState();
  F.f_seen_act5 = true;
  render();
  setCam(CAM || "room");
  /* 起手 #ledger 就是 class="on" —— 这里必须主动同步一次 .modal，
     否则底下那些看不见的热点照旧接得住点击（附录 A.4 特别点名 boot() 这一次）。*/
  syncModal();
  if(AUTO){ showLedger(true); }
  /* 截图探针（仅 ?probe= 时生效）：只摆 flags 与相机，不跳过任何交互分支 */
  var PROBE = (location.search.match(/[?&]probe=([a-z0-9]+)/i)||[])[1];
  if(/[?&]still=1/.test(location.search)){
    var st = document.createElement("style");
    st.textContent = "*{transition-duration:0s!important;animation-delay:0s!important}";
    document.head.appendChild(st);
  }
  function showRoom(){ showLedger(false); F.f_seen_act5 = true; setCam("room"); render(); }
  function showSink(){ showLedger(false); setCam("sink"); render(); }
  function readAll(){
    F.f_rule_read = true; F.f_ssxy_read = true; F.f_yulan_read = true;
    F.f_slip_a_read = true; F.f_slip_b_read = true;
  }
  function chainTwo(){
    readAll();
    F.f_tag_lao_taken = true; F.f_tag_liao_taken = true;
    F.f_slip_a_filled = true; F.f_slip_b_filled = true; F.f_two_forms_kept = true;
  }
  function chainOne(){
    readAll();
    F.f_crab_taken = true; F.f_pq_taken = true; F.f_px_taken = true;
    F.f_basin_big_set = true; F.f_basin_mid_set = true; F.f_basin_small_set = true;
    F.f_three_sorted = true;
    STAND = { it_crab:0, it_pq:0, it_px:0 };
  }
  if(PROBE){
    if(PROBE === "room"){ showRoom(); }
    else if(PROBE === "sink"){ showSink(); }
    else if(PROBE === "rule"){ showRoom(); showPaper("p_rule"); }
    else if(PROBE === "ssxy"){ showRoom(); showPaper("p_ssxy"); }
    else if(PROBE === "yulan"){ showRoom(); showPaper("p_yulan"); }
    else if(PROBE === "slipa"){ showRoom(); showPaper("p_slip_a"); }
    else if(PROBE === "slipb"){ showRoom(); showPaper("p_slip_b"); }
    else if(PROBE === "bridge"){ showRoom(); openBridge(); }
    else if(PROBE === "bridgefull"){ load(); render(); setCam("room"); showLedger(false); openBridge(); }
    else if(PROBE === "filled"){ chainTwo(); showRoom(); }
    else if(PROBE === "sorted"){ chainOne(); showSink(); }
    else if(PROBE === "done"){
      chainTwo(); chainOne(); F.f_stove_shut = true; F.f_act5_done = true; showRoom();
    }
    else if(PROBE === "notes"){
      chainTwo(); chainOne(); F.f_stove_shut = true; F.f_act5_done = true;
      showRoom(); showNotes();
    }
  }
  requestAnimationFrame(function(){ $("#boot").classList.add("gone"); });
  pokeIdle();
  if(AUTO) runAuto(AUTO);
  else if(restored) say("接着上次的地方。", false, 2400);
}

/* ══ 21. 自动走通：清档重来 + 只用真实 MouseEvent('click') 打真实 .hit ══
   脚本**不直接改任何 flag**：三物的分置靠「取物 → 放盆」自然成立，
   兩頁的補字靠「取字牌 → 補回本頁」自然成立，收束靠「掩灶門」自然成立 ——
   runAuto 里没有一处 F.xxx = true。 */
function click(hsId){
  var n = document.querySelector('.hs[data-hs="'+hsId+'"]');
  if(!n) return false;
  if(n.classList.contains("gone")) return false;
  var hit = n.querySelector(".hit") || n;
  if(!inActiveView(n)) return false;
  hit.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function clickEl(sel){
  var n = document.querySelector(sel);
  if(!n) return false;
  n.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function w(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function slotOf(itemId){
  var i = INV.indexOf(itemId); if(i < 0) return null;
  return document.querySelector('.slot[data-slot="'+i+'"]');
}
function pickSlot(itemId){
  if(SEL === itemId) return true;      /* 已選中的就不再點一次（否則會取消選中）*/
  var s = slotOf(itemId); if(!s) return false;
  s.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return SEL === itemId;
}
async function runAuto(stop){

      + " || STAND[" + STAND.it_crab + STAND.it_pq + STAND.it_px + "]"

      + " || DONE[" + DONE.join(",") + "]";

  }
  try{
    if(stop === "ledger"){ step("停在值房台賬", LEDGER); report(); return; }

    step("6_讀錄文一", click("h_slip_a")); await w(300); closePaper(); await w(140);
    step("7_讀錄文二", click("h_slip_b")); await w(300); closePaper(); await w(140);
    step("8_五處已讀", !!(F.f_rule_read && F.f_ssxy_read && F.f_yulan_read && F.f_slip_a_read && F.f_slip_b_read));
    /* ── 錯法一：兩鏈未齊就掩灶門（門在框上磕兩下、敞着不動，可立即重放）── */

    /* ── 開台账 → 校勘记 ───────────────────────────────────── */
    step("32_開台賬", (function(){ clickEl("#bk"); return LEDGER; })()); await w(380);
    step("33_校勘記", (function(){ click("h_ledger_notes"); return PAPER_OPEN === "__notes"; })()); await w(460);
    if(stop === "notes"){ report(); return; }
    closePaper(); await w(240);
    step("34_再入廚", click("h_ledger_enter")); await w(380);
    step("35_收束_本幕已畢", !!F.f_act5_done);
  }catch(err){ log.push("ERR=" + (err && err.message)); }
  report();
}

window.__dd = { F:function(){ return F; }, INV:function(){ return INV; }, DONE:function(){ return DONE; },
  CAM:function(){ return CAM; }, STAND:function(){ return STAND; }, click:click, setCam:setCam,
  auto:runAuto, shutStove:shutStove, inActiveView:inActiveView,
  state:function(){ return {F:F, INV:INV, CAM:CAM, SEL:SEL, DONE:DONE, READ:READ, STAND:STAND}; } };

window.render = render;

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
})();
