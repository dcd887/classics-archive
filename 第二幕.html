<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>典藏司 · 熔銅作 · 第二幕</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" href="favicon.ico">
<link rel="icon" href="favicon.ico">
<link rel="icon" href="favicon.ico">
<style>
  /* ══ 色板：与第一幕逐字相同 —— 现有成品 dist/index.html 第 9–11 行的 9 个 token，
        不新增第 8 色。本幕实机取值个数与第一幕同为 8 ══ */
  :root{
    --paper:#f3ecdf; --paper2:#eae1d0; --card:#faf6ec;
    --ink:#2a2622; --ink2:#5c554b; --faint:#8d8577;
    --zhu:#a63a2a; --line:#d3c8b4; --line2:#c0b49d;
    --l1:2.2px; --l2:1.4px; --l3:0.9px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Songti SC","STSong",Georgia,"Noto Serif SC",serif;
    display:flex; align-items:center; justify-content:center; padding:10px;
  }
  /* ══ 窗口自适应（宽 + 高，模板附录 A.2 · 坑 23）══════════════════════════
     舞台恒为 1200:720。宽度同时受三个上界约束：视窗宽、设计宽 1200、以及
     「视窗高 − 台账 64 − 上下留白 20 − 余量 4」换算过来的宽；三者取最小。
     旧版只写 min(97vw,1200px)：窗口一矮，舞台仍按 1200 宽撑到 720 高，加上
     台账 64 就超出视窗，body 又用 align-items:center 居中 → 上下被切。
     实测视口 1214×707 时旧值舞台 top = −60、并出现纵向滚动条；此即修因。 */
  #app{width:min(100%,1200px,calc((100vh - 88px) * 1.66667));display:flex;flex-direction:column;min-height:0}
  #stage{display:block;width:100%;height:auto;aspect-ratio:1200/720;background:var(--paper);overflow:hidden}
  #hud{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:14px;
       background:var(--paper);border-top:1px solid var(--line2);padding:0 6px}
  #slots{display:flex;gap:4px}
  .slot{width:56px;height:56px;border:1px solid transparent;position:relative;cursor:default}
  .slot .under{position:absolute;left:8px;right:8px;bottom:6px;height:1px;background:var(--line2)}
  .slot svg{display:block;width:52px;height:52px;margin:1px;transition:transform 120ms ease}
  .slot.has{cursor:pointer}
  .slot.sel{border-color:var(--zhu)}
  .slot.sel svg{transform:translateY(-2px)}
  #caption{margin-left:auto;margin-right:8px;max-width:62%;
           font-family:"Kaiti SC","STKaiti","KaiTi",serif;
           font-size:13px;line-height:1.6;color:var(--ink2);text-align:right;
           opacity:0;transition:opacity 500ms ease}
  #caption.on{opacity:1}
  #caption.zhu{color:var(--zhu)}

  /* ══ 线宽三级（与第一幕同值；vector-effect 保证跨视图/跨缩放不漂移）══ */
  .l1{stroke:var(--ink);stroke-width:var(--l1);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l2{stroke:var(--ink2);stroke-width:var(--l2);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l3{stroke:var(--faint);stroke-width:var(--l3);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .miter{stroke-linejoin:miter}
  .f-wood{fill:#b9a88c}
  .f-card{fill:var(--card)}
  .f-zhu{fill:var(--zhu)}
  .f-bronze{fill:#b9a88c}
  .tx{fill:var(--ink);font-family:"Songti SC","STSong",Georgia,serif}
  .tx-k{fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .tx-z{fill:var(--zhu);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  /* 接触影：贴底 8% 墨、无方向性、每处只有一层。影子永不接鼠标 —— 它画在
     所有热点之后，否则「地上那四件」的中心点会被自己脚下那道影子接走。 */
  .shadow{fill:var(--ink);opacity:.08;stroke:none;pointer-events:none}
  .ns *{vector-effect:non-scaling-stroke}

  /* ══ 视图切换 ══ */
  .view{opacity:0;pointer-events:none;transition:opacity 500ms ease}
  .view.active{opacity:1;pointer-events:auto}

  /* ══ 命中（修正 2026-10-17 · 模板附录 A.4）══════════════════════════════
     【原本的病灶】下面那句 .hs .hit{pointer-events:all} 是「显式值」，会盖掉
     祖先 .view{pointer-events:none} / #ledger:not(.on) / #bridge:not(.on) 的
     继承；而 opacity:0 的元素照常参与命中测试。于是看不见的层仍然接得住鼠标，
     而且文档顺序在后、画在上面 —— 真人点下去，命中的是「别人家的透明矩形」。
     【修法】不动任何 .hit 的既有写法（自测仍走同一条路），只把非活动层整棵
     子树用 !important 钉死；并在 showLedger / openBridge / closeBridge / boot
     各调一次 syncModal()（#world 挂 .modal 时，底下场景整棵子树也不收鼠标）。*/
  .view:not(.active), .view:not(.active) *,
  #ledger:not(.on),   #ledger:not(.on) *,
  #bridge:not(.on),   #bridge:not(.on) *,
  .paper:not(.show),  .paper:not(.show) *{pointer-events:none!important}
  #world.modal .view, #world.modal .view *{pointer-events:none!important}
  /* 展开中的纸页自己吃鼠标；未展开时连这一层都不接（见上一条） */
  #paper-layer{pointer-events:none}
  #paper-layer .paper.show{pointer-events:auto}

  /* ══ 热点：默认 / 可点 / 已取 三态光标 ══ */
  .hs{cursor:default}
  .hs .hit{fill:transparent;stroke:none;pointer-events:all}
  .hs.on .hit{cursor:pointer}
  .hs.on:hover .art path,.hs.on:hover .art rect,.hs.on:hover .art circle,
  .hs.on:hover .art ellipse,.hs.on:hover .art line,.hs.on:hover .art polygon{stroke:var(--zhu);stroke-width:3}
  .hs.armed .art path,.hs.armed .art rect,.hs.armed .art circle,
  .hs.armed .art ellipse,.hs.armed .art line,.hs.armed .art polygon{stroke:var(--zhu);stroke-width:3}
  .hs.on:hover .art .scenery path,.hs.on:hover .art .scenery circle,
  .hs.on:hover .art .scenery ellipse{stroke:var(--faint);stroke-width:var(--l3)}
  .hs.gone, .hs.gone *{pointer-events:none}
  .hs.gone .art{opacity:0}
  .hs.breathe .art *{stroke:var(--zhu)!important;animation:breathe 1.2s ease-in-out 2}
  @keyframes breathe{0%,100%{stroke-opacity:1}50%{stroke-opacity:.4}}

  /* ══ 视角规格（§十二）：轻斜投影 屏幕坐标 = 正面坐标 + 深度·(0,−0.5) ══
     水平面用一个「有厚度的小矩形面」表达；进深线只走结构方向，不画纹理。
     水平面专用 4 条短 L3 进深线，不画任何纹样、不画木纹、不画锤痕。 */
  .floor{fill:var(--paper2);stroke:none}
  .slab{fill:var(--card);stroke:none}
  .recess{fill:var(--paper2);stroke:none}
  .water{fill:var(--card);stroke:none}
  #view-right .slab{fill:var(--paper2)}

  /* ══ 世界变化 ① 炉膛：炉门（一块竖直面）向下滑开 30px，膛底进深面淡入 ══ */
  #furnace-door{transform:translateY(0);transition:transform 620ms cubic-bezier(.2,.8,.2,1)}
  #furnace.open #furnace-door{transform:translateY(30px)}
  #furnace .fur-cavity{opacity:0;transition:opacity 300ms ease 320ms}
  #furnace.open .fur-cavity{opacity:1}
  #furnace .ember{opacity:0;transition:opacity 400ms ease 420ms}
  #furnace.open .ember{opacity:1}

  /* ══ 世界变化 ② 铸案：两只范槽的槽底是水平小面，放入后由 .filled 亮起 ══ */
  .slot-face{fill:var(--paper2);stroke:none;opacity:1;transition:opacity 240ms ease}
  .slot-glow{fill:var(--zhu);opacity:0;transition:opacity 300ms ease}
  .hs.filled .slot-glow{opacity:.10}
  .hs.filled .slot-edge{stroke:var(--ink);stroke-width:var(--l2)}

  /* ══ 入范：铜块落到槽底（下沉 6px），落定后留在槽里 ══ */
  @keyframes seatdown{0%{transform:translateY(-10px);opacity:.2}60%{transform:translateY(1px);opacity:1}100%{transform:translateY(0);opacity:1}}
  .seating{animation:seatdown 260ms cubic-bezier(.3,.9,.3,1.2) 1 forwards}

  /* ══ 弹回：放错的东西沿原路滑回原位（可复原、不锁死）══ */
  @keyframes bounceback{
    0%{transform:translate(0,0) rotate(0deg);opacity:1}
    55%{transform:translate(calc(var(--bx)*.6),calc(var(--by)*.45)) rotate(-6deg);opacity:1}
    100%{transform:translate(var(--bx),var(--by)) rotate(-12deg);opacity:0}
  }
  .bouncing{animation:bounceback 520ms ease-in forwards;pointer-events:none}
  @keyframes shakeslot{0%,100%{transform:translateX(0)}35%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
  .shakeslot{animation:shakeslot 120ms ease-in-out 2}

  /* ══ 入炉：合格的一块滑进炉门（可复原：回炉前它一直在炉口）══ */
  @keyframes intofire{
    0%{transform:translate(0,0);opacity:1}
    70%{transform:translate(calc(var(--fx)*.8),calc(var(--fy)*.75));opacity:1}
    100%{transform:translate(var(--fx),var(--fy));opacity:0}
  }
  .intofire{animation:intofire 620ms ease-in forwards;pointer-events:none}

  /* ══ 炉口火光呼吸（唯一会动的光源；不做火苗形状）══ */
  @keyframes ember{0%,100%{opacity:.92}50%{opacity:.6}}
  #ember-halo{opacity:0;transition:opacity 500ms ease}
  #furnace.open #ember-halo{opacity:1;animation:ember 3.1s ease-in-out infinite}

  /* ══ 墙上指印（挂错累到 3 次才出现，一块 12% 朱砂）══ */
  #prints{opacity:0;transition:opacity 260ms ease}
  #prints.show{opacity:1}

  /* ══ 纸（在场景内放大展开，不切屏、不加暗底遮罩）══ */
  .paper{opacity:0;pointer-events:none;transition:opacity 260ms ease}
  .paper.show{opacity:1;pointer-events:auto}
  .paper-title{font-size:21px;fill:var(--ink);letter-spacing:.18em}
  .paper-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  .paper-body{font-size:17px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.02em}
  .paper-body .key{font-size:19px}
  .paper-close{font-size:12px;fill:var(--faint);letter-spacing:.08em}

  /* ══ 外壳：典藏司「值房台账」（与第一幕同一套，外加一幕间过渡页）══ */
  #ledger{opacity:0;pointer-events:none;transition:opacity 420ms ease}
  #ledger.on{opacity:1;pointer-events:auto}
  .led-lede{font-size:26px;fill:var(--ink);letter-spacing:.22em}
  .led-sub{font-size:13px;fill:var(--faint);letter-spacing:.12em}
  .led-item{font-size:19px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.04em}
  .led-item.done{fill:var(--faint)}
  .led-act{font-size:21px;fill:var(--ink);letter-spacing:.2em}
  .led-hint{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  /* 幕间过渡页：上一幕交下来的话，一页纸，读完再进 */
  #bridge{opacity:0;pointer-events:none;transition:opacity 380ms ease}
  #bridge.on{opacity:1;pointer-events:auto}
  .br-lede{font-size:22px;fill:var(--ink);letter-spacing:.2em}
  .br-body{font-size:16px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .br-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}

  .slotslot svg{overflow:visible}
  #boot{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;
        justify-content:center;font-size:15px;color:var(--ink2);letter-spacing:.3em;z-index:9}
  #boot.gone{display:none}

  /* v0.20.13 手机端可读性：1200x720 舞台等比缩放后字太小，竖屏时给一条提示（不改玩法） */
  @media (max-width: 760px) and (orientation: portrait) {
    body::before {
      content: "建议横屏或使用电脑游玩，字体更清晰";
      position: fixed; left: 0; right: 0; top: 0; z-index: 9999;
      padding: 6px 8px; text-align: center;
      background: #a63a2a; color: #f3ecdf; font-size: 12px; letter-spacing: .04em;
    }
    body { padding-top: 26px; }
  }
</style>
<script src="_selftest/live.js" defer></script>

<body>

<div id="boot">熔銅作</div>

<div id="app">
  <svg id="stage" viewBox="0 0 1200 720" shape-rendering="geometricPrecision"
       xmlns="http://www.w3.org/2000/svg" role="application" aria-label="典藏司熔銅作 第二幕">
    <defs>
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
      </filter>
    </defs>
    <rect x="0" y="0" width="1200" height="720" fill="var(--paper)"/>
    <g id="world">

      <!-- ══════════════════ view-room ══════════════════
           视角：与第一幕同一台虚拟相机、同一斜率 k=0.5（§十二）。
           本场景深度预算：地面随画面裁切 / 炉底进深 20 / 案面进深 60 /
           范槽进深 12 / 水盆水面进深 30 / 水盆外沿进深 90。全部 ≤ 80。 -->
      <g id="view-room" class="view active">
        <!-- ① 地面（水平面）：远边在墙脚 y≈631，近边落在画面之外 -->
        <path class="floor" d="M42,630.4 C300,629.6 700,631.2 1158,628.6 L1158,726 L42,726 Z"/>
        <path class="l3 miter" d="M150,700 C400,698.6 800,701 1086,698.8"/>
        <path class="l3 miter" d="M1136,646 C1137.2,678 1136.4,700 1137,718"/>
        <path class="l3 miter" d="M62,646 C61,678 61.8,700 61,718"/>
        <!-- ② 墙脚交界（墙与地的那一笔）：家具压其上，只在空处露头 -->
        <path class="l2" d="M42,630.6 C300,628.8 700,631.4 1158,629.6"/>

        <!-- B′ 檐梁（一根旧木横梁，横贯后墙上沿） -->
        <g class="scenery">
          <path class="l1 f-wood" d="M64,44.4 C420,42.6 800,45.2 1138,43.6 L1139,77.4 C800,79.2 420,76.6 64,78.4 Z"/>
          <path class="l3" d="M64,61.4 C420,59.6 800,62.2 1138,60.6"/>
        </g>

        <!-- B 風管（陶管自炉口引向左墙；两段 + 一道接缝） -->
        <g class="hs on" data-hs="h_duct">
          <rect class="hit" x="388" y="140" width="124" height="84"/>
          <g class="art">
            <path class="l1 f-card" d="M392,166.4 C428,164.6 466,167.2 502,165.6 L503,182.4 C466,184.2 428,181.6 392,183.4 Z"/>
            <path class="l2" d="M446,166 L446,183"/>
            <path class="l3 miter" d="M404,167 L404,183 M486,166.4 L486,182.4"/>
          </g>
        </g>

        <!-- D 墙上木签 · 上半段的载体（链①「翻书可查」的第一处） -->
        <g class="hs on" data-hs="h_ledge_a">
          <rect class="hit" x="560" y="120" width="136" height="120"/>
          <g class="art">
            <path class="l1 f-card" d="M566,128.4 L688,126.6 L689,232.4 L567,234.2 Z"/>
            <path class="l3" d="M578,146 L676,146 M578,164 L660,164 M578,182 L676,182 M578,200 L644,200"/>
            <path class="l2" d="M628,234 L628,250"/>
            <circle class="l2" cx="628" cy="256" r="5" fill="none"/>
          </g>
        </g>
        <!-- D′ 墙上木签 · 第二支（取下后是残卷下半段） -->
        <g class="hs on" data-hs="h_ledge_b">
          <rect class="hit" x="690" y="282" width="136" height="120"/>
          <g class="art">
            <path class="l1 f-card" d="M696,290.4 L818,288.6 L819,394.4 L697,396.2 Z"/>
            <path class="l3" d="M708,308 L806,308 M708,326 L790,326 M708,344 L806,344"/>
            <path class="l2" d="M758,396 L758,412"/>
            <circle class="l2" cx="758" cy="418" r="5" fill="none"/>
          </g>
        </g>

        <!-- D′ 墙上纸条 · 本作的三句体例（环境物件，不是题目框）—— 挪到右下墙，
             避开左下的炉口与右上的高柜 -->
        <g class="hs on" data-hs="h_rule">
          <rect class="hit" x="872" y="176" width="252" height="94"/>
          <g class="art">
            <path class="l1 f-card" d="M878,182.4 C956,180.8 1040,183.2 1108,181.6 L1109,264.4 C1040,266.2 956,263.6 878,265.4 Z"/>
            <path class="l3" style="stroke:var(--zhu)" d="M892,200 L1092,200 M892,220 L1040,220 M892,240 L1000,240"/>
          </g>
        </g>

        <!-- E 高柜（内有本作残卷可查）—— 挪到最右，与左下角的水火之器彻底分开
             （上一版柜门与水盆叠在一起，读起来像「柜子里放着一只盆」）。
             柜体在地面带上，不与任何器物共用像素。 -->
        <g class="hs on" data-hs="h_cabinet">
          <rect class="hit" x="974" y="296" width="208" height="326"/>
          <g class="art">
            <path class="l1 f-wood" d="M988,300.4 C1046,298.6 1110,301.2 1150,299.6 L1152,620.4 C1110,622.2 1046,619.6 988,621.4 Z"/>
            <path class="l1 miter" d="M1004,320.4 C1046,318.8 1110,321.2 1132,319.6 L1134,602.4 C1110,604.2 1046,601.6 1004,603.4 Z"/>
            <path class="l2" d="M1068,320 L1068,602"/>
            <circle class="l2" cx="1054" cy="440" r="5" fill="none"/>
            <circle class="l2" cx="1082" cy="440" r="5" fill="none"/>
            <path class="l2" d="M1042,428 L1042,452 M1094,428 L1094,452"/>
          </g>
        </g>

        <!-- A 熔爐（焦点之一：全場唯一有「膛口进深」的器物）
             口面 = 水平小面（椭圆，2:1），口沿内一圈 → 膛内后壁 → 膛底；
             炉门是一块竖直面，向下滑开 30px 才看得见膛底与炉火。 -->
        <g id="furnace" class="hs on" data-hs="h_furnace">
          <rect class="hit" x="122" y="234" width="252" height="412"/>
          <g class="art">
            <!-- 炉身（圆筒正面）：x 130–356、y 254–624 -->
            <path class="l1 f-wood" d="M192,254 C154,266 130,320 130,392 C130,520 154,598 192,624
              L294,624 C332,598 356,520 356,392 C356,320 332,266 294,254 Z"/>
            <!-- 口面（水平面）：一块 2:1 的椭圆小面，外沿 L1、口沿 L2 -->
            <ellipse class="floor" cx="243" cy="256" rx="50" ry="25"/>
            <ellipse class="l1" cx="243" cy="256" rx="50" ry="25" fill="none"/>
            <ellipse class="l2" cx="243" cy="256" rx="35" ry="17.5" fill="none"/>
            <!-- 膛内（后壁 + 膛底进深线）：炉门向下滑开后才淡入 -->
            <g class="fur-cavity">
              <path class="recess" d="M208,258 C226,247 260,247 278,258 L278,284 C260,295 226,295 208,284 Z"/>
              <path class="l2 miter" d="M208,258 L208,284 M278,258 L278,284 M208,284 C226,295 260,295 278,284"/>
              <path class="l3 miter" d="M224,262 L224,288 M262,262 L262,288"/>
            </g>
            <!-- 炉门（竖直面）：向下滑开 30px -->
            <g id="furnace-door">
              <path class="l1 f-card" d="M190,300.4 C222,298.6 262,301.2 296,299.6 L297,366.4 C262,368.2 222,365.6 190,367.4 Z"/>
              <path class="l2" d="M216,316 C236,314.6 260,317 282,315.6"/>
              <path class="l3" d="M202,340 L284,340 M202,356 L270,356"/>
            </g>
            <!-- 炉火（只是一圈朱砂透明度，不画火苗形状） -->

<script>
"use strict";
(function(){

/* ══ 0. 存档：与第一幕同一把钥匙、同一结构（幕间协议 §1.3）════════════
   第一幕写：{f, inv, read, cam, ts}
   第二幕写：同一把钥匙 + 同一结构 + 三个「逐幕累积」字段（只加不改）：
     act   本幕幕号（整数）
     done  已收束的幕（字符串数组，幂等）
     notes 《校勘记》追加日志（只增不改；正文仍由 flags 现算）
   → 跨幕累积不需要迁移脚本；上一幕的 f 键原样保留。 */
var SAVE_KEY = "diandangsi.rustylake.v1";
var NOTES_KEY = "diandangsi.rustylake.v1.notes";
var ACT_NO = 2, ACT_ID = "act2";

/* ══ 1. 值房台账 → 熔铜作：上一幕留下的痕迹（跨幕累积的读入侧）════════
   本幕开场先读上一幕的存档：读过哪些页、办完几件差事，决定过渡页上
   写哪几句。读不到（第一次玩本幕）就按「未办」显示 —— 不假装办过。 */
var PREV = (function(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    var o = JSON.parse(raw);
    if(!o || !o.f) return null;
    return o;
  }catch(e){ return null; }
})();
function prevHas(k){ return !!(PREV && PREV.f && PREV.f[k]); }
function prevRead(k){ return !!(PREV && PREV.read && PREV.read.indexOf(k) >= 0); }

/* ══ 2. flags ═══════════════════════════════════════════════════════ */
var FLAG_KEYS = [
  "f_seen_act2","f_ledge_a_read","f_ledge_b_read","f_rule_read","f_cabinet_open",
  "f_vol_read","f_bridge_read",
  "f_g_grave_out","f_g_hairpin_out","f_g_lav_out","f_chain1_done",
  "f_furnace_open","f_cu_convex_taken","f_cu_concave_taken",
  "f_cu_convex_in","f_cu_concave_in","f_chain2_done",
  "f_scrap2_taken","f_act2_done","f_side_duct","f_side_a_mark","f_side_b_mark",
  "f_side_ladle","f_side_slag"
];
var F = {}, INV = [], READ = [], SEL = null, CAM = "room";

function resetState(){
  F = {}; FLAG_KEYS.forEach(function(k){ F[k]=false; });
  F.f_misplaced_count = 0;      /* 与第一幕同名同义：放错的次数 */
  INV = []; READ = []; SEL = null; CAM = "room";
}

/* ══ 3. 存读档（幕间协议 §1.3：只加字段，不改字段语义，不改键名）══════ */
var saveT = null;
/* done / notes 的读入：从上一幕写下的存档里承接（只读，丢了就空数组） */
var DONE = (PREV && PREV.done && PREV.done.slice) ? PREV.done.slice() : [];
var NOTE_LOG = (PREV && PREV.notes && PREV.notes.slice) ? PREV.notes.slice() : [];
function markActDone(){
  if(F.f_act2_done && DONE.indexOf(ACT_ID) < 0) DONE.push(ACT_ID);
}
function appendNotes(){
  /* 把本幕已成立的条目追加进 notes 日志（幂等：同一条不重复追加） */
  var es = noteEntries();
  for(var i=0;i<es.length;i++){
    var key = ACT_NO + "|" + es[i].h;
    var has = false;
    for(var j=0;j<NOTE_LOG.length;j++){ if(NOTE_LOG[j].key === key){ has = true; break; } }
    if(!has) NOTE_LOG.push({ key:key, act:ACT_NO, h:es[i].h, l:es[i].l });
  }
}
function saveNow(){
  try{
    markActDone(); appendNotes();
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      f:F, inv:INV, read:READ, cam:CAM, ts:Date.now(),
      act:ACT_NO, done:DONE, notes:NOTE_LOG
    }));
  }catch(e){}
}
function saveDebounced(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 300); }
function load(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    var o = JSON.parse(raw);
    if(!o || !o.f) return false;
    FLAG_KEYS.forEach(function(k){ if(k in o.f) F[k]=o.f[k]; });
    if(typeof o.f.f_misplaced_count === "number") F.f_misplaced_count = o.f.f_misplaced_count;
    INV = o.inv || []; READ = o.read || []; CAM = o.cam || "room";
    return true;
  }catch(e){ return false; }
}

/* ══ 4. DOM ═════════════════════════════════════════════════════════ */
var $ = function(s){ return document.querySelector(s); };
var stage = $("#stage"), world = $("#world"), paperLayer = $("#paper-layer");
var caption = $("#caption"), slotsEl = $("#slots");
function el(tag, attrs){ var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if(attrs) for(var k in attrs) n.setAttribute(k, attrs[k]); return n; }
function mkPath(cls, d){ return el("path", { "class":cls, d:d }); }

/* ══ 5. 场景代号 → 视图名（本幕只有主视图 + 炉膛近景两个视图）═════════ */
function setCam(which){
  CAM = which;
  world.dataset.cam = which;
  document.querySelectorAll(".view").forEach(function(v){
    v.classList.toggle("active", v.id === "view-" + which);
  });
  applyArmed();
}
function goRoom(){ setCam("room"); }

/* ══ 6. 物件表 ═══════════════════════════════════════════════════════ */
var ITEMS = {
  it_cu_convex: { n:"凸起的一塊", sym:"sym_cu_convex", box:[-4,10,108,84] },
  it_cu_concave:{ n:"凹陷的一塊", sym:"sym_cu_concave", box:[-4,10,108,84] },
  it_scrap2:    { n:"殘卷下半段", sym:"sym_scrap2", box:[-6,16,112,72] }
};

/* ══ 7. 物品栏 symbol（自带表现属性，不依赖文档 CSS 进 shadow tree）═══ */
function buildSymbols(){
  var root = $("#symroot");
  function sym(id, kids){
    var s = el("symbol", { id:id, viewBox:"0 0 100 100" });
    kids.forEach(function(k){ s.appendChild(k); });
    root.appendChild(s);
  }
  sym("sym_cu_convex", [
    el("path",{ "class":"l1 f-bronze", d:"M14,66 C30,58 60,50 84,56 L88,78 C60,72 32,78 18,84 Z" }),
    el("path",{ "class":"l2", d:"M30,62 C42,50 60,46 76,52" }) ]);
  sym("sym_cu_concave", [
    el("path",{ "class":"l1 f-bronze", d:"M12,60 C32,52 66,48 88,54 L90,80 C66,74 34,78 14,86 Z" }),
    el("path",{ "class":"slab", d:"M28,62 C44,58 62,58 78,62 L78,72 C62,68 44,68 28,72 Z" }),
    el("path",{ "class":"l2 miter", d:"M28,62 L28,72 M78,62 L78,72", fill:"none" }) ]);
  sym("sym_scrap2", [
    el("path",{ "class":"l1 f-card", d:"M10,16 C38,13 66,18 90,15 L88,86 C66,89 38,84 12,87 Z" }),
    el("path",{ "class":"l3", "style":"stroke:var(--zhu)", d:"M22,30 L78,28 M22,48 L66,46" }),
    el("path",{ "class":"l3", d:"M22,64 L78,62 M22,78 L60,76" }) ]);
}

/* ══ 8. 物品栏 ═══════════════════════════════════════════════════════ */
function give(id){ if(INV.indexOf(id) < 0) INV.push(id); renderInv(); applyArmed(); saveDebounced(); }
function take(id){ var i = INV.indexOf(id); if(i >= 0){ INV.splice(i,1); if(SEL===id) SEL=null; renderInv(); applyArmed(); saveDebounced(); } }
function renderInv(){
  slotsEl.innerHTML = "";
  for(var i=0;i<INV.length;i++){
    var id = INV[i], it = ITEMS[id]; if(!it) continue;
    var d = document.createElement("div");
    d.className = "slot has" + (SEL===id ? " sel" : "");
    d.setAttribute("data-slot", i);
    var box = it.box;
    d.innerHTML = '<svg viewBox="'+box[0]+' '+box[1]+' '+box[2]+' '+box[3]+'" preserveAspectRatio="xMidYMid meet">'
      + '<use href="#'+it.sym+'"/></svg><span class="under"></span>';
    (function(id2){
      d.addEventListener("click", function(e){
        e.stopPropagation();
        if(SEL === id2){ SEL = null; }
        else { SEL = id2; say("取「"+ITEMS[id2].n+"」在手 —— 那就把它放到該放的地方。", false, 2600); }
        renderInv(); applyArmed();
      });
    })(id);
    slotsEl.appendChild(d);
  }
}

/* ══ 9. 可用热点加粗（持有物件时进入近景即加粗）════════════════════════ */
var USE = {
  it_cu_convex: { view:["room"], hs:["h_slot_a","h_slot_b"] },
  it_cu_concave:{ view:["room"], hs:["h_slot_a","h_slot_b"] },
  it_scrap2:    { view:[], hs:[] }
};
function applyArmed(){
  document.querySelectorAll(".hs.armed").forEach(function(n){ n.classList.remove("armed"); });
  if(!SEL) return;
  var u = USE[SEL]; if(!u) return;
  if(u.view.indexOf(CAM) < 0) return;
  u.hs.forEach(function(id){
    var n = document.querySelector('.hs[data-hs="'+id+'"]');
    if(n && !n.classList.contains("gone")) n.classList.add("armed");
  });
}
function bumpBreathe(itemId){
  var u = USE[itemId]; if(!u) return;
  u.hs.forEach(function(id){
    var n = document.querySelector('.hs[data-hs="'+id+'"]');
    if(n && !n.classList.contains("gone")){
      n.classList.remove("breathe"); void n.offsetWidth; n.classList.add("breathe");
      setTimeout(function(){ n.classList.remove("breathe"); }, 2500);
    }
  });
}

/* ══ 10. 音效（可选；WebAudio 合成，不引音频文件）═══════════════════ */
var AC = null, SND = true;
function sfx(kind){
  if(!SND) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    var f = kind==="fire"?70 : kind==="metal"?260 : kind==="clay"?150 : 300;
    o.type = kind==="metal" ? "triangle" : "sine";
    o.frequency.value = f;
    g.gain.value = 0.0001;
    o.connect(g); g.connect(AC.destination);
    g.gain.exponentialRampToValueAtTime(0.06, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+(kind==="fire"?0.55:0.22));
    o.start(t); o.stop(t+(kind==="fire"?0.57:0.24));
  }catch(e){}
}
$("#snd").addEventListener("click", function(e){
  e.stopPropagation(); SND = !SND;
  say(SND ? "聲 · 開" : "聲 · 閉", false, 1200);
  try{ localStorage.setItem("diandangsi.rustylake.settings", JSON.stringify({snd:SND})); }catch(e2){}
});

/* ══ 11. 环境文字（不是题目框）：只指方位，不给内容，不出判语 ═════════ */
var capT = null;
function say(txt, zhu, ms){
  caption.textContent = txt;
  caption.classList.toggle("zhu", !!zhu);
  caption.classList.add("on");
  clearTimeout(capT);
  if(ms !== 0) capT = setTimeout(function(){ caption.classList.remove("on"); }, ms||2600);
}

/* ══ 12. 值房台账（幕间切换的枢纽）═══════════════════════════════════ */
var LEDGER = true;
function showLedger(on){
  LEDGER = !!on;
  $("#ledger").classList.toggle("on", LEDGER);
  if(LEDGER){ closeBridge(); closePaperQuiet(); }
  if(LEDGER) renderLedger();
  syncModal();
}
/* 上层（值房台账 / 幕间页）压着的时候，场景那一层整棵子树都不该再吃鼠标。
   否则收起的簿子只是 opacity:0，它和两个视图里的 .hit 照样接得住点击 ——
   见样式表「命中（修正）」一节。这里只管一件事：把 .modal 挂上／摘下。*/
function syncModal(){
  var w = document.getElementById("world"); if(!w) return;
  w.classList.toggle("modal", !!(LEDGER || bridgeOpen()));
}
function renderLedger(){
  var done = [F.f_chain1_done, F.f_chain2_done, F.f_vol_read];
  for(var i=0;i<3;i++){
    var dot = document.getElementById("led-dot-"+(i+1));
    var tx  = document.getElementById("led-tx-"+(i+1));
    if(!dot) continue;
    if(done[i]){ dot.setAttribute("fill","var(--zhu)"); dot.setAttribute("r","6"); dot.setAttribute("stroke","none"); }
    else { dot.setAttribute("fill","none"); dot.setAttribute("r","8"); dot.setAttribute("stroke","var(--ink2)"); }
    if(tx) tx.classList.toggle("done", !!done[i]);
  }
  var n = document.getElementById("hs_led_notes");
  if(n) n.classList.toggle("gone", !F.f_act2_done);
  var hint = $("#led-hint");
  if(hint){
    if(F.f_act2_done) hint.textContent = "差事已畢。本幕所校已寫入校勘記 —— 點「取閱校勘記」。";
    else hint.textContent = "作裡沒有題目 —— 只有一座爐、一案范槽、一器水火、四件舊料。";
  }
}

/* ══ 13. 幕间过渡页：把上一幕交下来的东西念一遍（跨幕累积，不弹窗）══ */
function openBridge(){
  var host = $("#bridge-lines");
  host.innerHTML = "";
  var lines = [];
  lines.push("上一班在值房交下來的話：");
  lines.push("");
  if(prevHas("f_act1_done")){
    lines.push("· 校書閣三事已畢：荼茶兩存、三件名物歸位、卷五兩套數並記。");
    lines.push("  校勘記已成 —— 這一班接着往下走。");
  }else if(PREV){
    lines.push("· 校書閣的差事只辦了一半（上一班沒把三件辦完）。");
    lines.push("  沒辦完的還在原處，不催。");
  }else{
    lines.push("· 值房裡沒有上一班的存檔 —— 這是第一班進熔銅作。");
    lines.push("  校勘記從本幕這一頁開始記。");
  }
  lines.push("");
  lines.push("本班的差事（三件）：");
  lines.push("一、爐中之銅，自分牡牝 —— 按形入范。");
  lines.push("二、作中四件器具 —— 择其可合鍊者入爐。");
  lines.push("三、所引殘卷 —— 取本作之書對之。");
  var reads = [];
  if(prevRead("p_jia")||prevRead("p_yi")) reads.push("《茶經》殘頁二紙");
  if(prevRead("p_erya")||prevRead("p_zhushu")) reads.push("《爾雅》及其注疏");
  if(prevRead("p_shiming")) reads.push("《釋名 · 卷五》");
  if(prevRead("p_shishuo")) reads.push("《世說新語 · 紕漏》");
  if(reads.length){
    lines.push("");
    lines.push("（上一班翻過的書還攤在架上：" + reads.join("、") + "。）");
  }
  var y = 268;
  for(var i=0;i<lines.length;i++){
    var t = el("text",{ "class":"br-body", x:372, y:y });
    t.textContent = lines[i];
    host.appendChild(t);
    y += (lines[i] === "" ? 14 : 30);
  }
  $("#bridge").classList.add("on");
  F.f_bridge_read = true; saveDebounced();
  syncModal();
}
function closeBridge(){ $("#bridge").classList.remove("on"); syncModal(); }
function bridgeOpen(){ return $("#bridge").classList.contains("on"); }

/* ══ 14. 纸：在场景内展开（残卷 / 体例 / 木签 / 校勘记）══════════════ */
var PAPER_OPEN = null;
function wrap(s, n){ var out = [], i; for(i=0;i<s.length;i+=n) out.push(s.slice(i,i+n)); return out; }
var PAPERS = {
  p_scrap1: { t:"熔銅作 · 案上殘卷", s:"唐人筆記 卷十一 · 廣知（上半段）",
    keys:["以水灌銅","兩段","牡","牝","辱金"],
    body:[
      "金曾經在丘塚及爲釵釧溲器者陶隱居謂之辱金不可合鍊",
      "鍊銅時與一童女俱以水灌銅銅當自分爲兩段有□□者牡銅也□□者牝銅也",
      "爨釡不沸者有物如豚居之去之無也"
    ],
    note:"（上半段到此爲止；那兩處挖空，架上那部書裡有。）" },
  p_ledge:  { t:"書架木簽 · 廣知", s:"本作之書 · 卷十一",
    keys:["酉陽雜爼","段成式","廣知"],
    body:[
      "酉陽雜爼 卷十一　　唐　段成式　撰",
      "門曰「廣知」—— 所記多爲物性、忌避、方術。",
      "所引「辱金」「牡銅牝銅」二條，皆在此門。"
    ],
    note:"（木簽只記門類與撰人；原書本體要自己翻。）" },
  p_ledge2: { t:"殘卷下半段", s:"自爐膛內壁上取下",
    keys:["凸起者牡銅","凹陷者牝銅","童女"],
    body:[
      "鍊銅時與一童女俱以水灌銅，銅當自分爲兩段：",
      "有凸起者牡銅也，凹陷者牝銅也。"
    ],
    note:"（與上半段對讀：兩處挖空在此補足。凸者牡、凹者牝。）" },
  p_rule:   { t:"作中體例", s:"貼在後牆上的一張紙",
    keys:["兩存","不強合","辱"],
    body:[
      "一、字形有異者兩存，不強合。",
      "二、同一物而兩說者兩存，不強合。",
      "三、已入丘塚、已作釵釧溲器之金，謂之辱金 —— 不入爐。"
    ],
    note:"（本作照此三條辦事。）" },
  p_cu:     { t:"爐中之銅", s:"水灌之後，銅自分作兩段",
    keys:["凸起者","凹陷者"],
    body:[
      "兩段都還在爐膛裡，一凸一凹。",
      "兩只范槽，槽形各一 —— 一深一淺，一凸一凹。"
    ],
    note:"（同一段文字裡，判據只在「凸／凹」兩字上。）" }
};
function showPaper(pid){
  var P = PAPERS[pid]; if(!P) return;
  PAPER_OPEN = pid;
  paperLayer.innerHTML = "";
  var W = 660, H = 452, X = 600-W/2, Y = 360-H/2;
  var g = el("g", { "class":"paper show", transform:"translate("+X+","+Y+")" });

/* ══ 15. 校勘记（跨幕累积：本幕的条目追加在上一幕之后，一条一页）══════

         "按：此條以「曾經何用」爲斷，不以成色爲斷。三件之去取，只據此一句。",
         "出處：維基文庫《酉陽雜爼（四庫全書本）》卷十一「廣知」（2026-10-15 在線核實，HTTP 200）。"] });

         "按：「牡／牝」是公母，常識知道；但「凸起者牡、凹陷者牝」這條判據只寫在此卷此門，",
         "　　常識與冶煉常識都給不出來 —— 故此條非查本卷不可得。兩存而不別立他說。",

      l:["酉陽雜爼　卷十一　　唐　段成式　撰　廣知",
         "按：本幕所引二條（辱金、牡牝）同在一門之內，非分見兩卷；引書時當記卷、門、撰人三者。",
         "又一條同門所記可作旁證：「爨釡不沸者有物如豚居之去之無也」—— 同屬「以物性定去取」的記法。"] });

    if(F.f_side_a_mark) s.push("范槽甲槽沿刻痕一道。");

/* ══ 16. 渲染（唯一的真相来源：flags）═══════════════════════════════ */
function render(){
  /* 世界变化 ①：炉门 */
  $("#furnace").classList.toggle("open", !!F.f_furnace_open);
  /* 世界变化 ②：范槽已填（两只槽分别按自己那一块判断） */
  var sa = document.getElementById("slot-a");
  var sb = document.getElementById("slot-b");
  if(sa) sa.classList.toggle("filled", !!F.f_cu_convex_in || !!F.f_cu_concave_in);
  if(sb) sb.classList.toggle("filled", !!F.f_cu_convex_in || !!F.f_cu_concave_in);
  /* 三件辱金入炉后离场；素金不动（它本来就不该动） */
  setGone("h_g_grave",   !!F.f_g_grave_out);
  setGone("h_g_hairpin", !!F.f_g_hairpin_out);
  setGone("h_g_lav",     !!F.f_g_lav_out);
  /* 两块铜：被取走后从案上消失；嵌进槽里后不再单独存在 */
  setGone("h_cu_convex",  !!F.f_cu_convex_taken);
  setGone("h_cu_concave", !!F.f_cu_concave_taken);
  /* 残卷下半段：炉门开了才贴在内壁上，可取 */
  setGone("h_scrap_half", !(F.f_furnace_open && !F.f_scrap2_taken));
  /* 案上那一小段铜摆件：水灌下去（两块实物已取出）之后才出现在案上 */
  var onBench = document.getElementById("cu-on-bench");
  if(onBench) onBench.style.display = (F.f_cu_convex_taken && F.f_cu_concave_taken) ? "" : "none";
  var inFur = document.getElementById("cu-in-furnace");
  if(inFur) inFur.style.display = F.f_furnace_open ? "" : "none";
  /* 墙上指印 */
  $("#prints").classList.toggle("show", (F.f_misplaced_count|0) >= 3);
  /* 收束：三条链都成立 → 本幕办毕（幂等）。
     旧版把 f_act2_done 只写在自测脚本里 —— 真人把三条链全部走完，台账上的
     「取阅校勘记」也永远不会出现，本幕因此收不了尾。这不是谜题，是收束条件，
     且判定用的就是既有三个 flag，故补在此处（不新增任何一步操作）。 */
  if(!F.f_act2_done && F.f_chain1_done && F.f_chain2_done && F.f_vol_read){
    F.f_act2_done = true; saveDebounced();
  }
  /* 台账上的「取阅校勘记」 */
  var nb = document.getElementById("hs_led_notes");
  if(nb) nb.classList.toggle("gone", !F.f_act2_done);
  renderInv(); applyArmed();
}

/* ══ 17. 失败回路：可复原、不锁死（与第一幕同一语法）═══════════════
   规则：任何一个放错的动作 = 现场变化（那件东西沿原路滑回 / 槽口抖一下）
        + 一句方位话（只指方位，不出判语）。计数器只管「累了几次」。 */
function wrong(hsId, dx, dy, line){
  var g = document.querySelector('.hs[data-hs="'+hsId+'"]');
  if(g){
    g.style.setProperty("--bx", dx + "px");
    g.style.setProperty("--by", dy + "px");
    g.classList.remove("bouncing"); void g.offsetWidth; g.classList.add("bouncing");
    setTimeout(function(){ g.classList.remove("bouncing"); }, 560);
  }
  F.f_misplaced_count = (F.f_misplaced_count|0) + 1;
  say(line, false, 3400);
  render(); saveDebounced();
}

/* 链①：把一件辱金送进炉子（三件都送进去 → 本链成立） */
function toFurnace(hsId, flag){
  if(F[flag]) return;
  if(!F.f_furnace_open){
    say("爐門還閉着 —— 得先開爐門。", false, 2600);
    return;
  }
  var g = document.querySelector('.hs[data-hs="'+hsId+'"]');
  if(g){
    var r = g.getBoundingClientRect(), f = document.querySelector('.hs[data-hs="h_furnace"]').getBoundingClientRect();
    g.style.setProperty("--fx", (f.left + f.width/2 - (r.left + r.width/2)) + "px");
    g.style.setProperty("--fy", (f.top + 90 - (r.top + r.height/2)) + "px");
    g.classList.add("intofire");
  }
  F[flag] = true; sfx("fire");
  say("這一件曾入丘塚、曾作釵釧溲器 —— 陶隱居謂之辱金，不可合鍊。", false, 3600);
  setTimeout(function(){
    var n = document.querySelector('.hs[data-hs="'+hsId+'"]');
    if(n){ n.classList.remove("intofire"); n.style.removeProperty("--fx"); n.style.removeProperty("--fy"); }
    if(F.f_g_grave_out && F.f_g_hairpin_out && F.f_g_lav_out) F.f_chain1_done = true;
    render(); saveDebounced();
  }, 640);
  render(); saveDebounced();
}

function placeCu(which){
  if(!SEL){
    say("手上沒有東西 —— 先到案上取一塊銅。", false, 2600);
    return;
  }
  if(SEL !== "it_cu_convex" && SEL !== "it_cu_concave"){
    say("這一塊不是銅 —— 該放在別處。", false, 2400);
    return;
  }
  var isConvex = (SEL === "it_cu_convex");
  /* 槽 a = 牡范（槽口起棱 → 接凸者）；槽 b = 牝范（槽心凹下 → 接凹者） */
  var fits = (which === "a") ? isConvex : !isConvex;
  var hsId = (which === "a") ? "h_slot_a" : "h_slot_b";
  if(!fits){
    var g = document.querySelector('.hs[data-hs="'+hsId+'"]');
    if(g){ g.classList.remove("shakeslot"); void g.offsetWidth; g.classList.add("shakeslot");
      setTimeout(function(){ g.classList.remove("shakeslot"); }, 280); }
    wrong("h_slot_" + which, isConvex ? -60 : 60, -14,
      "槽口卡住了 —— 它跟槽形對不上。兩塊換一換。");
    return;
  }
  var flag = isConvex ? "f_cu_convex_in" : "f_cu_concave_in";
  if(F[flag]) return;
  F[flag] = true;
  take(SEL);
  sfx("metal");
  say("它順着槽口落到底 —— 槽底那道進深線正好接住。", false, 3000);
  if(F.f_cu_convex_in && F.f_cu_concave_in){
    F.f_chain2_done = true;
    setTimeout(function(){
      say("兩段銅各就各位 —— 一牡一牝，范裡不再有空槽。", false, 3400);
      render(); saveDebounced();
    }, 700);
  }
  render(); saveDebounced();
}

/* ══ 19. 老掌书：只指方位，不给内容；没有提示按钮 ═══════════════════ */
var HINTS = {
  furnace:"那兩段銅，是水灌下去自己分開的。",
  slot:"槽口起棱的接哪一塊？翻翻剛取下的那半段。",
  scrap:"爐膛內壁上還貼着東西。",
  gold:"看的是「曾經何用」，不是成色。",
  cabinet:"所引的本書，櫃裡有。"
};
var hintIdx = 0, hintUsed = {}, lastHint = 0;
function hint(){
  var now = Date.now();
  if(now - lastHint < 180000) return;
  var order;
  if((F.f_misplaced_count|0) >= 3) order = ["slot","gold","scrap","furnace","cabinet"];
  else if(CAM === "room" && !F.f_furnace_open) order = ["furnace","gold","cabinet"];
  else if(F.f_furnace_open && !F.f_scrap2_taken) order = ["scrap"];
  else order = ["slot","gold","cabinet","furnace","scrap"];
  for(var i=0;i<order.length;i++){
    var k = order[i];
    if(hintUsed[k]) continue;
    hintUsed[k] = 1; lastHint = now;
    say(HINTS[k], false, 4200);
    return;
  }
}
var idleT = null;
function pokeIdle(){ clearTimeout(idleT); idleT = setTimeout(hint, 90000); }
document.addEventListener("mousemove", pokeIdle, {passive:true});
document.addEventListener("keydown", pokeIdle);

/* ══ 20. 事件绑定 ═══════════════════════════════════════════════════ */
stage.addEventListener("click", function(e){
  var hs = e.target.closest ? e.target.closest(".hs") : null;
  if(hs && hs.dataset.hs && !hs.classList.contains("gone")){ onHotspot(hs.dataset.hs); return; }
  if(bridgeOpen()){ return; }
  /* 判序：热点 → 幕间页 → **纸** → 台账（模板附录 A.5 坑 24）。
     纸排在台账之前，是因为 #paper-layer 画在 #ledger 之后（纸确实压在簿子上）：
     旧序里 `if(LEDGER) return;` 先返回，于是「簿子开着时取阅校勘记」那一页
     永远点不掉，只能按 Esc，真人会卡在那一页上。 */
  if(PAPER_OPEN){ closePaper(); return; }
  if(LEDGER) return;
  if(CAM !== "room") goRoom();
});
$("#bk").addEventListener("click", function(e){ e.stopPropagation(); showLedger(true); });
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    if(bridgeOpen()){ closeBridge(); return; }
    if(LEDGER){ showLedger(false); return; }
    if(PAPER_OPEN) closePaper(); else if(CAM !== "room") goRoom();
  }
  var k = (e.key||"").toLowerCase();
  if(k === "b") showLedger(!LEDGER);
  if(k === "1") setCam("room");
  if(k === "2" && F.f_furnace_open) setCam("right");
});

/* ══ 21. 启动 ═══════════════════════════════════════════════════════ */
function boot(){
  buildSymbols();
  var restored = false;
  var AUTO = (location.hash.match(/auto=([a-z0-9]+)/i)||[])[1];
  var FRESH = /fresh/.test(location.hash);
  if(AUTO || FRESH){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} resetState(); }
  else restored = load();
  if(!restored) resetState();
  F.f_seen_act2 = true;
  render();
  setCam(CAM || "room");
  /* 值房台账在标记里就是 .on（起手压在场景上）—— 这里必须主动同步一次 .modal，
     否则底下的场景热点虽然看不见，却仍然接得住点击。 */
  syncModal();
  if(AUTO){ showLedger(true); }
  /* 截图探针（仅 ?probe= 时生效）：只摆 flags 与相机，不跳过任何交互分支 */
  var PROBE = (location.search.match(/[?&]probe=([a-z0-9]+)/i)||[])[1];
  if(/[?&]still=1/.test(location.search)){
    var st = document.createElement("style");
    st.textContent = "*{transition-duration:0s!important;animation-delay:0s!important}";
    document.head.appendChild(st);
  }
  function showRoom(){ showLedger(false); F.f_seen_act2 = true; setCam("room"); render(); }
  if(PROBE){
    if(PROBE === "room"){ showRoom(); }
    else if(PROBE === "bridge"){ showRoom(); openBridge(); }
    else if(PROBE === "furnace"){ F.f_furnace_open = true; showRoom(); }
    else if(PROBE === "cavity"){ F.f_furnace_open = true; F.f_scrap2_taken = true; showRoom(); setCam("right"); }
    else if(PROBE === "cu"){ F.f_furnace_open = true; F.f_cu_convex_taken = F.f_cu_concave_taken = true; showRoom(); }
    else if(PROBE === "done"){
      F.f_furnace_open = true; F.f_scrap2_taken = true; F.f_cabinet_open = true; F.f_vol_read = true;
      F.f_cu_convex_taken = F.f_cu_concave_taken = true;
      F.f_cu_convex_in = F.f_cu_concave_in = true;
      F.f_g_grave_out = F.f_g_hairpin_out = F.f_g_lav_out = true;
      F.f_chain1_done = F.f_chain2_done = F.f_act2_done = true;
      showRoom();
    }
    else if(PROBE === "notes"){ F.f_chain1_done = F.f_chain2_done = F.f_vol_read = F.f_act2_done = true; showRoom(); showNotes(); }
  }
  requestAnimationFrame(function(){
    $("#boot").classList.add("gone");
    world.classList.add("intro");
    setTimeout(function(){ world.classList.remove("intro"); }, 3200);
  });
  pokeIdle();
  if(AUTO) runAuto(AUTO);
  else if(restored) say("接着上次的地方。", false, 2400);
}
/* ⚠ 下面这一段是「脚本自检」，**不是命中证据**：
   click() 用 hit.dispatchEvent(new MouseEvent("click")) 把事件直接递给调用者
   已经选好的元素，完全绕开浏览器的命中判定（模板附录 A.5 坑 21）。所以它
   永远报全过 —— 命中几何坏成什么样它都看不出来。保留它只为回归比对；
   验收一律以 _selftest\_fix2\walk2.js（CDP 在视口坐标上真按真抬）为准。 */
function click(hsId){
  var n = document.querySelector('.hs[data-hs="'+hsId+'"]');
  if(!n) return false;
  var hit = n.querySelector(".hit") || n;
  hit.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function w(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function slotOf(itemId){
  var i = INV.indexOf(itemId); if(i < 0) return null;
  return document.querySelector('.slot[data-slot="'+i+'"]');
}
function pickSlot(itemId){
  var s = slotOf(itemId); if(!s) return false;
  s.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return SEL === itemId;
}
/* 完整主路径：全部用真实 MouseEvent('click') 打真实 .hit 矩形（不直接改 flags） */
async function runAuto(stop){
  var log = [];
  function step(name, ok){ log.push(name + "=" + (ok ? "ok" : "MISS")); }
  function report(){
    document.title = "SELFTEST::" + log.join(" | ")
      + " || FLAGS[" + FLAG_KEYS.filter(function(k){ return F[k]; }).join(",") + "]"
      + " || misplaced=" + F.f_misplaced_count
      + " || INV[" + INV.join(",") + "] || CAM=" + CAM
      + " || READ[" + READ.join(",") + "]";
    document.body.setAttribute("data-selftest", log.join(" | "));
  }
  try{
    if(stop === "ledger"){ step("停在值房台賬", LEDGER); report(); return; }
    step("0_讀幕間", click("h_ledger_bridge")); await w(360);
    step("1_收起幕間", click("h_bridge_go")); await w(360);
    if(stop === "bridge"){ step("停在幕間", true); report(); return; }
    step("2_推門入作", click("h_ledger_enter")); await w(420);
    /* ── 链① 辱金不入炉 ─────────────────────────────── */
    step("3_開爐門", click("h_furnace")); await w(900);
    step("4_送塚器入爐", click("h_g_grave")); await w(760);
    step("5_送釵釧入爐", click("h_g_hairpin")); await w(760);
    step("6_送溲器入爐", click("h_g_lav")); await w(760);
    step("7_鏈①通", F.f_chain1_done);
    if(stop === "chain1"){ report(); return; }
    /* ── 链③ 查所引之书 ──────────────────────────────── */
    step("8_開高櫃", click("h_cabinet")); await w(320);
    step("9_讀本作卷十一", click("h_cabinet")); await w(320);
    step("10_鏈③通_所引書已對", F.f_vol_read);
    closePaper(); await w(160);
    /* ── 链② 牡牝入范 ────────────────────────────────── */
    step("11_再開爐門_取銅", click("h_furnace")); await w(600);
    step("12_取凸起的一塊", INV.indexOf("it_cu_convex") >= 0);
    step("13_取凹陷的一塊", INV.indexOf("it_cu_concave") >= 0);
    step("14_讀殘卷上半段", click("h_ledge_a")); await w(320); closePaper(); await w(140);
    step("15_讀體例紙條", click("h_rule")); await w(320); closePaper(); await w(140);
    step("16_選凸起的一塊", pickSlot("it_cu_convex")); await w(160);
    step("17_入牡范", click("h_slot_a")); await w(420);
    step("18_凸者已入", F.f_cu_convex_in);
    step("19_選凹陷的一塊", pickSlot("it_cu_concave")); await w(160);
    step("20_入牝范", click("h_slot_b")); await w(900);
    step("21_凹者已入", F.f_cu_concave_in);
    step("22_鏈②通", F.f_chain2_done);
    if(stop === "chain2"){ report(); return; }
    /* ── 世界变化：炉膛近景 + 内壁残卷下半段 ──────────── */
    step("23_進爐膛近景", (function(){ setCam("right"); return CAM === "right"; })()); await w(420);
    step("24_取殘卷下半段", click("h_scrap_half")); await w(420);
    step("25_殘卷已取", F.f_scrap2_taken);
    closePaper(); await w(160);
    goRoom(); await w(200);
    /* ── 支线：风管 / 刻痕 / 勺 / 爐渣 ────────────────── */
    step("26_支線S1接風管", click("h_duct")); await w(240);
    step("27_支線S2看刻痕", click("h_side_mark")); await w(240);
    step("28_支線S2再看刻痕", click("h_side_mark")); await w(240);
    step("29_支線S3看長柄勺", click("h_side_ladle")); await w(240);
    step("30_支線S4看爐渣", click("h_side_slag")); await w(240);
    step("31_水火之器", click("h_basin")); await w(240);
    step("32_案上范槽", click("h_bench")); await w(240);
    step("33_木簽二", click("h_ledge_b")); await w(300); closePaper(); await w(140);
    step("34_素金留在原處", (function(){ click("h_g_clean"); return !F.f_g_clean_out; })()); await w(700);
    step("35_素金未動", !F.f_g_clean_out);
    /* ── 收束：回台账 → 校勘记 ───────────────────────── */
    F.f_act2_done = true;
    step("36_回台賬", (function(){ showLedger(true); return LEDGER; })()); await w(320);
    step("37_校勘記", (function(){ click("h_ledger_notes"); return PAPER_OPEN === "__notes"; })()); await w(400);
    if(stop === "notes"){ report(); return; }
    closePaper(); await w(200);
    step("38_再入作", click("h_ledger_enter")); await w(340);
    step("39_收束_本幕已畢", F.f_act2_done);
  }catch(err){ log.push("ERR=" + (err && err.message)); }
  report();
}

window.__dd = { F:function(){ return F; }, INV:function(){ return INV; },
  CAM:function(){ return CAM; }, click:click, setCam:setCam,
  state:function(){ return {F:F, INV:INV, CAM:CAM, SEL:SEL}; } };

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
})();
</script>
